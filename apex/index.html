<!doctype html>
<html lang="en">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>APEX Expert Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a 12-week wall calendar of day tiles; clicking a tile opens that day's lesson with collapsible topics. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --sunk:#eef0f6; --fg:#1b2030; --muted:#5d6478; --line:#dde1ec;
  --accent:#3550c8; --accent-ink:#ffffff; --accent-soft:#e6eaff;
  --js:#b7791f; --js-soft:#fbf1df; --css:#2b6cb0; --css-soft:#e3eefa; --apex:#2f855a; --apex-soft:#e2f3ea; --prod:#805ad5; --prod-soft:#efe9fb;
  --good:#2f855a; --bad:#c53030; --code-bg:#161a26; --code-fg:#e4e7f2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131c; --surface:#181c28; --sunk:#202536; --fg:#e6e9f3; --muted:#9aa2b8; --line:#2c3347;
  --accent:#8299ff; --accent-ink:#0f1320; --accent-soft:#232c52;
  --js:#e7b45a; --js-soft:#352a17; --css:#7fb2ec; --css-soft:#1a2b40; --apex:#6fcf9a; --apex-soft:#17321f; --prod:#b69cf2; --prod-soft:#2a2242;
  --good:#6fcf9a; --bad:#f08080; --code-bg:#0b0d14; --code-fg:#e4e7f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#181c28; --sunk:#202536; --fg:#e6e9f3; --muted:#9aa2b8; --line:#2c3347;
  --accent:#8299ff; --accent-ink:#0f1320; --accent-soft:#232c52;
  --js:#e7b45a; --js-soft:#352a17; --css:#7fb2ec; --css-soft:#1a2b40; --apex:#6fcf9a; --apex-soft:#17321f; --prod:#b69cf2; --prod-soft:#2a2242;
  --good:#6fcf9a; --bad:#f08080; --code-bg:#0b0d14; --code-fg:#e4e7f2; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.top .sub{max-width:60ch;color:var(--muted);margin-top:6px}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.sync{font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.chip.js{background:var(--js-soft);color:var(--js)} .chip.css{background:var(--css-soft);color:var(--css)}
.chip.apex{background:var(--apex-soft);color:var(--apex)} .chip.prod{background:var(--prod-soft);color:var(--prod)}

/* calendar */
.week{margin-bottom:22px}
.week-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.week-head h2{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;min-height:118px;color:var(--fg);border-top:4px solid var(--tc,var(--line))}
.tile.js{--tc:var(--js)} .tile.css{--tc:var(--css)} .tile.apex{--tc:var(--apex)} .tile.prod{--tc:var(--prod)}
.tile .d{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .d b{font-family:var(--f-display);font-size:18px;color:var(--fg)}
.tile .t{font-weight:600;font-size:13.5px;line-height:1.3}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile.ready:hover{border-color:var(--accent)}
.tile.locked{opacity:.62;cursor:default}
.tile.today{box-shadow:0 0 0 2px var(--accent)}
.tile .badge{font-size:11px;font-weight:600;margin-top:auto}
.tile.done .badge{color:var(--good)}
.tile.review{background:var(--sunk)}

/* day view */
.back{background:none;border:0;color:var(--accent);padding:0;font-weight:600;margin-bottom:14px}
.day-head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.day-head .goal{max-width:65ch;color:var(--muted);margin-top:6px}
.plan{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.plan span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.done-btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.done-btn.is-done{background:var(--apex-soft);color:var(--good)}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.topic>summary{list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
details.topic>summary::-webkit-details-marker{display:none}
.caret{flex:none;width:22px;height:22px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;transition:transform .15s;margin-top:1px}
details[open]>summary .caret{transform:rotate(90deg)}
.topic .what{color:var(--muted);font-size:13.5px;margin-top:3px}
.topic .count{margin-left:auto;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbody{padding:0 18px 20px;display:grid;gap:18px;min-width:0}
.tbody>*{min-width:0}
.tbody p+p{margin-top:8px}
.prose{max-width:72ch}
.block-title{font-family:var(--f-display);font-weight:700;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.block-title .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px;max-width:75ch}
ol.steps li::marker{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.path{font-family:var(--f-mono);font-size:12.5px;background:var(--apex-soft);color:var(--apex);padding:1px 6px;border-radius:4px}
pre{margin:0;font:13px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;max-width:75ch;font-size:14px}
.callout.warn{border-color:var(--js);background:var(--js-soft)}
.shot{margin:0;border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:14px;align-items:center;background:var(--sunk)}
.shot svg{flex:none;color:var(--muted)}
.shot figcaption{font-size:13px}
.shot figcaption b{display:block;font-size:13.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cols>*{min-width:0}

/* runnable code */
.runner{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.runner .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--sunk);font-size:12px;color:var(--muted)}
.runner textarea{display:block;width:100%;box-sizing:border-box;border:0;resize:vertical;min-height:120px;font:13px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:12px 14px;tab-size:2}
.runner textarea.text{background:var(--surface);color:var(--fg);font-family:var(--f-body);font-size:14px;min-height:90px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:4px 11px;font-size:12.5px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.out{font:12.5px/1.5 var(--f-mono);padding:10px 14px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word;min-height:20px}
.out .err{color:var(--bad)} .out .ok{color:var(--good)} .out .dim{color:var(--muted)}
.fakepage{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.fakepage label{display:grid;gap:2px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.fakepage input{font:13px var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:130px}
.fakepage input.hidden-item{opacity:.35}
.banner{margin:8px 14px 0;padding:6px 10px;border-radius:6px;font-size:13px}
.banner.ok{background:var(--apex-soft);color:var(--good)} .banner.bad{background:#c5303022;color:var(--bad)}

/* exercises */
.ex{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.ex-head{display:flex;gap:10px;align-items:baseline}
.ex-tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.ex-tag.t2{background:var(--js-soft);color:var(--js)} .ex-tag.t3{background:var(--prod-soft);color:var(--prod)}
.ex .q{max-width:72ch}
.ex-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--muted);margin-left:auto}
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.reveal pre{margin-top:6px}

/* quiz */
.quiz{display:grid;gap:12px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.qz .opts{display:grid;gap:6px;margin-top:8px}
.qz button.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 10px;font-size:14px}
.qz button.opt.right{border-color:var(--good);background:var(--apex-soft)}
.qz button.opt.wrong{border-color:var(--bad);background:#c5303018}
.qz .why{font-size:13.5px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ===================== WEEK 1 LESSON CONTENT ===================== -->

<template id="day-1">
  <div data-goal="Know every place JavaScript can live in an APEX app, and write modern variables and strings."></div>

  <details class="topic">
    <summary><span class="caret">›</span><div><h3>The five places JavaScript lives in APEX</h3><p class="what">Page attributes, Dynamic Actions, static files, app-level URLs, and the browser console. Which to use when.</p></div><span class="count"></span></summary>
    <div class="tbody">
      <div class="prose">
        <p>You already write PL/SQL for the server side. The browser side has five places code can go. Picking the right one is the first expert habit: put code where it is easy to find, cache and reuse.</p>
      </div>
      <div>
        <div class="block-title">Where each one sits</div>
        <div class="cols">
          <div class="callout"><b>1. Function and Global Variable Declaration</b><br>Page Designer → page → <span class="path">JavaScript</span>. Functions used only on this page.</div>
          <div class="callout"><b>2. Execute when Page Loads</b><br>Same panel. Runs once after the page renders. Wiring and first setup.</div>
          <div class="callout"><b>3. Dynamic Action → Execute JavaScript Code</b><br>Runs on an event. Keep it short: call a function instead of writing 50 lines here.</div>
          <div class="callout"><b>4. Static Application Files</b><br>A real <code>.js</code> file, cached by the browser, shared by all pages. Where serious code goes (Day 5).</div>
          <div class="callout"><b>5. Browser console (F12)</b><br>Try things live on a running page. Nothing is saved, so it's for experiments only.</div>
        </div>
      </div>
      <div>
        <div class="block-title">Steps in your workspace <span class="n">~10 min</span></div>
        <ol class="steps">
          <li>Sign in to your APEX workspace and open any app (or create one: <span class="path">App Builder → Create → New Application</span>, name it <b>JS Lab</b>).</li>
          <li>Open <b>Page 1</b> in Page Designer.</li>
          <li>In the left tree, click the page name (the top node, e.g. <i>Page 1: Home</i>).</li>
          <li>In the right Property Editor, scroll to the <span class="path">JavaScript</span> group. You'll see <b>File URLs</b>, <b>Function and Global Variable Declaration</b> and <b>Execute when Page Loads</b>.</li>
          <li>In <b>Function and Global Variable Declaration</b>, paste:<pre>function sayHello(name) {
  return `Hello ${name}, page loaded at ${new Date().toLocaleTimeString()}`;
}</pre></li>
          <li>In <b>Execute when Page Loads</b>, paste: <code>console.log(sayHello('Anand'));</code></li>
          <li>Save and Run the page. Press <b>F12</b> (Mac: <b>⌥⌘I</b>), open the <b>Console</b> tab, and find your message.</li>
          <li>Still in the console, type <code>sayHello('Console')</code> and press Enter. The function is global, so the console can call it.</li>
        </ol>
      </div>
      <figure class="shot" data-shot="d1-page-js"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><figcaption><b>Screenshot: Page Designer → page JavaScript properties</b>To be captured from your own workspace. Sign in to APEX in Claude's browser pane and say "capture Day 1 screenshots".</figcaption></figure>
      <figure class="shot" data-shot="d1-console"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><figcaption><b>Screenshot: DevTools console showing the sayHello message</b>To be captured from your own workspace.</figcaption></figure>
      <div>
        <div class="block-title">Example A: page-load setup</div>
        <div class="demo" data-kind="js" data-page="P1_ENAME=KING;P1_DEPTNO=10"><pre>// Execute when Page Loads
const ename = apex.item('P1_ENAME').getValue();
console.log(`Editing employee ${ename}`);
apex.item('P1_DEPTNO').setValue('20');
console.log('Department defaulted to', $v('P1_DEPTNO'));</pre></div>
      </div>
      <div>
        <div class="block-title">Example B: a global helper called from a Dynamic Action</div>
        <div class="demo" data-kind="js" data-page="P1_SAL=4500"><pre>// Function and Global Variable Declaration
function bonus(sal) { return sal * 0.1; }

// Dynamic Action (Change on P1_SAL) → Execute JavaScript Code
const sal = Number($v('P1_SAL'));
console.log(`Bonus for ${sal} is ${bonus(sal)}`);</pre></div>
        <p class="muted" style="margin-top:6px;font-size:13px">The play pages here imitate <code>apex.item</code>, <code>$v</code>, <code>$s</code> and <code>apex.message</code>, so you can run code without a workspace. Edit the boxes above and press Run.</p>
      </div>
      <div class="block-title">Your exercises</div>
      <div class="ex" data-id="d1-t1-e1" data-kind="js" data-page="P1_FIRST=Asha;P1_LAST=Rao">
        <p class="q">Write a global function <code>fullName()</code> that reads <code>P1_FIRST</code> and <code>P1_LAST</code> and returns <code>"Rao, Asha"</code>. Then log it.</p>
        <pre class="start">function fullName() {
  // your code
}
console.log(fullName());</pre>
        <div class="hint">Use <code>$v('P1_FIRST')</code> or <code>apex.item('P1_FIRST').getValue()</code>, then a template literal.</div>
        <pre class="sol">function fullName() {
  return `${$v('P1_LAST')}, ${$v('P1_FIRST')}`;
}
console.log(fullName());</pre>
      </div>
      <div class="ex" data-id="d1-t1-e2" data-kind="js" data-page="P2_AMOUNT=1250000">
        <p class="q">New scenario, an invoice page. Write <code>formatAmount(n)</code> that returns the amount formatted in Indian grouping, e.g. <code>12,50,000.00</code>. Read <code>P2_AMOUNT</code>, format it, and write it back with <code>$s</code>.</p>
        <pre class="start">function formatAmount(n) {
  // your code
}
</pre>
        <div class="hint"><code>Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2 })</code></div>
        <pre class="sol">function formatAmount(n) {
  return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
$s('P2_AMOUNT', formatAmount($v('P2_AMOUNT')));
console.log($v('P2_AMOUNT'));</pre>
      </div>
      <div class="ex" data-id="d1-t1-e3" data-kind="text">
        <p class="q">Stretch: for each case, which of the five places would you choose, and why? (a) a function used by 30 pages, (b) hiding a region when a checkbox changes, (c) setting focus on the first item when the page opens, (d) testing what <code>apex.item('P5_X').getValue()</code> returns right now.</p>
        <pre class="start"></pre>
        <div class="hint">Think about reuse, browser caching and how short the code is.</div>
        <pre class="sol">(a) Static Application File, loaded once and cached, one place to fix bugs.
(b) Dynamic Action (Change on the checkbox). Use a declarative Hide/Show action, no JS needed at all.
(c) Execute when Page Loads (or the page's "Cursor Focus" attribute, no JS).
(d) Browser console on the running page.</pre>
      </div>
    </div>
  </details>

  <details class="topic">
    <summary><span class="caret">›</span><div><h3>let, const and template literals</h3><p class="what">Stop using var. Build strings with ${…} instead of +.</p></div><span class="count"></span></summary>
    <div class="tbody">
      <div class="prose">
        <p><b>const</b> is a name you won't reassign. Use it by default. <b>let</b> is for values that change, like counters and running totals. <b>var</b> is the old form, scoped to the whole function and easy to leak. Avoid it in new code.</p>
        <p>A <b>template literal</b> uses backticks and <code>${expression}</code>. It replaces string concatenation and can span lines, which is handy for building HTML.</p>
      </div>
      <div class="callout warn"><b>Common trap:</b> <code>const</code> stops you reassigning the name. It does not freeze the contents. <code>const emp = {sal: 100}; emp.sal = 200;</code> is allowed.</div>
      <div class="cols">
        <div><div class="block-title">Example A: scope</div>
        <div class="demo" data-kind="js"><pre>for (var i = 0; i &lt; 3; i++) {}
console.log('var i after loop:', i);   // leaks: 3

for (let j = 0; j &lt; 3; j++) {}
console.log(typeof j);                 // 'undefined'</pre></div></div>
        <div><div class="block-title">Example B: building HTML</div>
        <div class="demo" data-kind="js"><pre>const emp = { ename: 'SCOTT', job: 'ANALYST', sal: 3000 };
const card = `
&lt;div class="emp-card"&gt;
  &lt;h3&gt;${emp.ename}&lt;/h3&gt;
  &lt;p&gt;${emp.job} · ${emp.sal * 12} per year&lt;/p&gt;
&lt;/div&gt;`;
console.log(card);</pre></div></div>
      </div>
      <div class="callout warn"><b>Security preview (Week 11):</b> never put user-typed values into HTML unescaped. In APEX, wrap them in <code>apex.util.escapeHTML(value)</code>.</div>
      <div class="block-title">Your exercises</div>

      </div>

      <div class="ex" data-id="d2-t2-e3" data-kind="text">
        <p class="q">Stretch: explain in your own words, as you would to a junior developer, why <code>function(){}</code> loses <code>this</code> and <code>() =&gt; {}</code> doesn't. Two or three sentences.</p>
        <pre class="start"></pre>

<template id="day-5">
  <div data-goal="Organise JavaScript like a professional: one namespace, one file, loaded once and cached."></div>
  <details class="topic">
    <summary><span class="caret">›</span><div><h3>The namespace pattern: one global, everything inside it</h3><p class="what">Like a PL/SQL package: public API, private helpers, no name clashes.</p></div><span class="count"></span></summary>
    <div class="tbody">
      <div class="prose"><p>Every global function you write could clash with another page, a plug-in or APEX itself. The expert habit is <b>one</b> global object per app, like a PL/SQL package spec, with private helpers hidden in a closure, like the package body.</p></div>
      <pre>window.hr = window.hr || {};          // package "spec"
hr.emp = (function () {
  const MAX_SAL = 5000;               // private, like a body-level constant
  function fmt(n) { return Number(n).toLocaleString('en-IN'); }  // private
  return {                            // public API
    annual: sal => sal * 12,
    label: e => `${e.ename} (${fmt(e.sal)})`,
    isValid: sal => sal > 0 && sal &lt;= MAX_SAL
  };
})();</pre>
      <div class="cols">
        <div><div class="block-title">Example A: using the package</div>
        <div class="demo" data-kind="js"><pre>window.hr = window.hr || {};
hr.emp = (function () {
  const MAX_SAL = 5000;
  const fmt = n => Number(n).toLocaleString('en-IN');
  return {
    annual: sal => sal * 12,
    label: e => `${e.ename} (${fmt(e.sal)})`,
    isValid: sal => sal > 0 && sal &lt;= MAX_SAL
  };
})();
console.log(hr.emp.label({ ename: 'KING', sal: 5000 }));
console.log(hr.emp.isValid(7000));
console.log(typeof fmt); // 'undefined': private</pre></div></div>
        <div><div class="block-title">Example B: private state</div>
        <div class="demo" data-kind="js"><pre>const counter = (function () {
  let clicks = 0;                // nobody outside can reset this
  return {
    click: () => ++clicks,
    get count() { return clicks; }
  };
})();
counter.click(); counter.click();
console.log(counter.count);
counter.clicks = 99;            // creates a new property, doesn't touch the private one
console.log(counter.count);</pre></div></div>

      <div class="ex" data-id="d5-t1-e2" data-kind="js">
        <p class="q">New scenario, a library app. Build <code>lib.loans</code> with a private <code>Map</code> of loans and public <code>borrow(bookId, member)</code>, <code>giveBack(bookId)</code> and <code>whoHas(bookId)</code>. Borrowing a book that's already out should return <code>false</code>.</p>
        <pre class="start">// your code
</pre>
        <div class="hint"><code>const loans = new Map();</code> then <code>loans.has / set / delete / get</code>.</div>
        <pre class="sol">window.lib = window.lib || {};
lib.loans = (function () {
  const loans = new Map();
  return {
    borrow(id, member) { if (loans.has(id)) return false; loans.set(id, member); return true; },
    giveBack(id) { return loans.delete(id); },
    whoHas(id) { return loans.get(id) ?? 'available'; }
  };
})();

lib.loans.giveBack('B1');
console.log(lib.loans.whoHas('B1'));</pre>
      </div>
      <div class="ex" data-id="d5-t1-e3" data-kind="text">
        <p class="q">Stretch: map these PL/SQL package ideas to the JS pattern: package spec, package body, a body-level variable, a public function, package initialisation section.</p>
        <pre class="start"></pre>
        <div class="hint">The IIFE runs once, so what does that match?</div>
        <pre class="sol">Spec → the returned object (public API).
Body → the IIFE's function scope.
Body-level variable → const/let declared inside the IIFE (private, lives for the page).
Public function → a property of the returned object.
Initialisation section → code at the top of the IIFE before `return`; it runs once when the file loads.</pre>

    <div class="tbody">
      <div class="prose"><p>Code in page attributes is sent with every page view and can't be cached or reused. A static file is downloaded once, cached by the browser, and can be minified. This is how professional APEX apps are built.</p></div>

/* ===================== STATE + SAVING ===================== */
const LS = 'apexdrills.v1';
const state = { answers:{}, days:{}, quiz:{} };
let db = null, uid = null;
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
(function(){ const l = lsRead(); if(l){ Object.assign(state.answers, l.answers||{}); Object.assign(state.days, l.days||{}); Object.assign(state.quiz, l.quiz||{}); } })();

function setSync(t){ document.getElementById('sync').textContent = t; }
const timers = {};
function saveAnswer(id, text){
  state.answers[id] = { text, at: Date.now() };
  lsWrite(); updateStats();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    if(!db || !uid){ remote.push('answers', id, state.answers[id]); return; }
    try{ await db.doc(`data/users/${uid}/answers/${id}`).set(state.answers[id]); setSync('All work saved to your account'); }
    catch(e){ setSync('Saved on this device; account save failed, will retry on next edit'); }
  }, 900);
}
async function saveDoc(path, data){
  lsWrite(); updateStats();
  if(!db || !uid){ const [kind, id] = path.split('/'); remote.push(kind, id, data); return; }
  try{ await db.doc(`data/users/${uid}/${path}`).set(data); setSync('All work saved to your account'); }catch(e){ setSync('Saved on this device only'); }
}

async function connect(){
  if(!window.claude?.use){ remote.start(); return; }
  const timeout = setTimeout(()=>setSync('Saving on this device only'), 10000);
  try{
    const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!d || !user){ clearTimeout(timeout); remote.start(); return; }
    uid = await user.id();
    if(!uid){ clearTimeout(timeout); setSync('Saving on this device only'); return; }
    db = d;
    const merge = (col, target, wrap) => new Promise(res => {
      let first = true;
      db.collection(`data/users/${uid}/${col}`).onSnapshot(snap => {
        clearTimeout(timeout);
        snap.docs.forEach(doc => {
          const v = doc.data(); const cur = target[doc.id];
          if(!cur || (v.at||0) >= (cur.at||0)) target[doc.id] = v;
        });
        if(first){
          first = false;
          // push up anything only this device has (never lose work)
          Object.keys(target).forEach(k => { if(!snap.docs.some(x=>x.id===k)) db.doc(`data/users/${uid}/${col}/${k}`).set(target[k]).catch(()=>{}); });
          res();
        }
        lsWrite(); updateStats(); refreshOpenView();
      }, () => { clearTimeout(timeout); setSync('Saving on this device only'); res(); });
    });
    await Promise.all([merge('answers', state.answers), merge('days', state.days), merge('quiz', state.quiz)]);
    setSync('All work saved to your account');
  }catch(e){ clearTimeout(timeout); setSync('Saving on this device only'); }
}

/* ===================== SYNC FOR THE GITHUB COPY =====================
   On github.io there is no Claude account, so answers go to the family
   Worker (private routes, parent passphrase). Newer copy always wins on
   both sides; the server also keeps every version. Unsent saves wait in
   this browser and retry, so nothing typed offline is lost. */
const remote = (function(){
  const API = 'https://drills-api.anandm401-amazon.workers.dev';
  const QK = 'apexdrills.queue', KEY = 'dd:parentKey';
  let on = false, timer = null, busy = false;
  const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const put = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
  let queue = (() => { try{ return JSON.parse(get(QK)) || {}; }catch(e){ return {}; } })();
  const saveQ = () => put(QK, JSON.stringify(queue));
  const key = () => get(KEY) || '';
  async function call(path, body){
    const r = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: key(), ...body }) });
    const j = await r.json().catch(() => ({}));
    if(r.status === 401) throw Object.assign(new Error('wrong key'), { code: 401 });
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  function push(kind, id, data){
    queue[kind + '/' + id] = { kind, id, data }; saveQ();
    if(!on) return;
    clearTimeout(timer); timer = setTimeout(flush, 1000);
  }
  async function flush(){
    if(!on || busy) return;
    const docs = Object.values(queue).slice(0, 300);
    if(!docs.length){ setSync('Synced to all your devices'); return; }
    busy = true;
    try{
      await call('/apex', { docs });
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
      setSync('Synced to all your devices');
      if(Object.keys(queue).length) setTimeout(flush, 200);
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }finally{ busy = false; }
  }
  async function pull(){
    if(!on) return;
    try{
      const j = await call('/apex/read', {});
      const merge = (src, target, kind) => {
        Object.entries(src || {}).forEach(([id, v]) => {
          const cur = target[id];
          if(!cur || (v.at||0) > (cur.at||0)) target[id] = v;
          else if((cur.at||0) > (v.at||0)) queue[kind + '/' + id] = { kind, id, data: cur };
        });
        Object.keys(target).forEach(id => { if(!(src||{})[id]) queue[kind + '/' + id] = { kind, id, data: target[id] }; });
      };
      merge(j.answers, state.answers, 'answers'); merge(j.days, state.days, 'days'); merge(j.quiz, state.quiz, 'quiz');
      saveQ(); lsWrite(); updateStats(); refreshOpenView();
      await flush();
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }
  }
  function askKey(msg){
    const box = document.getElementById('sync');
    box.innerHTML = `<form id="keyform" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <label for="keyin">${msg}</label>
      <input id="keyin" type="password" autocomplete="current-password" style="font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:150px">
      <button class="btn primary" type="submit">Sync</button></form>`;
    box.querySelector('#keyform').onsubmit = e => {
      e.preventDefault();
      const v = box.querySelector('#keyin').value.trim(); if(!v) return;
      put(KEY, v); on = true; setSync('Syncing…'); pull();
    };
  }
  function start(){
    if(!key()){ askKey('To sync across devices, enter the parent-page passphrase:'); return; }
    on = true; setSync('Syncing…'); pull();
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pull(); });
    window.addEventListener('online', flush);
    setInterval(() => { if(Object.keys(queue).length) flush(); }, 30000);
  }
  return { push, start };
})();

/* ===================== HELPERS ===================== */
const dayDate = n => { const d = new Date(START); d.setDate(d.getDate() + n - 1); return d; };
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const fmtDay = d => d.toLocaleDateString('en-GB', { weekday:'short' });
const fmtFull = d => d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasContent = n => !!document.getElementById('day-' + n);

function updateStats(){
  document.getElementById('st-done').textContent = Object.values(state.days).filter(d=>d && d.done).length;
  document.getElementById('st-ex').textContent = Object.values(state.answers).filter(a => a && a.text && a.text.trim().length > 15).length;
  // streak: consecutive done days ending at the latest done day on or before today
  let s = 0; const today = new Date();
  let n = Math.floor((today - START) / 86400000) + 1;   // today's day number
  if(!state.days['d'+n]?.done) n--;                      // today not done yet: count from yesterday
  for(; n >= 1 && state.days['d'+n]?.done; n--) s++;
  document.getElementById('st-streak').textContent = s;
}

/* ===================== CALENDAR ===================== */
function renderCalendar(){
  const v = document.getElementById('view');
  const today = new Date();
  let html = `<div class="legend">${Object.entries(PHASE_NAME).map(([k,n])=>`<span class="chip ${k}">${n}</span>`).join('')}<span class="chip" style="background:var(--sunk);color:var(--muted)">Day 7 = review</span></div>`;
  for(const w of WEEKS){
    html += `<section class="week"><div class="week-head"><span class="label">Week ${w.n}</span><h2>${esc(w.title)}</h2></div><div class="grid">`;
    w.days.forEach(([t, s], i) => {
      const n = (w.n-1)*7 + i + 1, d = dayDate(n), ready = hasContent(n), done = state.days['d'+n]?.done;
      const cls = ['tile', w.phase, ready?'ready':'locked', sameDay(d,today)?'today':'', done?'done':'', i===6?'review':''].join(' ');
      const badge = done ? 'Done ✓' : sameDay(d,today) ? 'Today' : ready ? 'Open' : 'Content coming';
      html += `<button class="${cls}" ${ready?`data-day="${n}"`:'aria-disabled="true"'}>
        <span class="d"><b>${d.getDate()}</b><span>${fmtDay(d)} ${d.toLocaleDateString('en-GB',{month:'short'})}</span></span>
        <span class="t">${esc(t)}</span><span class="s">${esc(s)}</span><span class="badge">${badge}</span></button>`;
    });
    html += `</div></section>`;
  }
  v.innerHTML = html;
  v.querySelectorAll('.tile[data-day]').forEach(b => b.onclick = () => { location.hash = 'day-' + b.dataset.day; });
}

/* ===================== DAY VIEW ===================== */
function renderDay(n){
  const tpl = document.getElementById('day-' + n);
  if(!tpl){ location.hash = ''; return; }
  const w = WEEKS[Math.floor((n-1)/7)], [title] = w.days[(n-1)%7], d = dayDate(n);
  const v = document.getElementById('view');
  const frag = tpl.content.cloneNode(true);
  const goal = frag.querySelector('[data-goal]')?.dataset.goal || '';
  frag.querySelector('[data-goal]')?.remove();
  const done = state.days['d'+n]?.done;
  v.innerHTML = `<button class="back" id="back">← All dates</button>
    <div class="day-head"><div><div class="label">Day ${n} · ${fmtFull(d)} · ${PHASE_NAME[w.phase]}</div><h1>${esc(title)}</h1><p class="goal">${esc(goal)}</p></div>
    <button class="done-btn ${done?'is-done':''}" id="done">${done?'Completed ✓':'Mark day complete'}</button></div>
    <div class="plan"><span>10 min · read the concept</span><span>40 min · steps + examples</span><span>10 min · exercises</span></div>`;
  v.appendChild(frag);
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('done').onclick = () => {
    const now = !state.days['d'+n]?.done;
    state.days['d'+n] = { done: now, at: Date.now() };
    saveDoc('days/d'+n, state.days['d'+n]);
    renderDay(n);
  };
  v.querySelectorAll('.demo').forEach(buildDemo);
  v.querySelectorAll('.ex').forEach(buildExercise);
  v.querySelectorAll('[data-quiz]').forEach(buildQuiz);
  v.querySelectorAll('details.topic').forEach(det => {
    const exs = det.querySelectorAll('.ex'); const c = det.querySelector('.count');
    if(c && exs.length){ const w = [...exs].filter(e => (state.answers[e.dataset.id]?.text||'').trim().length>15).length; c.textContent = `${w}/${exs.length} written`; }
  });
  window.scrollTo(0,0);
}

/* ===================== PLAY RUNTIME (fake APEX) ===================== */
function parsePage(spec){ const o = {}; (spec||'').split(';').filter(Boolean).forEach(p => { const i = p.indexOf('='); o[p.slice(0,i)] = p.slice(i+1); }); return o; }
function buildRuntime(container, pageSpec, thisSpec){
  const items = parsePage(pageSpec);
  const out = container.querySelector('.out'), page = container.querySelector('.fakepage'), banners = container.querySelector('.banners');
  const inputs = {};
  if(page){
    page.innerHTML = '';
    Object.keys(items).forEach(k => {
      const lab = document.createElement('label'); lab.textContent = k;
      const inp = document.createElement('input'); inp.value = items[k]; inp.id = container.dataset.uid + '-' + k;
      lab.appendChild(inp); page.appendChild(lab); inputs[k] = inp;
    });
  }
  const val = k => inputs[k] ? inputs[k].value : (items[k] ?? '');
  const log = (cls, args) => { const line = document.createElement('div'); if(cls) line.className = cls;
    line.textContent = args.map(a => a === undefined ? 'undefined' : typeof a === 'string' ? a : (() => { try { return JSON.stringify(a, null, Array.isArray(a)||typeof a!=='object'?0:1); } catch(e){ return String(a); } })()).join(' ');
    out.appendChild(line); };
  const banner = (cls, t) => { const b = document.createElement('div'); b.className = 'banner ' + cls; b.textContent = t; banners.appendChild(b); };
  const item = k => ({
    getValue: () => val(k),
    setValue: (v, disp, suppress) => { if(inputs[k]) inputs[k].value = v ?? ''; else items[k] = v ?? ''; log('dim', [`↳ ${k} = "${v ?? ''}"${suppress?' (no change event)':''}`]); },
    isEmpty: () => String(val(k)).trim() === '',
    show: () => { inputs[k]?.classList.remove('hidden-item'); log('dim', [`↳ ${k} shown`]); },
    hide: () => { inputs[k]?.classList.add('hidden-item'); log('dim', [`↳ ${k} hidden`]); },
    enable: () => { if(inputs[k]) inputs[k].disabled = false; log('dim', [`↳ ${k} enabled`]); },
    disable: () => { if(inputs[k]) inputs[k].disabled = true; log('dim', [`↳ ${k} disabled`]); },
    setFocus: () => inputs[k]?.focus()
  });
  const apex = {
    item,
    message: {
      showPageSuccess: t => banner('ok', '✓ ' + t),
      clearErrors: () => { banners.innerHTML = ''; },
      showErrors: errs => [].concat(errs).forEach(e => banner('bad', `✗ ${e.pageItem ? e.pageItem + ': ' : ''}${e.message}`))
    },
    debug: { info: (...a) => log('dim', ['[apex.debug]', ...a]), log: (...a) => log('dim', ['[apex.debug]', ...a]), error: (...a) => log('err', ['[apex.debug]', ...a]) },
    util: { escapeHTML: s => esc(s), delayLinger: undefined },
    page: { submit: r => banner('ok', `Page submitted with request "${r || ''}"`) }
  };
  const fakeConsole = {
    log: (...a) => log('', a), info: (...a) => log('', a), warn: (...a) => log('err', ['⚠', ...a]), error: (...a) => log('err', a),
    table: rows => { try{ const r = [].concat(rows); const cols = Object.keys(r[0]||{}); log('', [[cols.join(' | '), ...r.map(x => cols.map(c => x[c]).join(' | '))].join('\n')]); }catch(e){ log('', [rows]); } }
  };
  let daThis = {};
  if(thisSpec){ const [id, value] = thisSpec.split('='); daThis = { triggeringElement: { id, get value(){ return val(id) || value; } }, browserEvent: { type: 'change' }, data: {}, affectedElements: [] }; }
  return { apex, $v: k => val(k), $s: (k, v) => item(k).setValue(v), console: fakeConsole, daThis, log };
}
let uidCounter = 0;
function runCode(container, code){
  const out = container.querySelector('.out'); out.innerHTML = ''; container.querySelector('.banners').innerHTML = '';
  const rt = container._rt;
  try{
    const fn = new Function('apex', '$v', '$s', 'console', code);
    fn.call(rt.daThis, rt.apex, rt.$v, rt.$s, rt.console);
  }catch(e){ rt.log('err', [`${e.name}: ${e.message}`]); }
  window.__lastRuntime = rt;
  setTimeout(() => { if(!out.textContent.trim() && !container.querySelector('.banners').textContent) rt.log('dim', ['(ran with no output)']); }, 700);
}
// errors thrown inside setTimeout callbacks in user code
window.addEventListener('error', e => { if(window.__lastRuntime){ window.__lastRuntime.log('err', [e.message]); e.preventDefault(); } });

function runnerShell(kind, label, pageSpec){
  const id = 'r' + (++uidCounter);
  const wrap = document.createElement('div'); wrap.className = 'runner'; wrap.dataset.uid = id;
  wrap.innerHTML = `<div class="bar"><span>${label}</span><span class="tools"></span></div>
    <textarea id="${id}-code" class="${kind==='text'?'text':''}" spellcheck="false"></textarea>
    ${kind==='js' ? `${pageSpec?'<div class="fakepage"></div>':''}<div class="banners"></div><div class="out"></div>` : ''}`;
  return wrap;
}
function fitTextarea(ta){ const lines = ta.value.split('\n').length; ta.rows = Math.min(Math.max(lines + 1, 4), 26); }
function tabKey(ta){ ta.addEventListener('keydown', e => { if(e.key === 'Tab' && !e.shiftKey && ta.classList.contains('text')===false){ e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); } }); }

function buildDemo(el){
  const code = el.querySelector('pre').textContent;
  const r = runnerShell('js', 'Example · editable', el.dataset.page);
  el.replaceChildren(r);
  const ta = r.querySelector('textarea'); ta.value = code; fitTextarea(ta); tabKey(ta);
  r._rt = buildRuntime(r, el.dataset.page, el.dataset.this);
  const tools = r.querySelector('.tools');
  tools.innerHTML = `<button class="btn primary">Run</button> <button class="btn">Reset</button>`;
  const [run, reset] = tools.querySelectorAll('button');
  run.onclick = () => runCode(r, ta.value);
  reset.onclick = () => { ta.value = code; fitTextarea(ta); r._rt = buildRuntime(r, el.dataset.page, el.dataset.this); r.querySelector('.out').innerHTML=''; r.querySelector('.banners').innerHTML=''; };
}

function buildExercise(el){
  const id = el.dataset.id, kind = el.dataset.kind;
  const all = [...el.closest('.tbody').querySelectorAll('.ex')]; const idx = all.indexOf(el);
  const tags = ['Guided', 'New scenario', 'Stretch']; const tag = tags[Math.min(idx, 2)] || 'Exercise';
  const q = el.querySelector('.q'), start = el.querySelector('.start')?.textContent || '', hint = el.querySelector('.hint'), sol = el.querySelector('.sol')?.textContent || '';
  const r = runnerShell(kind, kind === 'js' ? 'Your code · saved as you type' : 'Your answer · saved as you type', el.dataset.page);
  const head = document.createElement('div'); head.className = 'ex-head';
  head.innerHTML = `<span class="ex-tag t${Math.min(idx,2)+1}">${tag}</span>`; head.appendChild(q);
  const tools = document.createElement('div'); tools.className = 'ex-tools';
  tools.innerHTML = `${kind==='js'?'<button class="btn primary" data-a="run">Run</button>':''}<button class="btn" data-a="hint">Show hint</button><button class="btn" data-a="sol">Show solution</button><span class="saved"></span>`;
  const hintBox = document.createElement('div'); hintBox.className = 'reveal'; hintBox.hidden = true; hintBox.innerHTML = '<span class="label">Hint</span><div></div>'; hintBox.lastChild.append(...(hint ? hint.childNodes : []));
  const solBox = document.createElement('div'); solBox.className = 'reveal'; solBox.hidden = true; solBox.innerHTML = '<span class="label">One possible solution. Compare it with yours; don\'t replace yours.</span><pre></pre>'; solBox.querySelector('pre').textContent = sol;
  el.replaceChildren(head, r, tools, hintBox, solBox);
  const ta = r.querySelector('textarea'); ta.id = 'ex-' + id;
  ta.value = state.answers[id]?.text ?? start; fitTextarea(ta); tabKey(ta);
  if(kind==='text') ta.placeholder = 'Write your answer here…';
  if(kind === 'js') r._rt = buildRuntime(r, el.dataset.page, el.dataset.this);
  const savedEl = tools.querySelector('.saved'), solBtn = tools.querySelector('[data-a=sol]');
  const attempted = () => ta.value.trim() !== start.trim() && ta.value.trim().length > 15;
  const refresh = () => { solBtn.disabled = !attempted(); solBtn.title = attempted() ? '' : 'Write your own attempt first'; savedEl.textContent = state.answers[id] ? 'Saved ' + new Date(state.answers[id].at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''; };
  refresh();
  ta.addEventListener('input', () => { fitTextarea(ta); saveAnswer(id, ta.value); refresh(); });
  tools.querySelector('[data-a=hint]').onclick = () => { hintBox.hidden = !hintBox.hidden; };
  solBtn.onclick = () => { solBox.hidden = !solBox.hidden; };
  if(kind === 'js') tools.querySelector('[data-a=run]').onclick = () => { r._rt = buildRuntime(r, el.dataset.page, el.dataset.this); runCode(r, ta.value); };
  el._ta = ta; el._refresh = refresh;
}

function buildQuiz(el){
  const key = el.dataset.quiz; const qs = QUIZ_W1;
  el.innerHTML = '';
  const score = document.createElement('p'); score.className = 'muted';
  qs.forEach((item, i) => {
    const box = document.createElement('div'); box.className = 'qz';
    box.innerHTML = `<b>${i+1}. ${esc(item.q)}</b><div class="opts"></div><p class="why" hidden></p>`;
    const opts = box.querySelector('.opts'), why = box.querySelector('.why');
    const show = pick => {
      opts.querySelectorAll('button').forEach((b, j) => { b.classList.toggle('right', j === item.a); b.classList.toggle('wrong', j === pick && pick !== item.a); });
      why.hidden = false; why.textContent = (pick === item.a ? 'Correct. ' : 'Not quite. ') + item.why;
    };
    item.o.forEach((o, j) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.onclick = () => { state.quiz[`${key}-${i}`] = { pick: j, at: Date.now() }; saveDoc(`quiz/${key}-${i}`, state.quiz[`${key}-${i}`]); show(j); upd(); };
      opts.appendChild(b); });
    const prev = state.quiz[`${key}-${i}`]; if(prev) show(prev.pick);
    el.appendChild(box);
  });
  const upd = () => { const got = qs.filter((it,i) => state.quiz[`${key}-${i}`]?.pick === it.a).length, ans = qs.filter((_,i)=>state.quiz[`${key}-${i}`]).length; score.textContent = `Score: ${got} / ${qs.length} (${ans} answered)`; };
  el.prepend(score); upd();
}

/* keep the open view in sync when saved work arrives, without clobbering what's being typed */
function refreshOpenView(){
  if(!location.hash.startsWith('#day-')){ renderCalendar(); return; }
  document.querySelectorAll('.ex').forEach(ex => {
    const ta = ex._ta, saved = state.answers[ex.dataset.id];
    if(ta && saved && document.activeElement !== ta && saved.text !== ta.value){ ta.value = saved.text; fitTextarea(ta); ex._refresh(); }
  });
}

function route(){
  const m = location.hash.match(/^#day-(\d+)$/);
  if(m) renderDay(Number(m[1])); else renderCalendar();
}
window.addEventListener('hashchange', route);
updateStats(); route(); connect();
</script>
