<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX Expert Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workspace bar, session list, then one session as a long lesson; a one-page summary that prints. */
:root{
  --bg:#f6f7fb; --surface:#fff; --sunk:#eef0f6; --fg:#1b2030; --muted:#5d6478; --line:#dde1ec;
  --accent:#3550c8; --accent-ink:#fff; --accent-soft:#e6eaff;
  --pl:#b4441c; --pl-soft:#fbe9e1; --js:#9a6a12; --js-soft:#fbf1df; --jq:#1f6f8b; --jq-soft:#e0f0f6;
  --yellow:#8a6400; --yellow-bg:#fff4c7; --yellow-line:#e9b500;
  --red:#a32020; --red-bg:#fde4e4; --red-line:#d33;
  --good:#2f855a; --good-bg:#e2f3ea; --code-bg:#161a26; --code-fg:#e4e7f2; --bar:#1d2233; --bar-fg:#e9ecf6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10131c; --surface:#181c28; --sunk:#202536; --fg:#e6e9f3; --muted:#9aa2b8; --line:#2c3347;
  --accent:#8299ff; --accent-ink:#0f1320; --accent-soft:#232c52;
  --pl:#f0a080; --pl-soft:#3a2219; --js:#e7b45a; --js-soft:#352a17; --jq:#7cc6e0; --jq-soft:#16303a;
  --yellow:#f5d067; --yellow-bg:#3a3110; --yellow-line:#c99a00; --red:#ff9b9b; --red-bg:#3d1818; --red-line:#e05555;
  --good:#6fcf9a; --good-bg:#17321f; --code-bg:#0b0d14; --bar:#0b0e16; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.65 var(--f-body)}
[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(26px,4vw,36px)} h2{font-size:23px} h3{font-size:17px}
p{margin:0} p+p{margin-top:10px}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.87em;background:var(--sunk);padding:1px 5px;border-radius:4px;font-variant-ligatures:none}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wsbar{background:var(--bar);color:var(--bar-fg);font-size:13px}
.wsbar .wrap{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-block:8px}
.wsbar a{color:#aebcff;text-decoration:none;font-weight:600}
.wsbar .sep{opacity:.35}
.wsbar .sync{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wsbar .btn{background:transparent;color:var(--bar-fg);border-color:#3a4260}
.wsbar .btn.primary{background:#5b74e6;border-color:#5b74e6;color:#fff}
.wsbar input{font:inherit;padding:3px 6px;border:1px solid #3a4260;border-radius:5px;background:#252b3f;color:var(--bar-fg);width:140px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.bad{background:var(--red-bg);color:var(--red);border-color:transparent}

/* home */
.head{padding-block:26px 6px}
.head .sub{max-width:68ch;color:var(--muted);margin-top:6px}
.sessions{display:grid;gap:10px;margin:20px 0}
.scard{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--fg)}
.scard:hover{border-color:var(--accent)}
.scard.soon{opacity:.6;cursor:default}
.scard .num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 17px var(--f-display)}
.scard .t{font-weight:600}
.scard .s{font-size:13.5px;color:var(--muted)}

/* lesson */
.back{background:none;border:0;color:var(--accent);padding:0;font-weight:600;margin:18px 0 8px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.toc a{font-size:12.5px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg)}
.toc a span{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:4px}
section.part{margin-top:34px;scroll-margin-top:12px}
section.part>h2{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
section.part>h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
section.part>h2 .time{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.prose{max-width:76ch}
h3{margin:22px 0 8px}

pre{margin:10px 0 0;font:13px/1.6 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:14px 16px;overflow-x:auto;white-space:pre;border-radius:10px;font-variant-ligatures:none}
pre .c{color:#8a93ad}
pre .k{color:#ffd479}
.codehead{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.codehead + pre{margin-top:4px}
.where{font:600 11.5px var(--f-body);background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.compare>div{min-width:0}
.compare .h{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:6px 6px 0 0;display:inline-block}
.compare .h.pl{background:var(--pl-soft);color:var(--pl)} .compare .h.js{background:var(--js-soft);color:var(--js)} .compare .h.jq{background:var(--jq-soft);color:var(--jq)}
.compare pre{margin-top:0;border-top-left-radius:0;height:calc(100% - 26px)}
@media (max-width:720px){.compare{grid-template-columns:1fr}}

.note{border-left:5px solid;border-radius:0 10px 10px 0;padding:11px 15px;margin-top:14px;max-width:80ch;font-size:14.5px}
.note b.tag{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.note.yellow{background:var(--yellow-bg);border-color:var(--yellow-line)} .note.yellow b.tag{color:var(--yellow)}
.note.red{background:var(--red-bg);border-color:var(--red-line)} .note.red b.tag{color:var(--red)}

table.dt{border-collapse:collapse;width:100%;margin-top:10px;font-size:14px;background:var(--surface);border-radius:10px;overflow:hidden}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.tablewrap table{margin:0}
table.dt th,table.dt td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt th{background:var(--sunk);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
table.dt tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:700 11px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pl{background:var(--pl-soft);color:var(--pl)} .pill.js{background:var(--js-soft);color:var(--js)} .pill.jq{background:var(--jq-soft);color:var(--jq)} .pill.dec{background:var(--good-bg);color:var(--good)}

/* practice */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.task-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.task-head .qn{font:700 13px var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px}
.task-head .status{margin-left:auto;font-size:12.5px;font-weight:600}
.task-head .status.ok{color:var(--good)} .task-head .status.no{color:var(--red)}
.task ol{margin:8px 0 0;padding-left:22px}
.task .ask{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.answer{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.answer ol.stepx{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.answer ol.stepx>li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px}
.answer ol.stepx>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-display)}
.answer ol.stepx>li>div{min-width:0}
textarea.mine{width:100%;min-height:70px;margin-top:10px;font:13px/1.5 var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--fg);font-variant-ligatures:none}

/* summary */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:16px}
.sheet h1{font-size:24px}
.sheet .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:14px}
.sheet .box{border-top:3px solid var(--accent);padding-top:6px}
.sheet .box.y{border-color:var(--yellow-line)} .sheet .box.r{border-color:var(--red-line)}
.sheet h3{margin:0 0 4px;font-size:14.5px}
.sheet ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.sheet pre{font-size:11.5px;padding:8px 10px;margin-top:4px}
@media (max-width:720px){.sheet .cols{grid-template-columns:1fr}}
footer{margin:40px 0 30px;font-size:13px;color:var(--muted)}

@media print{
  .wsbar,.back,.noprint,footer{display:none!important}
  #view > :not(.part[id$='-summary']){display:none!important}
  .part[id$='-summary'] > h2{display:none!important}
  .part[id$='-summary']{margin:0}
  body{background:#fff;color:#000;font-size:11px}
  .sheet{border:0;padding:0;margin:0}
  .sheet .cols{grid-template-columns:1fr 1fr;gap:8px 16px}
  pre{background:#f3f3f3!important;color:#000!important;white-space:pre-wrap}
  pre .c{color:#666!important}
}
</style>
</head>
<body>

<div class="wsbar gutter">
  <div class="wrap">
    <span>Workspace <b>ANAND_DEV</b></span><span class="sep">|</span>
    <a href="https://oracleapex.com/ords/r/apex/workspace-sign-in/oracle-apex-sign-in" target="_blank" rel="noopener">Sign in to APEX ↗</a><span class="sep">|</span>
    <a href="https://oracleapex.com/ords/r/anand_dev/js-lab/home" target="_blank" rel="noopener">JS Lab app ↗</a>
    <span class="sync" id="sync"><span id="syncmsg">Saved in this browser</span></span>

<!-- ======================= SESSION 1 ======================= -->
<template id="s1">
  <nav class="toc noprint">
    <a href="#s1-where">1. Where JS lives<span>5m</span></a>
    <a href="#s1-vars">2. Variables & types<span>10m</span></a>
    <a href="#s1-items">3. Page items<span>10m</span></a>
    <a href="#s1-choose">4. JS vs jQuery vs PL/SQL<span>10m</span></a>
    <a href="#s1-exc">5. Exceptions<span>10m</span></a>
    <a href="#s1-html">6. HTML &amp; CSS<span>10m</span></a>
    <a href="#s1-practice">7. Practice<span>15m</span></a>
    <a href="#s1-summary">8. Summary</a>
  </nav>

  <!-- 1 -->
  <section class="part" id="s1-where">
    <h2><span class="n">01</span>Where JavaScript lives in APEX<span class="time">5 min</span></h2>
    <div class="prose"><p>In PL/SQL you know exactly where code runs: a process, a computation, a validation, a package. JavaScript runs in the <b>browser</b>, and APEX gives it four homes. In Page Designer, click the <b>page name</b> at the top of the left tree and scroll the right panel to <b>JavaScript</b>.</p></div>
    <div class="tablewrap"><table class="dt">
      <tr><th>Where</th><th>When it runs</th><th>PL/SQL feeling</th><th>Use it for</th></tr>
      <tr><td><b>Function and Global Variable Declaration</b></td><td>Loaded with the page (defines, doesn't run)</td><td>Package spec + body for one page</td><td>Functions and constants this page needs</td></tr>
      <tr><td><b>Execute when Page Loads</b></td><td>Once, after the page has rendered</td><td>The <code>BEGIN … END</code> of "Before Header" logic</td><td>First setup, default values, wiring</td></tr>
      <tr><td><b>Dynamic Action → Execute JavaScript Code</b></td><td>Every time an event happens (change, click…)</td><td>A trigger, in the browser</td><td>Reacting to the user</td></tr>
      <tr><td><b>Static Application File</b> (<code>#APP_FILES#js/app.js</code>)</td><td>Loaded on every page that references it</td><td>A real stored package</td><td>Code shared by many pages</td></tr>
    </table></div>
    <div class="note yellow"><b class="tag">Note to remember</b>Short code goes in the page. Code you'd copy to a second page goes in a static file. Always try a <b>declarative</b> Dynamic Action first (Show, Hide, Set Value, Refresh); write JavaScript only when the declarative options can't do it.</div>
  </section>

  <!-- 2 -->
  <section class="part" id="s1-vars">
    <h2><span class="n">02</span>Variables and data types<span class="time">10 min</span></h2>
    <div class="compare">
      <div><span class="h pl">PL/SQL</span>
<pre><span class="k">DECLARE</span>
  v_ename  VARCHAR2(30) := 'KING';
  v_sal    NUMBER       := 5000;
  v_active BOOLEAN      := TRUE;
  v_comm   NUMBER;               <span class="c">-- NULL</span>
  c_bonus  CONSTANT NUMBER := 0.10;
<span class="k">BEGIN</span>
  v_sal := v_sal + 100;
  DBMS_OUTPUT.PUT_LINE(v_ename || ' ' || v_sal);
<span class="k">END;</span></pre></div>
      <div><span class="h js">JavaScript</span>
<pre>let   ename  = 'KING';     <span class="c">// string</span>
let   sal    = 5000;       <span class="c">// number</span>
let   active = true;       <span class="c">// boolean</span>
let   comm   = null;       <span class="c">// "no value"</span>
const BONUS  = 0.10;       <span class="c">// CONSTANT</span>

sal = sal + 100;
console.log(ename + ' ' + sal);
console.log(`${ename} ${sal}`);   <span class="c">// same, nicer</span></pre></div>
    </div>
    <div class="prose" style="margin-top:12px"><p>No <code>DECLARE</code> section, no types and no <code>:=</code>. You declare a variable where you first need it. The type comes from the value.</p></div>

    <h3>The five types you'll use</h3>
    <div class="tablewrap"><table class="dt">
      <tr><th>JavaScript</th><th>Example</th><th>PL/SQL</th></tr>
      <tr><td>string</td><td><code>'KING'</code> or <code>"KING"</code> or <code>`KING`</code></td><td>VARCHAR2</td></tr>
      <tr><td>number</td><td><code>5000</code>, <code>12.5</code> (one type for all numbers)</td><td>NUMBER</td></tr>
      <tr><td>boolean</td><td><code>true</code> / <code>false</code></td><td>BOOLEAN</td></tr>
      <tr><td>null / undefined</td><td><code>null</code> = set to nothing; <code>undefined</code> = never set</td><td>NULL</td></tr>
      <tr><td>object / array</td><td><code>{ename:'KING'}</code> / <code>[10, 20]</code></td><td>RECORD / collection</td></tr>
    </table></div>

    <h3>Comparing values</h3>
    <div class="compare">
      <div><span class="h pl">PL/SQL</span>
<pre>IF v_sal = 5000 THEN …
IF v_sal &lt;&gt; 5000 THEN …
IF v_comm IS NULL THEN …
IF a AND b THEN … / a OR b / NOT a</pre></div>
      <div><span class="h js">JavaScript</span>
<pre>if (sal === 5000) { … }
if (sal !== 5000) { … }
if (comm == null) { … }   <span class="c">// null or undefined</span>
if (a &amp;&amp; b) { … }  /  a || b  /  !a</pre></div>
    </div>
    <div class="note yellow"><b class="tag">Note to remember</b>Use <code>const</code> by default and <code>let</code> only if the value changes. Never use <code>var</code>, the old style that leaks out of blocks. Compare with <b>three</b> equals signs, <code>===</code>. Two (<code>==</code>) quietly converts types, so <code>'5' == 5</code> is true.</div>
    <div class="note red"><b class="tag">Trap: empty string is NOT null</b>In Oracle, <code>''</code> IS NULL. In JavaScript, <code>''</code> is an empty string and <code>'' === null</code> is <b>false</b>. An empty APEX item gives you <code>''</code>, not <code>null</code>. Test for "empty" with <code>if (!value)</code> or <code>apex.item('P1_X').isEmpty()</code>.</div>
  </section>

  <!-- 3 -->
  <section class="part" id="s1-items">
    <h2><span class="n">03</span>Reading and writing page items<span class="time">10 min</span></h2>
    <div class="compare">
      <div><span class="h pl">PL/SQL (server, after submit)</span>
<pre>v_sal := :P1_SAL;
:P1_SAL := 5000;
:P1_ANNUAL := :P1_SAL * 12;

<span class="c">-- only sees the value after
-- the page is submitted</span></pre></div>
      <div><span class="h js">JavaScript (browser, instantly)</span>
<pre>let sal = apex.item('P1_SAL').getValue();
apex.item('P1_SAL').setValue(5000);
apex.item('P1_ANNUAL').setValue(Number(sal) * 12);

<span class="c">// short forms you'll see everywhere</span>
$v('P1_SAL');          <span class="c">// = getValue()</span>
$s('P1_SAL', 5000);    <span class="c">// = setValue()</span></pre></div>
    </div>

    <div class="codehead"><span>Paste this into <span class="where">Execute when Page Loads</span>. Needs items P1_ENAME, P1_SAL, P1_ANNUAL.</span></div>
<pre><span class="c">// 1. Write values (like :P1_ENAME := 'KING';)</span>
apex.item('P1_ENAME').setValue('KING');
apex.item('P1_SAL').setValue('5000');

<span class="c">// 2. Read a value back - it is ALWAYS a string</span>
const salText = apex.item('P1_SAL').getValue();   <span class="c">// '5000'</span>

<span class="c">// 3. Convert before maths (like TO_NUMBER)</span>
const sal = Number(salText);                       <span class="c">// 5000</span>

<span class="c">// 4. Calculate and write the result</span>
apex.item('P1_ANNUAL').setValue(sal * 12);         <span class="c">// 60000</span>

<span class="c">// 5. See it in the browser console (F12) - your DBMS_OUTPUT</span>
console.log('Annual salary of', apex.item('P1_ENAME').getValue(), 'is', sal * 12);</pre>

    <h3>More things an item can do</h3>
<pre>apex.item('P1_COMM').hide();          <span class="c">// and .show()</span>
apex.item('P1_COMM').disable();       <span class="c">// and .enable()</span>
apex.item('P1_COMM').isEmpty();       <span class="c">// true / false</span>
apex.item('P1_COMM').setFocus();
apex.item('P1_DEPTNO').setValue('10', 'ACCOUNTING');   <span class="c">// value + display (popup LOV)</span>
apex.item('P1_COMM').setValue('0', null, true);        <span class="c">// true = do NOT fire Change event</span></pre>

    <h3>The same jobs done the PL/SQL (server) way</h3>
    <div class="tablewrap"><table class="dt">
      <tr><th>Job</th><th>PL/SQL / declarative (on page render or submit)</th><th>JavaScript (instantly in the browser)</th></tr>
      <tr><td>Set a value</td><td><code>:P1_SAL := 5000;</code> in a Before Header process or Computation</td><td><code>apex.item('P1_SAL').setValue(5000)</code></td></tr>
      <tr><td>Read a value</td><td><code>l_sal := :P1_SAL;</code> (needs the page submitted, or the item in "Items to Submit")</td><td><code>apex.item('P1_SAL').getValue()</code></td></tr>
      <tr><td>Hide an item</td><td>Item → Server-side Condition (item isn't even sent to the browser)</td><td><code>apex.item('P1_COMM').hide()</code> (still on the page, just hidden)</td></tr>
      <tr><td>Make it read-only</td><td>Item → Read Only condition</td><td><code>apex.item('P1_COMM').disable()</code></td></tr>
      <tr><td>Is it empty?</td><td><code>IF :P1_COMM IS NULL THEN</code></td><td><code>apex.item('P1_COMM').isEmpty()</code></td></tr>
      <tr><td>Debug output</td><td><code>apex_debug.message('sal=%s', :P1_SAL);</code></td><td><code>console.log('sal=', $v('P1_SAL'))</code></td></tr>
    </table></div>
    <div class="note yellow"><b class="tag">Note to remember: server vs browser</b>PL/SQL runs <b>before</b> the page is drawn or <b>after</b> Submit. JavaScript runs <b>while</b> the user is on the page. A Server-side Condition removes the item completely; <code>.hide()</code> only hides it, so it's still there and its value can still be submitted.</div>
    <div class="note red"><b class="tag">Trap: the string + number bug</b><code>$v('P1_SAL') + 100</code> gives <code>'5000100'</code>, not <code>5100</code>. <code>+</code> joins strings. Always wrap item values in <code>Number(…)</code> before doing maths.</div>
    <div class="note red"><b class="tag">Trap: endless Dynamic Action loops</b><code>setValue</code> fires a <b>Change</b> event. If a DA on P1_SAL changes P1_SAL, it fires itself again. Pass <code>true</code> as the third argument to stop that: <code>setValue(v, null, true)</code>.</div>
    <div class="note yellow"><b class="tag">Note to remember</b>Use <code>apex.item()</code> for items, <b>not</b> jQuery <code>$('#P1_SAL').val()</code>. Popup LOVs, shuttles, switches and date pickers store their values in different HTML, and <code>apex.item</code> knows each one; jQuery doesn't.</div>
  </section>

  <!-- 4 -->
  <section class="part" id="s1-choose">
    <h2><span class="n">04</span>JavaScript vs jQuery vs PL/SQL: which one?<span class="time">10 min</span></h2>
    <div class="prose">
      <p><b>PL/SQL</b> runs on the database server. <b>JavaScript</b> runs in the browser. <b>jQuery</b> is a JavaScript library that APEX already loads on every page. It's a short way to find HTML elements and change them. In APEX, <code>$</code> means jQuery (and <code>apex.jQuery</code> is the same thing).</p>
    </div>
    <div class="tablewrap"><table class="dt">
      <tr><th>Situation</th><th>Use</th><th>Why</th></tr>
      <tr><td>Read/insert/update the database, anything with DML</td><td><span class="pill pl">PL/SQL</span></td><td>Data lives on the server</td></tr>
      <tr><td>Security: who can see or change what, and the final validation</td><td><span class="pill pl">PL/SQL</span></td><td>The browser can be bypassed, so the server is the real gate</td></tr>
      <tr><td>Show/hide, enable/disable, set value, refresh a region</td><td><span class="pill dec">Declarative DA</span></td><td>No code at all; easiest to maintain</td></tr>
      <tr><td>Instant check while typing (before submit)</td><td><span class="pill js">JS · apex.item / apex.message</span></td><td>Fast feedback, no round trip</td></tr>
      <tr><td>Read or set a page item</td><td><span class="pill js">JS · apex.item()</span></td><td>Works for every item type</td></tr>
      <tr><td>Refresh a report or chart</td><td><span class="pill js">JS · apex.region('id').refresh()</span></td><td>APEX API knows the region</td></tr>
      <tr><td>Change things that aren't items: add a CSS class, change text in a header, style table rows</td><td><span class="pill jq">jQuery</span></td><td>Selects any HTML by CSS selector</td></tr>
      <tr><td>Handle clicks on many elements, including ones added later (report rows)</td><td><span class="pill jq">jQuery .on()</span></td><td>Event delegation in one line</td></tr>
      <tr><td>Get data from the database without submitting</td><td><span class="pill js">JS apex.server.process</span> + <span class="pill pl">PL/SQL</span></td><td>JS calls your PL/SQL (AJAX), coming in Session 2</td></tr>
    </table></div>

    <h3>Same job, three ways: highlight salaries over 3000 in a report</h3>
    <div class="compare">
      <div><span class="h pl">PL/SQL / SQL (best when possible)</span>
<pre><span class="c">-- In the report query: decide the CSS class on the server</span>
SELECT ename, sal,
       CASE WHEN sal &gt; 3000 THEN 'u-danger-text' END AS sal_css
  FROM emp
<span class="c">-- Column SAL → HTML Expression:
--   &lt;span class="#SAL_CSS#"&gt;#SAL#&lt;/span&gt;</span></pre></div>
      <div><span class="h jq">jQuery (after the report renders)</span>
<pre><span class="c">// Report region Static ID = emp_report
// DA: Event "After Refresh" on that region + Page Load</span>
$('#emp_report td[headers="SAL"]').each(function () {
  if (Number($(this).text()) &gt; 3000) {
    $(this).addClass('u-danger-text');
  }
});</pre></div>
    </div>

    <h3>The jQuery you actually need (8 lines)</h3>
<pre>$('#emp_region')                 <span class="c">// find by Static ID (# = id)</span>
$('.my-class')                   <span class="c">// find by CSS class (. = class)</span>
$('#emp_region').hide();          <span class="c">// .show()  .toggle()</span>
$('#emp_region').addClass('is-warning');   <span class="c">// .removeClass()</span>
$('#title').text('New title');    <span class="c">// change visible text (safe)</span>
$('#emp_region .t-Region-title').css('color', 'red');
<span class="c">// one click handler for every button with class js-approve, even rows added later:</span>
$(document).on('click', '.js-approve', function () { console.log($(this).data('id')); });</pre>
    <div class="note yellow"><b class="tag">Note to remember: decision order</b>1) Can SQL/PL/SQL do it on the server? 2) Can a <b>declarative</b> Dynamic Action do it? 3) Is there an <b>apex.*</b> API (<code>apex.item</code>, <code>apex.region</code>, <code>apex.message</code>)? 4) Only then use <b>jQuery</b>, for plain HTML. Give regions a <b>Static ID</b> (Region → Advanced → Static ID) so <code>#emp_region</code> always works.</div>
    <div class="note red"><b class="tag">Trap</b>Never build HTML from user input with <code>.html(userText)</code>. That's how XSS attacks happen. Use <code>.text(userText)</code>, or <code>apex.util.escapeHTML(userText)</code>.</div>
  </section>

  <!-- 5 -->
  <section class="part" id="s1-exc">
    <h2><span class="n">05</span>Exceptions: EXCEPTION → try / catch<span class="time">10 min</span></h2>
    <div class="compare">
      <div><span class="h pl">PL/SQL</span>
<pre><span class="k">BEGIN</span>
  IF v_sal &lt;= 0 THEN
    RAISE_APPLICATION_ERROR(-20001,
      'Salary must be positive');
  END IF;
  v_annual := v_sal * 12;
<span class="k">EXCEPTION</span>
  WHEN OTHERS THEN
    apex_debug.error('Failed: %s', SQLERRM);
    RAISE;                        <span class="c">-- re-raise</span>
<span class="k">END;</span></pre></div>
      <div><span class="h js">JavaScript</span>
<pre><span class="k">try</span> {
  if (sal &lt;= 0) {
    throw new Error('Salary must be positive');
  }
  annual = sal * 12;
} <span class="k">catch</span> (err) {               <span class="c">// WHEN OTHERS</span>
  apex.debug.error('Failed:', err.message);  <span class="c">// SQLERRM</span>
  throw err;                      <span class="c">// re-raise</span>
} <span class="k">finally</span> {
  <span class="c">// always runs - no PL/SQL twin</span>
}</pre></div>
    </div>
    <div class="tablewrap"><table class="dt">
      <tr><th>PL/SQL</th><th>JavaScript</th></tr>
      <tr><td><code>RAISE_APPLICATION_ERROR(-20001, msg)</code></td><td><code>throw new Error(msg)</code></td></tr>
      <tr><td><code>EXCEPTION WHEN OTHERS THEN</code></td><td><code>catch (err) { … }</code></td></tr>
      <tr><td><code>SQLERRM</code></td><td><code>err.message</code></td></tr>
      <tr><td><code>RAISE;</code></td><td><code>throw err;</code></td></tr>
      <tr><td><code>WHEN NO_DATA_FOUND</code> (a specific error)</td><td><code>if (err instanceof MyError) { … } else { throw err; }</code></td></tr>
      <tr><td><code>apex_error.add_error(…)</code></td><td><code>apex.message.showErrors([…])</code></td></tr>
      <tr><td><code>apex_debug.message(…)</code></td><td><code>apex.debug.info(…)</code> (only prints in Debug mode)</td></tr>
    </table></div>

    <div class="codehead"><span>A complete pattern: <span class="where">Dynamic Action · Change on P1_SAL · Execute JavaScript Code</span></span></div>
<pre><span class="c">// Validate salary in the browser, show it the APEX way.
// PL/SQL twin is an item Validation with apex_error - keep that too!</span>
apex.message.clearErrors();                       <span class="c">// clear old messages first</span>
try {
  const text = apex.item('P1_SAL').getValue();
  const sal  = Number(text);

  if (apex.item('P1_SAL').isEmpty()) throw new Error('Salary is required');
  if (Number.isNaN(sal))             throw new Error(`'${text}' is not a number`);
  if (sal &lt; 800 || sal &gt; 5000)       throw new Error('Salary must be between 800 and 5000');

  apex.item('P1_ANNUAL').setValue(sal * 12, null, true);
  apex.message.showPageSuccess('Salary OK');
} catch (err) {
  apex.message.showErrors([{
    type:     'error',
    location: ['page', 'inline'],    <span class="c">// top of page AND under the item</span>
    pageItem: 'P1_SAL',
    message:  err.message,
    unsafe:   false                  <span class="c">// escape the text - always false</span>
  }]);
} finally {
  apex.debug.info('P1_SAL checked:', apex.item('P1_SAL').getValue());
}</pre>
    <div class="note yellow"><b class="tag">Note to remember</b>Browser validation is for <b>speed</b>; server validation (PL/SQL) is for <b>safety</b>. Do both. Always call <code>apex.message.clearErrors()</code> before showing new errors, or old ones stay on screen.</div>
    <div class="note red"><b class="tag">Trap</b>An error you don't catch stops the rest of that JavaScript, and the user sees nothing. Only the console (F12) shows it in red. If "nothing happens", open the console first.</div>
  </section>

  <!-- 5b -->
  <section class="part" id="s1-html">
    <h2><span class="n">06</span>The HTML behind your page, plus your first CSS<span class="time">10 min</span></h2>
    <div class="prose"><p>Everything APEX draws becomes <b>HTML</b>, and <b>CSS</b> decides how it looks. You don't need to write whole pages. You need to <b>read</b> what APEX makes so you can target it with jQuery and CSS. Right-click anything on a running page → <b>Inspect</b> to see it.</p></div>
    <div class="compare">
      <div><span class="h pl">What you build in APEX</span>
<pre>Region "Employees"
  Static ID:   emp_region
  CSS Classes: emp-box

Item P1_SAL
  Type:  Number Field
  Label: Salary</pre></div>
      <div><span class="h js">The HTML APEX makes (simplified)</span>
<pre>&lt;div id="emp_region" class="t-Region emp-box"&gt;
  &lt;h2 class="t-Region-title"&gt;Employees&lt;/h2&gt;
  &lt;div class="t-Region-body"&gt;
    &lt;label for="P1_SAL"&gt;Salary&lt;/label&gt;
    &lt;input id="P1_SAL" name="P1_SAL" type="text"&gt;
  &lt;/div&gt;
&lt;/div&gt;</pre></div>
    </div>
    <div class="tablewrap"><table class="dt">
      <tr><th>HTML piece</th><th>Means</th><th>CSS / jQuery selector</th></tr>
      <tr><td><code>id="emp_region"</code></td><td>One unique element (your Static ID)</td><td><code>#emp_region</code></td></tr>
      <tr><td><code>class="emp-box"</code></td><td>A label you can put on many elements</td><td><code>.emp-box</code></td></tr>
      <tr><td><code>&lt;div&gt;</code> <code>&lt;h2&gt;</code> <code>&lt;label&gt;</code> <code>&lt;input&gt;</code></td><td>Tags: box, heading, label, input field</td><td><code>div</code>, <code>h2</code>, <code>input</code></td></tr>
      <tr><td>Space between selectors</td><td>"inside of"</td><td><code>#emp_region input</code> = every input inside that region</td></tr>
    </table></div>
    <div class="codehead"><span>Paste into <span class="where">Page → CSS → Inline</span> (needs a region with CSS Classes = <code>emp-box</code>)</span></div>
<pre><span class="c">/* selector { property: value; }  - like  UPDATE look SET ... WHERE selector */</span>
.emp-box {
  border-left: 4px solid #3550c8;    <span class="c">/* coloured bar on the left */</span>
  border-radius: 8px;                <span class="c">/* rounded corners */</span>
}
.emp-box .t-Region-title {
  color: #3550c8;                    <span class="c">/* blue region title */</span>
  font-weight: 700;
}
#P1_SAL {
  text-align: right;                 <span class="c">/* numbers line up on the right */</span>
  font-family: monospace;
}</pre>
    <div class="note yellow"><b class="tag">Note to remember</b>CSS reads like SQL: <b>selector</b> = <code>WHERE</code>, <b>properties</b> = <code>SET</code>. <code>#</code> is for an id (one element), <code>.</code> is for a class (many). Put your own class on a region (<b>Appearance → CSS Classes</b>) and style that. Don't style APEX's <code>t-…</code> classes globally, or every region changes.</div>
    <div class="note red"><b class="tag">Trap</b>Inline CSS on one page is fine for practice. For real apps, put CSS in a static file (<code>#APP_FILES#css/app#MIN#.css</code> in User Interface Attributes → CSS File URLs) or use <b>Theme Roller</b>, so every page looks the same and the browser caches it.</div>
  </section>

    <div id="s1-tasks"></div>
  </section>

  <!-- 7 -->
  <section class="part" id="s1-summary">
    <h2><span class="n">08</span>One-page summary<span class="time">read tomorrow</span></h2>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="print">Print / save as PDF</button><span class="muted" style="font-size:13px">Prints only this summary on one page.</span></div>
    <div class="sheet" id="sheet">
      <div class="label">APEX Expert Drills · Session 1</div>
      <h1>JavaScript in APEX, the PL/SQL way</h1>
      <div class="cols">
        <div class="box"><h3>1. Where JS lives</h3><ul>
          <li><b>Function &amp; Global Var Declaration</b>: page functions (like a package)</li>
          <li><b>Execute when Page Loads</b>: runs once on open</li>
          <li><b>Dynamic Action → Execute JS Code</b>: runs on an event</li>
          <li><b>Static file</b> <code>#APP_FILES#js/x#MIN#.js</code>: shared code</li></ul></div>
        <div class="box"><h3>2. Variables</h3>
<pre>const BONUS = 0.10;   // CONSTANT
let sal = 5000;       // changes
let comm = null;      // NULL
`${ename} ${sal}`     // ename||' '||sal</pre></div>
        <div class="box"><h3>3. Page items</h3>
<pre>apex.item('P1_SAL').getValue()  // :P1_SAL
apex.item('P1_SAL').setValue(v) // :P1_SAL := v
$v('P1_SAL')  $s('P1_SAL', v)   // short forms
.isEmpty() .show() .hide() .enable() .disable()
setValue(v, null, true)  // no Change event</pre></div>
        <div class="box"><h3>4. Exceptions</h3>
<pre>try { … throw new Error('msg'); }
catch (err) { err.message }   // SQLERRM
finally { … }                 // always
apex.message.clearErrors();
apex.message.showErrors([{type:'error',
  location:['page','inline'], pageItem:'P1_SAL',
  message:'…', unsafe:false}]);
apex.message.showPageSuccess('OK');</pre></div>
        <div class="box"><h3>5. Which tool?</h3><ul>
          <li><b>PL/SQL</b>: data, DML, security, final validation</li>
          <li><b>Declarative DA</b>: show/hide/set value/refresh</li>
          <li><b>apex.* API</b>: items, regions, messages</li>
          <li><b>jQuery</b>: plain HTML, CSS classes, click handlers: <code>$('#static_id')</code>, <code>.addClass</code>, <code>.text</code>, <code>$(document).on('click', '.cls', fn)</code></li></ul></div>
        <div class="box y"><h3>Notes to remember</h3><ul>
          <li><code>const</code> by default, <code>let</code> if it changes, never <code>var</code></li>
          <li>Compare with <code>===</code> and <code>!==</code></li>
          <li>Use <code>apex.item()</code> for items, not <code>$('#P1_X').val()</code></li>
          <li>Give regions a <b>Static ID</b> for jQuery and <code>apex.region</code></li>
          <li>Browser check = speed, PL/SQL check = safety. Do both</li></ul></div>
        <div class="box r"><h3>Traps</h3><ul>
          <li>Item values are <b>strings</b>: <code>'5000' + 100 = '5000100'</code>. Use <code>Number()</code></li>
          <li><code>''</code> is not <code>null</code> in JS. Use <code>isEmpty()</code> or <code>!value</code></li>
          <li><code>setValue</code> fires Change, so DAs can loop. Pass <code>true</code> as the 3rd argument</li>
          <li>Never <code>.html(userText)</code>. Use <code>.text()</code> or <code>apex.util.escapeHTML</code></li>
          <li>"Nothing happens" → open the console (F12): the error is in red</li></ul></div>
        <div class="box"><h3>6. HTML &amp; CSS</h3>
<pre>#emp_region   /* Static ID (one)   */
.emp-box      /* CSS class (many)  */
#emp_region input  /* inside of   */
.emp-box { border-radius: 8px; }</pre><ul><li>Right-click → <b>Inspect</b> to see the HTML</li><li>Page → CSS → Inline for practice; static file / Theme Roller for real apps</li></ul></div>

<pre>:P1_SAL := 5000;        → $s('P1_SAL', 5000)
l := :P1_SAL;           → $v('P1_SAL')

EXCEPTION WHEN OTHERS   → catch (err)
SQLERRM                 → err.message

  <section class="part" id="s2-setup">
    <div class="note yellow"><b class="tag">Before you start (2 min)</b>You need an <b>EMP</b> table. At the office, use your own. On oracleapex.com: <b>SQL Workshop → Utilities → Sample Datasets → EMP / DEPT → Install</b>. Then create a blank page (Page 2) with an item <b>P2_DEPTNO</b> (Select List: <code>select dname d, deptno r from dept</code>) and a Static Content region with Static ID <b>emp_cards</b>.</div>

  <!-- 1 -->
  <section class="part" id="s2-why">
    <h2><span class="n">01</span>Submit vs AJAX: two ways to reach the database<span class="time">5 min</span></h2>
    <div class="tablewrap"><table class="dt">
      <tr><th></th><th>Page Submit (what you know)</th><th>AJAX (new)</th></tr>
      <tr><td>What happens</td><td>The whole page goes to the server, PL/SQL runs, and the <b>whole page reloads</b></td><td>JavaScript sends a small request, PL/SQL runs, and <b>only the data comes back</b></td></tr>
      <tr><td>User sees</td><td>A flash/reload, scroll position lost</td><td>Nothing moves except the part you update</td></tr>
      <tr><td>Speed</td><td>Renders the full page again</td><td>Sends only the data (a few KB of JSON)</td></tr>
      <tr><td>APEX pieces</td><td>Button → Submit → Processes → Branch</td><td>JS <code>apex.server.process</code> → <b>Ajax Callback</b> process</td></tr>
      <tr><td>Declarative version</td><td>Just a Submit button</td><td>DA <b>Execute Server-side Code</b> + "Items to Submit/Return", or <b>Refresh</b> a region</td></tr>
    </table></div>
    <div class="note yellow"><b class="tag">Note to remember</b>Try the declarative options first: <b>Refresh</b> a report with "Page Items to Submit", or a DA <b>Execute Server-side Code</b> that sets items. Write <code>apex.server.process</code> yourself when you need <b>data back as JSON</b> to build your own HTML, or full control over the response.</div>
  </section>

  <!-- 2 -->
  <section class="part" id="s2-plsql">
    <h2><span class="n">02</span>The PL/SQL side: an Ajax Callback that returns JSON<span class="time">10 min</span></h2>
    <div class="prose"><p>Page Designer → left tree → <b>Processing</b> tab (the arrows icon) → right-click <b>Ajax Callback</b> → Create Process. Name it <b>GET_EMPS</b> (JavaScript calls it by this name). Type: <b>Execute Code</b>.</p></div>
    <div class="compare">
      <div><span class="h pl">What you'd write today: a procedure with a cursor</span>
<pre>PROCEDURE get_emps (p_deptno IN NUMBER,
                    p_rc OUT SYS_REFCURSOR) IS
BEGIN
  OPEN p_rc FOR
    SELECT empno, ename, job, sal
      FROM emp
     WHERE deptno = p_deptno
     ORDER BY sal DESC;
END;</pre></div>
      <div><span class="h js">Ajax Callback GET_EMPS: same query, JSON out</span>
<pre>BEGIN
  apex_json.open_object;                 <span class="c">-- {</span>
  apex_json.open_array('rows');          <span class="c">--   "rows": [</span>
  FOR r IN (SELECT empno, ename, job, sal
              FROM emp
             WHERE deptno = :P2_DEPTNO   <span class="c">-- sent by JS</span>
             ORDER BY sal DESC) LOOP
    apex_json.open_object;               <span class="c">--   {</span>
    apex_json.write('empno', r.empno);
    apex_json.write('ename', r.ename);
    apex_json.write('job',   r.job);
    apex_json.write('sal',   r.sal);
    apex_json.close_object;              <span class="c">--   }</span>
  END LOOP;
  apex_json.close_array;                 <span class="c">--   ]</span>
  apex_json.close_object;                <span class="c">-- }</span>
END;</pre></div>
    </div>
    <h3>What JavaScript receives (JSON)</h3>
<pre>{ "rows": [
    { "empno": 7839, "ename": "KING",  "job": "PRESIDENT", "sal": 5000 },
    { "empno": 7782, "ename": "CLARK", "job": "MANAGER",   "sal": 2450 }
] }</pre>
    <div class="prose" style="margin-top:10px"><p>JSON is a JavaScript object written as text: <code>{ }</code> is a record and <code>[ ]</code> is a collection. Numbers stay numbers, which is nicer than item values.</p></div>
    <h3>Shorter: let SQL build the JSON (Oracle 12.2+)</h3>
<pre>DECLARE
  l_json CLOB;
BEGIN
  SELECT JSON_OBJECT('rows' VALUE
           JSON_ARRAYAGG(
             JSON_OBJECT('empno' VALUE empno, 'ename' VALUE ename,
                         'job'   VALUE job,   'sal'   VALUE sal)
             ORDER BY sal DESC RETURNING CLOB)
         RETURNING CLOB)
    INTO l_json
    FROM emp
   WHERE deptno = :P2_DEPTNO;
  apex_util.prn(l_json, FALSE);        <span class="c">-- writes the CLOB to the response</span>
END;</pre>
    <h3>Errors: EXCEPTION on the server</h3>
<pre>BEGIN
  IF :P2_DEPTNO IS NULL THEN
    RAISE_APPLICATION_ERROR(-20001, 'Choose a department first');
  END IF;
  <span class="c">-- … the apex_json code above …</span>
EXCEPTION
  WHEN OTHERS THEN
    apex_json.open_object;
    apex_json.write('error', SQLERRM);   <span class="c">-- send the message back as JSON</span>
    apex_json.close_object;
END;</pre>
    <div class="note yellow"><b class="tag">Note to remember</b>Inside an Ajax Callback, <code>:P2_DEPTNO</code> only has the browser's current value if JavaScript <b>sends it</b> (<code>pageItems</code>, in section 3). Otherwise you get the old session value. Extra values arrive as <code>apex_application.g_x01</code> … <code>g_x10</code>.</div>
    <div class="note red"><b class="tag">Trap</b>Never build SQL by concatenating what the browser sent (<code>'… WHERE ename = ''' || apex_application.g_x01 || ''''</code>). That's SQL injection. Use bind variables (<code>:P2_DEPTNO</code>) or PL/SQL variables, exactly as in your normal code.</div>
  </section>

  <!-- 3 -->
  <section class="part" id="s2-js">
    <h2><span class="n">03</span>The JavaScript side: apex.server.process<span class="time">15 min</span></h2>
    <div class="compare">
      <div><span class="h pl">PL/SQL: calling the procedure</span>
<pre>DECLARE
  l_rc SYS_REFCURSOR;
BEGIN
  get_emps(p_deptno =&gt; 10, p_rc =&gt; l_rc);
  <span class="c">-- loop over l_rc …</span>
EXCEPTION
  WHEN OTHERS THEN
    DBMS_OUTPUT.PUT_LINE(SQLERRM);
END;</pre></div>
      <div><span class="h js">JavaScript: calling the Ajax Callback</span>
<pre>apex.server.process('GET_EMPS', {      <span class="c">// process name</span>
  pageItems: '#P2_DEPTNO'              <span class="c">// send current value</span>
}).then(data =&gt; {                      <span class="c">// success</span>
  console.log(data.rows);              <span class="c">// the array</span>
}).catch(err =&gt; {                      <span class="c">// EXCEPTION</span>
  console.error(err);
});</pre></div>
    </div>
    <div class="prose" style="margin-top:12px"><p>The call does <b>not wait</b>. JavaScript carries on and runs <code>.then(…)</code> later, when the answer arrives. That's the biggest difference from PL/SQL, where every line waits for the one before. The modern way to write it, which reads almost like PL/SQL, is <b>async / await</b>:</p></div>
    <div class="codehead"><span>Paste into <span class="where">Function and Global Variable Declaration</span></span></div>
<pre><span class="c">// async function = "this function contains waits"</span>
async function loadEmps() {
  try {                                                    <span class="c">// BEGIN</span>
    const data = await apex.server.process('GET_EMPS', {  <span class="c">// wait for PL/SQL</span>
      pageItems: '#P2_DEPTNO'
    });
    if (data.error) throw new Error(data.error);           <span class="c">// error sent as JSON</span>
    console.table(data.rows);                              <span class="c">// see the rows</span>
    return data.rows;
  } catch (err) {                                          <span class="c">// EXCEPTION WHEN OTHERS</span>
    apex.message.clearErrors();
    apex.message.showErrors([{ type: 'error', location: 'page',
      message: err.message || 'Could not load employees', unsafe: false }]);
    return [];
  }                                                        <span class="c">// END</span>
}</pre>
    <div class="codehead"><span><span class="where">Dynamic Action · Change on P2_DEPTNO · Execute JavaScript Code</span></span></div>
<pre>loadEmps();      <span class="c">// open F12 → Console, change the department, and watch the table appear</span></pre>
    <h3>Sending extra values (like procedure parameters)</h3>
<pre>apex.server.process('GET_EMPS', {
  x01: 'SAL',                   <span class="c">// → apex_application.g_x01 in PL/SQL</span>
  x02: 'DESC',                  <span class="c">// → apex_application.g_x02</span>
  pageItems: '#P2_DEPTNO,#P2_JOB'   <span class="c">// several items, comma-separated</span>
});</pre>
    <div class="note yellow"><b class="tag">Note to remember</b><code>await</code> only works inside a function marked <code>async</code>. Put the <code>try/catch</code> around the <code>await</code>, just like <code>BEGIN … EXCEPTION … END</code> around a procedure call.</div>
    <div class="note red"><b class="tag">Trap: using data before it arrives</b><pre style="margin-top:6px">let rows;
apex.server.process('GET_EMPS', {pageItems:'#P2_DEPTNO'}).then(d =&gt; rows = d.rows);
console.log(rows);   // undefined! The answer has not arrived yet.</pre>Use the data <b>inside</b> <code>.then(…)</code>, or after <code>await</code>.</div>
  </section>

  <!-- 4 -->
  <section class="part" id="s2-html">
    <h2><span class="n">04</span>HTML: turn the JSON rows into cards<span class="time">10 min</span></h2>
    <div class="compare">
      <div><span class="h pl">The PL/SQL way: htp.p in a PL/SQL Dynamic Content region</span>
<pre>BEGIN
  htp.p('&lt;div class="emp-cards"&gt;');
  FOR r IN (SELECT ename, job, sal FROM emp
             WHERE deptno = :P2_DEPTNO) LOOP
    htp.p('&lt;div class="emp-card"&gt;'
       || '&lt;h4&gt;' || apex_escape.html(r.ename) || '&lt;/h4&gt;'
       || '&lt;p&gt;'  || apex_escape.html(r.job)   || '&lt;/p&gt;'
       || '&lt;b&gt;'  || r.sal || '&lt;/b&gt;&lt;/div&gt;');
  END LOOP;
  htp.p('&lt;/div&gt;');
END;
<span class="c">-- needs a region refresh to update</span></pre></div>
      <div><span class="h js">The JavaScript way: build it from the JSON</span>
<pre>function renderCards(rows) {
  const esc = apex.util.escapeHTML;      <span class="c">// = apex_escape.html</span>
  const html = rows.map(r =&gt; `
    &lt;div class="emp-card ${r.sal &gt;= 3000 ? 'is-high' : ''}"&gt;
      &lt;h4&gt;${esc(r.ename)}&lt;/h4&gt;
      &lt;p&gt;${esc(r.job)}&lt;/p&gt;
      &lt;b&gt;${r.sal.toLocaleString()}&lt;/b&gt;
    &lt;/div&gt;`).join('');
  $('#emp_cards .t-Region-body').html(
    `&lt;div class="emp-cards"&gt;${html}&lt;/div&gt;`);
}</pre></div>
    </div>

<pre>loadEmps().then(rows =&gt; renderCards(rows));
<span class="c">// or, inside an async function:  renderCards(await loadEmps());</span></pre>

    <div class="tablewrap"><table class="dt">
      <tr><th>Tag</th><th>Means</th><th>Like in a report</th></tr>
      <tr><td><code>&lt;div&gt;</code></td><td>A box (no meaning, just grouping)</td><td>A region or a row</td></tr>
      <tr><td><code>&lt;h4&gt;</code> … <code>&lt;h1&gt;</code></td><td>Headings (h1 biggest)</td><td>Column heading / title</td></tr>

<pre><span class="c">/* The container: a responsive grid - as many 200px columns as fit */</span>

    <h2><span class="n">06</span>Fast with the database: 6 rules<span class="time">5 min</span></h2>
    <div class="tablewrap"><table class="dt">
      <tr><th>Rule</th><th>Why</th></tr>
      <tr><td><b>One call, all the data.</b> Return all rows in one JSON, not one call per row.</td><td>Each AJAX call costs a round trip to the server (often 50–200 ms).</td></tr>
      <tr><td><b>Filter and sort in SQL</b>, not in JavaScript.</td><td>The database is built for it, and fewer rows travel.</td></tr>
      <tr><td><b>Limit rows</b> (<code>FETCH FIRST 50 ROWS ONLY</code>), with paging or search for more.</td><td>Drawing 5,000 cards freezes the browser.</td></tr>
      <tr><td><b>Return only the columns you show.</b></td><td>Smaller JSON, faster transfer.</td></tr>
      <tr><td><b>Show a spinner</b> while waiting: <code>loadingIndicator: '#emp_cards'</code></td><td>The user knows something is happening.</td></tr>
      <tr><td><b>Wait for typing to stop</b> before searching (debounce, ~300 ms).</td><td>Avoids one database call per key press.</td></tr>
    </table></div>
<pre>apex.server.process('GET_EMPS',
  { pageItems: '#P2_DEPTNO' },

/* ===================== STATE + SAVING ===================== */
const LS = 'apexdrills.v1';
const state = { answers:{}, days:{}, quiz:{} };
let db = null, uid = null;
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
(function(){ const l = lsRead(); if(l){ Object.assign(state.answers, l.answers||{}); Object.assign(state.days, l.days||{}); Object.assign(state.quiz, l.quiz||{}); } })();

function setSync(t){ const m = document.getElementById('syncmsg'); (m || document.getElementById('sync')).textContent = t; }
const timers = {};
function saveAnswer(id, text){
  state.answers[id] = { text, at: Date.now() };
  lsWrite(); updateStats();
  if(!db || !uid){ remote.push('answers', id, state.answers[id]); return; }
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try{ await db.doc(`data/users/${uid}/answers/${id}`).set(state.answers[id]); setSync('All work saved to your account'); }
    catch(e){ setSync('Saved on this device; account save failed, will retry on next edit'); }
  }, 900);
}
async function saveDoc(path, data){
  lsWrite(); updateStats();
  if(!db || !uid){ const [kind, id] = path.split('/'); remote.push(kind, id, data); return; }
  try{ await db.doc(`data/users/${uid}/${path}`).set(data); setSync('All work saved to your account'); }catch(e){ setSync('Saved on this device only'); }
}

async function connect(){
  if(!window.claude?.use){ remote.start(); return; }
  const timeout = setTimeout(()=>setSync('Saving on this device only'), 10000);
  try{
    const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!d || !user){ clearTimeout(timeout); remote.start(); return; }
    uid = await user.id();
    if(!uid){ clearTimeout(timeout); setSync('Saving on this device only'); return; }
    db = d;
    const merge = (col, target, wrap) => new Promise(res => {
      let first = true;
      db.collection(`data/users/${uid}/${col}`).onSnapshot(snap => {
        clearTimeout(timeout);
        snap.docs.forEach(doc => {
          const v = doc.data(); const cur = target[doc.id];
          if(!cur || (v.at||0) >= (cur.at||0)) target[doc.id] = v;
        });
        if(first){
          first = false;
          // push up anything only this device has (never lose work)
          Object.keys(target).forEach(k => { if(!snap.docs.some(x=>x.id===k)) db.doc(`data/users/${uid}/${col}/${k}`).set(target[k]).catch(()=>{}); });
          res();
        }
        lsWrite(); updateStats(); refreshOpenView();
      }, () => { clearTimeout(timeout); setSync('Saving on this device only'); res(); });
    });
    await Promise.all([merge('answers', state.answers), merge('days', state.days), merge('quiz', state.quiz)]);
    setSync('All work saved to your account');
  }catch(e){ clearTimeout(timeout); setSync('Saving on this device only'); }
}

/* ===================== SYNC FOR THE GITHUB COPY =====================
   On github.io there is no Claude account, so answers go to the separate
   apex-api Worker and its own "apex" database (passphrase APEX_KEY). Newer copy always wins on
   both sides; the server also keeps every version. Unsent saves wait in
   this browser and retry, so nothing typed offline is lost. */
const remote = (function(){
  const API = 'https://apex-api.anandm401-amazon.workers.dev';
  const QK = 'apexdrills.queue', KEY = 'apex:key';
  let on = false, timer = null, busy = false;
  const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const put = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
  let queue = (() => { try{ return JSON.parse(get(QK)) || {}; }catch(e){ return {}; } })();
  const saveQ = () => put(QK, JSON.stringify(queue));
  const key = () => get(KEY) || '';
  async function call(path, body, keepalive){
    const r = await fetch(API + path, { method:'POST', keepalive: !!keepalive, headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ key: key(), ...body }) });
    const j = await r.json().catch(() => ({}));
    if(r.status === 401) throw Object.assign(new Error('wrong key'), { code: 401 });
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  function push(kind, id, data){
    queue[kind + '/' + id] = { kind, id, data }; saveQ();
    if(!on) return;
    clearTimeout(timer); timer = setTimeout(flush, 1000);
  }
  async function flush(){
    if(!on || busy) return;
    const docs = Object.values(queue).slice(0, 300);
    if(!docs.length){ synced(); return; }
    busy = true;
    try{
      await call('/save', { docs });
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
      synced();
      if(Object.keys(queue).length) setTimeout(flush, 200);
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }finally{ busy = false; }
  }
  async function pull(){
    if(!on) return;
    try{
      const j = await call('/read', {});
      const merge = (src, target, kind) => {
        Object.entries(src || {}).forEach(([id, v]) => {
          const cur = target[id];
          if(!cur || (v.at||0) > (cur.at||0)) target[id] = v;
          else if((cur.at||0) > (v.at||0)) queue[kind + '/' + id] = { kind, id, data: cur };
        });
        Object.keys(target).forEach(id => { if(!(src||{})[id]) queue[kind + '/' + id] = { kind, id, data: target[id] }; });
      };
      merge(j.answers, state.answers, 'answers'); merge(j.days, state.days, 'days'); merge(j.quiz, state.quiz, 'quiz');
      saveQ(); lsWrite(); updateStats(); refreshOpenView();
      await flush();
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }
  }
  const pending = () => Object.keys(queue).length;
  function synced(){
    put('apexdrills.lastSync', String(Date.now()));
    setSync('Synced ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }));
  }
  /* Last chance when the tab is hidden, closed or the browser quits:
     one keepalive request that outlives the page. */
  function flushOnLeave(){
    if(!on || !pending()) return;
    const docs = Object.values(queue).slice(0, 300);
    call('/save', { docs }, true).then(() => {
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
    }).catch(() => {});
  }
  /* The bar stays on screen: status, Sync now, change passphrase. */
  function bar(){
    const box = document.getElementById('sync');
    box.innerHTML = `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="syncmsg"></span>
      <button class="btn primary" id="syncnow" type="button">Sync now</button>
      <button class="btn" id="synckey" type="button">Change passphrase</button></span>`;
    box.querySelector('#syncnow').onclick = () => { if(!key()){ askKey('Enter your APEX passphrase:'); return; } on = true; setSync('Syncing…'); pull(); };
    box.querySelector('#synckey').onclick = () => askKey('Enter your APEX passphrase:');
  }
  function askKey(msg){
    const box = document.getElementById('sync');
    box.innerHTML = `<form id="keyform" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <label for="keyin">${msg}</label>
      <input id="keyin" type="password" autocomplete="current-password" style="font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:150px">
      <button class="btn primary" type="submit">Sync</button></form>`;
    box.querySelector('#keyform').onsubmit = e => {
      e.preventDefault();
      const v = box.querySelector('#keyin').value.trim(); if(!v) return;
      put(KEY, v); begin();
    };
  }
  let wired = false;
  function begin(){
    on = true; bar(); setSync('Syncing…'); pull();
    if(wired) return; wired = true;
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'hidden') flushOnLeave(); else pull();
    });
    window.addEventListener('pagehide', flushOnLeave);
    window.addEventListener('online', flush);
    setInterval(() => { if(pending()) flush(); }, 30000);
    /* While the page is open and on screen, fetch other devices' work every minute. */
    setInterval(() => { if(document.visibilityState === 'visible' && !busy) pull(); }, 60000);
  }
  function start(){
    if(!key()){ askKey('To sync across devices, enter your APEX passphrase:'); return; }
    begin();
  }
  return { push, start };
})();



const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const got = id => (TASKS[id] || []).filter(t => state.quiz[t.id]?.pick === 1).length;
  v.innerHTML = `<header class="head">
      <div class="label">1-hour sessions · built on your PL/SQL</div>
      <h1>APEX Expert Drills</h1>
      <p class="sub">Each session is 1 hour: the concept with PL/SQL next to JavaScript, code you can paste straight into APEX, notes to remember, traps, practice with step-by-step answers, and a one-page summary to read the next day.</p>
    </header>
    <div class="sessions">${SESSIONS.map(s => `<button class="scard ${s.ready ? '' : 'soon'}" ${s.ready ? `data-s="${s.id}"` : 'aria-disabled="true"'}>

      <span class="s" style="display:block;margin-top:4px;font-weight:600">${s.ready ? `${got(s.id)} / ${(TASKS[s.id]||[]).length} practice tasks done · <a href="#${s.id}-summary" onclick="event.stopPropagation()">summary</a>` : 'Coming next'}</span></span></button>`).join('')}</div>

  v.querySelectorAll('.scard[data-s]').forEach(b => b.onclick = () => { location.hash = b.dataset.s; });

/* ======================= SESSION ======================= */
function renderSession(id, anchor){
  const s = SESSIONS.find(x => x.id === id), tpl = document.getElementById(id);
  if(!s || !tpl){ renderHome(); return; }
  const v = document.getElementById('view');
  v.innerHTML = `<button class="back" id="back">← All sessions</button>
    <div class="label">Session ${s.n} · about 1 hour</div><h1>${esc(s.title)}</h1>`;
  v.appendChild(tpl.content.cloneNode(true));
  document.getElementById('back').onclick = () => { location.hash = ''; };
  const tasksEl = v.querySelector('#' + id + '-tasks');
  (TASKS[id] || []).forEach((t, i) => tasksEl.appendChild(buildTask(t, i)));
  v.querySelector('#print')?.addEventListener('click', () => { window.print(); });
  if(anchor){ const a = document.getElementById(anchor); if(a){ a.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}

function buildTask(t, i){
  const el = document.createElement('div'); el.className = 'task';
  const st = () => state.quiz[t.id]?.pick;
  el.innerHTML = `<div class="task-head"><span class="qn">Task ${i+1}</span><h3 style="margin:0">${t.title}</h3><span class="status"></span></div>
    <div class="body" style="margin-top:8px">${t.task}</div>
    <textarea class="mine" id="mine-${t.id}" placeholder="Optional: paste your code or notes here (saved)"></textarea>
    <div class="ask"><button class="btn good" data-a="1">✓ I got it</button><button class="btn bad" data-a="0">✗ I didn't get it, show me</button><button class="btn" data-a="show">Show the answer anyway</button></div>
    <div class="answer" hidden><div class="label">Step by step</div><ol class="stepx">${t.steps.map(x => `<li><div>${x}</div></li>`).join('')}</ol></div>`;
  const status = el.querySelector('.status'), ans = el.querySelector('.answer'), ta = el.querySelector('textarea');
  const paint = () => { const p = st();
    status.textContent = p === 1 ? 'Got it ✓' : p === 0 ? 'Review the steps' : '';
    status.className = 'status ' + (p === 1 ? 'ok' : p === 0 ? 'no' : '');
    if(p === 0) ans.hidden = false; };
  ta.value = state.answers[t.id]?.text || '';
  ta.addEventListener('input', () => saveAnswer(t.id, ta.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if(b.dataset.a === 'show'){ ans.hidden = !ans.hidden; return; }
    state.quiz[t.id] = { pick: Number(b.dataset.a), at: Date.now() };
    saveDoc('quiz/' + t.id, state.quiz[t.id]);
    if(b.dataset.a === '1') ans.hidden = true;
    paint();
  });
  paint();
  return el;
}

function fitTextarea(){}
function refreshOpenView(){ if(!location.hash) renderHome(); }
function route(){
  const h = location.hash.replace('#', '');
  if(!h){ renderHome(); return; }
  const sid = h.split('-')[0];
  if(SESSIONS.some(s => s.id === sid && s.ready)){
    if(document.getElementById('back') && document.getElementById(h)){ document.getElementById(h).scrollIntoView(); return; }
    renderSession(sid, h.includes('-') ? h : null);
  } else renderHome();
}
window.addEventListener('hashchange', route);
route(); connect();
