<template id="s5">
  <nav class="toc noprint">
    <a href="#s5-html">1. HTML that's easy to style<span>7m</span></a>
    <a href="#s5-sel">2. Selectors &amp; who wins<span>10m</span></a>
    <a href="#s5-box">3. The box model<span>8m</span></a>
    <a href="#s5-flex">4. Flexbox &amp; Grid layouts<span>12m</span></a>
    <a href="#s5-ut">5. Universal Theme &amp; where CSS lives<span>8m</span></a>
    <a href="#s5-practice">6. Practice<span>15m</span></a>
    <a href="#s5-summary">7. Summary</a>
  </nav>

  <section class="part" id="s5-html">
    <h2><span class="n">01</span>HTML that's easy to style<span class="time">7 min</span></h2>
    <div class="prose"><p>You'll write HTML in four places in APEX: <b>Static Content</b> regions, <b>HTML Expressions</b> in report columns, <b>Template Components</b> (Session 6) and JavaScript template literals. Good HTML is like a good table design: clear structure, meaningful names.</p></div>
    <div class="codehead"><span>A KPI strip: paste into a <span class="where">Static Content</span> region (Source → HTML Code)</span></div>
<pre>&lt;div class="kpis"&gt;
  &lt;div class="kpi"&gt;
    &lt;span class="kpi-label"&gt;Employees&lt;/span&gt;
    &lt;span class="kpi-value"&gt;&amp;P5_EMP_COUNT.&lt;/span&gt;    <span class="c">&lt;!-- page item value --&gt;</span>
  &lt;/div&gt;
  &lt;div class="kpi"&gt;
    &lt;span class="kpi-label"&gt;Total salary&lt;/span&gt;
    &lt;span class="kpi-value"&gt;&amp;P5_TOTAL_SAL.&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class="kpi is-alert"&gt;
    &lt;span class="kpi-label"&gt;Over budget&lt;/span&gt;
    &lt;span class="kpi-value"&gt;&amp;P5_OVER.&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;</pre>
    <div class="compare">
      <div><span class="h pl">The PL/SQL that fills it (Before Header computation/process)</span>
<pre>SELECT COUNT(*),
       TO_CHAR(SUM(sal), 'FM999G999'),
       COUNT(CASE WHEN sal &gt; 3000 THEN 1 END)
  INTO :P5_EMP_COUNT, :P5_TOTAL_SAL, :P5_OVER
  FROM emp;</pre></div>
      <div><span class="h js">How it substitutes</span>
<pre>&amp;P5_EMP_COUNT.   → 14       <span class="c">(escaped for you)</span>
&amp;P5_TOTAL_SAL.   → 29,025

<span class="c">/* &amp;ITEM. is APEX's substitution string:
   item value inserted when the page renders */</span></pre></div>
    </div>
    <div class="note yellow"><b class="tag">Note to remember</b>Name classes by <b>what the thing is</b> (<code>kpi</code>, <code>kpi-value</code>), not how it looks (<code>big-red-text</code>). Then you can change the look later without touching the HTML. It's the same idea as column names describing data, not formatting.</div>
  </section>

  <section class="part" id="s5-sel">
    <h2><span class="n">02</span>Selectors, and which rule wins<span class="time">10 min</span></h2>
    <div class="tablewrap"><table class="dt">
      <tr><th>Selector</th><th>Matches</th><th>SQL feeling</th></tr>
      <tr><td><code>.kpi</code></td><td>every element with class kpi</td><td><code>WHERE class = 'kpi'</code></td></tr>
      <tr><td><code>#emp_region</code></td><td>the one element with that id (Static ID)</td><td><code>WHERE id = …</code> (primary key)</td></tr>
      <tr><td><code>.kpi.is-alert</code></td><td>both classes on the same element</td><td><code>AND</code></td></tr>
      <tr><td><code>.kpis .kpi-value</code></td><td>kpi-value <b>inside</b> kpis (any depth)</td><td>a join to a child row</td></tr>
      <tr><td><code>.kpi, .card</code></td><td>either one</td><td><code>OR</code> / UNION</td></tr>
      <tr><td><code>.kpi:hover</code>, <code>tr:nth-child(even)</code></td><td>a state, or a position</td><td>a condition on state/rownum</td></tr>
    </table></div>
    <h3>When two rules disagree: specificity</h3>
<pre>.kpi-value            { color: black; }   <span class="c">/* 1 class            → weight 0-1-0 */</span>
.kpi.is-alert .kpi-value { color: red; }  <span class="c">/* 3 classes          → weight 0-3-0  WINS */</span>
#emp_region .kpi-value { color: blue; }  <span class="c">/* 1 id + 1 class     → weight 1-1-0  WINS over both */</span></pre>
    <div class="prose" style="margin-top:10px"><p>Count <b>ids</b>, then <b>classes</b>, then <b>tags</b>; the bigger number wins, compared left to right like <code>ORDER BY ids DESC, classes DESC, tags DESC</code>. If they're equal, the rule written <b>last</b> wins.</p></div>
    <div class="note yellow"><b class="tag">Note to remember</b>Keep selectors short: one or two classes. Then your rule only needs one extra class to win over Universal Theme's rules.</div>
    <div class="note red"><b class="tag">Trap: !important</b><code>color: red !important;</code> beats everything, and then the next fix needs another <code>!important</code>. Treat it like a hint in SQL: a last resort, with a comment saying why.</div>
  </section>

  <section class="part" id="s5-box">
    <h2><span class="n">03</span>The box model: every element is a box<span class="time">8 min</span></h2>
<pre>┌──────────── margin (space OUTSIDE, between boxes) ────────────┐
│ ┌────────── border ──────────────────────────────────────┐    │
│ │ ┌──────── padding (space INSIDE, around content) ────┐ │    │
│ │ │                content (width × height)            │ │    │
│ │ └────────────────────────────────────────────────────┘ │    │
│ └────────────────────────────────────────────────────────┘    │
└───────────────────────────────────────────────────────────────┘</pre>
<pre>.kpi {
  padding: 12px 16px;         <span class="c">/* inside: top/bottom 12, left/right 16 */</span>
  border: 1px solid #dde1ec;
  border-radius: 10px;
  margin: 0;                  <span class="c">/* use gap on the parent instead (next section) */</span>
  box-sizing: border-box;     <span class="c">/* width includes padding + border - predictable */</span>
}</pre>
    <div class="tablewrap"><table class="dt">
      <tr><th>Unit</th><th>Means</th><th>Use for</th></tr>
      <tr><td><code>px</code></td><td>fixed pixels</td><td>borders, small spacing</td></tr>
      <tr><td><code>rem</code></td><td>× the root font size (usually 16px)</td><td>font sizes, spacing that scales with text</td></tr>
      <tr><td><code>%</code></td><td>of the parent's width</td><td>widths</td></tr>
      <tr><td><code>fr</code></td><td>a share of the free space (in Grid)</td><td>columns</td></tr>
    </table></div>
    <div class="note yellow"><b class="tag">Note to remember</b>Not sure why something is mis-placed? Right-click → <b>Inspect</b>. DevTools draws the margin (orange), padding (green) and content (blue) for the element you pick. It's like the execution plan of your layout.</div>
  </section>

  <section class="part" id="s5-flex">
    <h2><span class="n">04</span>Layouts: Flexbox for a row, Grid for a table of boxes<span class="time">12 min</span></h2>
    <div class="compare">
      <div><span class="h js">Flexbox: one row (or column)</span>
<pre>.kpis {
  display: flex;               <span class="c">/* children side by side */</span>
  gap: 12px;                   <span class="c">/* space between them */</span>
  flex-wrap: wrap;             <span class="c">/* wrap on a phone */</span>
  align-items: stretch;        <span class="c">/* same height */</span>
}
.kpi { flex: 1 1 160px; }      <span class="c">/* grow, shrink, start at 160px */</span>

<span class="c">/* a toolbar: title left, buttons right */</span>
.bar { display: flex; justify-content: space-between;
       align-items: center; }</pre></div>
      <div><span class="h js">Grid: rows and columns</span>
<pre>.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

<span class="c">/* a fixed form layout: label | field */</span>
.form-2col {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 8px 12px;
}</pre></div>
    </div>
    <div class="tablewrap"><table class="dt">
      <tr><th>Property</th><th>Does</th></tr>
      <tr><td><code>justify-content</code></td><td>Spacing along the row: <code>flex-start</code>, <code>center</code>, <code>space-between</code></td></tr>
      <tr><td><code>align-items</code></td><td>Lining up across the row (vertically): <code>center</code>, <code>stretch</code></td></tr>
      <tr><td><code>gap</code></td><td>Space between children (works in Flex and Grid)</td></tr>
      <tr><td><code>flex: 1</code></td><td>"Take an equal share of the space"</td></tr>
      <tr><td><code>repeat(auto-fill, minmax(220px, 1fr))</code></td><td>"As many columns of at least 220px as fit." Responsive with no media query</td></tr>
    </table></div>
    <h3>Responsive: change the layout on small screens</h3>
<pre>@media (max-width: 640px) {        <span class="c">/* only when the screen is 640px or narrower */</span>
  .form-2col { grid-template-columns: 1fr; }   <span class="c">/* label above field */</span>
  .kpi-value { font-size: 1.25rem; }
}</pre>
    <div class="codehead"><span>The full KPI strip CSS: <span class="where">Page → CSS → Inline</span></span></div>
<pre>.kpis { display: flex; flex-wrap: wrap; gap: 12px; }
.kpi  { flex: 1 1 160px; display: flex; flex-direction: column; gap: 2px;
        padding: 12px 16px; border: 1px solid #dde1ec; border-radius: 10px; background: #fff; }
.kpi-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #5d6478; }
.kpi-value { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi.is-alert { border-color: #d33; }
.kpi.is-alert .kpi-value { color: #a32020; }</pre>
    <div class="note yellow"><b class="tag">Note to remember</b><b>Flex</b> = one line of things (KPI strip, toolbar, label + value). <b>Grid</b> = rows and columns (cards, form layout). Use <code>gap</code> instead of margins on every child.</div>
  </section>

  <section class="part" id="s5-ut">
    <h2><span class="n">05</span>Universal Theme, and where your CSS should live<span class="time">8 min</span></h2>
    <div class="tablewrap"><table class="dt">
      <tr><th>Need</th><th>Best place</th></tr>
      <tr><td>Change colours/fonts for the whole app</td><td><b>Theme Roller</b> (runtime Developer Toolbar → Customize → Theme Roller), then save as a new style</td></tr>
      <tr><td>A region/button looks a bit different</td><td><b>Template Options</b> on the component (no CSS at all)</td></tr>
      <tr><td>Your own classes used on many pages</td><td>Static file <code>css/app.css</code> → User Interface Attributes → <b>CSS File URLs</b>: <code>#APP_FILES#css/app#MIN#.css</code></td></tr>
      <tr><td>Small tweak used on one page</td><td>Page → <b>CSS → Inline</b></td></tr>
      <tr><td>Small app-wide tweak with no file</td><td>Theme Roller → <b>Custom CSS</b> box</td></tr>
    </table></div>
    <h3>Free classes from Universal Theme</h3>
<pre>u-success-text   u-danger-text   u-warning-text    <span class="c">/* coloured text */</span>
u-success        u-danger        u-warning         <span class="c">/* coloured background */</span>
u-color-1 … u-color-45                              <span class="c">/* theme colour sets */</span></pre>
    <div class="prose" style="margin-top:8px"><p>Put them in a region's or column's <b>CSS Classes</b>, or return them from SQL (<code>CASE … THEN 'u-danger-text' END</code>). They follow Theme Roller, so they stay right when the app's colours change.</p></div>
    <div class="note yellow"><b class="tag">Note to remember: fast pages</b>CSS in a static file is downloaded <b>once</b> and cached for every page. Inline CSS is sent again with every page view. For speed, move anything you reuse into the file.</div>
    <div class="note red"><b class="tag">Trap</b>Don't restyle APEX's own classes globally (<code>.t-Region { … }</code>). Every region in the app changes, and an APEX upgrade can rename them. Add <b>your</b> class to the component and style that.</div>
  </section>

  <section class="part" id="s5-practice">
    <h2><span class="n">06</span>Practice<span class="time">15 min</span></h2>
    <div id="s5-tasks"></div>
  </section>

  <section class="part" id="s5-summary">
    <h2><span class="n">07</span>One-page summary<span class="time">read tomorrow</span></h2>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="print">Print / save as PDF</button></div>
    <div class="sheet">
      <div class="label">APEX Expert Drills · Session 5</div>
      <h1>CSS &amp; HTML for APEX pages</h1>
      <div class="cols">
        <div class="box"><h3>HTML</h3>
<pre>&lt;div class="kpi"&gt;
  &lt;span class="kpi-value"&gt;&amp;P5_TOTAL.&lt;/span&gt;
&lt;/div&gt;</pre><ul><li>Name classes by meaning, not look</li><li><code>&amp;ITEM.</code> = item value at render</li></ul></div>
        <div class="box"><h3>Selectors</h3>
<pre>.cls  #id  .a.b (AND)  .a .b (inside)
.a, .b (OR)  :hover  tr:nth-child(even)</pre><ul><li>Winner: more ids → more classes → more tags → last written</li></ul></div>
        <div class="box"><h3>Box model</h3>
<pre>padding = inside   margin = outside
border  box-sizing: border-box
units: px  rem  %  fr</pre></div>
        <div class="box"><h3>Layout</h3>
<pre>.row  { display:flex; gap:12px; flex-wrap:wrap;
        justify-content:space-between;
        align-items:center; }
.grid { display:grid; gap:16px;
  grid-template-columns:
    repeat(auto-fill, minmax(220px,1fr)); }
@media (max-width:640px) { … }</pre></div>
        <div class="box"><h3>Where CSS lives</h3><ul>
          <li>App look → <b>Theme Roller</b></li>
          <li>One component → <b>Template Options</b></li>
          <li>Reused classes → <code>#APP_FILES#css/app#MIN#.css</code></li>
          <li>One page → Page → CSS → Inline</li></ul></div>
        <div class="box"><h3>UT classes</h3>
<pre>u-success-text u-danger-text u-warning-text
u-success u-danger u-warning
u-color-1 … u-color-45</pre></div>
        <div class="box y"><h3>Notes to remember</h3><ul>
          <li>Flex = one line; Grid = rows × columns; use <code>gap</code></li>
          <li>Inspect (right-click) shows the box model</li>
          <li>Static CSS file = cached = faster</li>
          <li>SQL decides the class, CSS decides the look</li></ul></div>
        <div class="box r"><h3>Traps</h3><ul>
          <li><code>!important</code> wars, so keep selectors short instead</li>
          <li>Restyling <code>.t-…</code> APEX classes globally</li>
          <li>Fixed widths in px break on phones; use <code>%</code>, <code>fr</code>, <code>minmax</code></li></ul></div>

<!-- ======================= SESSION 6 ======================= -->
<template id="s6">
  <nav class="toc noprint">
    <a href="#s6-why">1. Why templates<span>5m</span></a>
    <a href="#s6-dir">2. Template directives<span>12m</span></a>
    <a href="#s6-builtin">3. Built-in components<span>8m</span></a>
    <a href="#s6-build">4. Build your own<span>15m</span></a>
    <a href="#s6-use">5. Use it with SQL<span>5m</span></a>
    <a href="#s6-practice">6. Practice<span>15m</span></a>
    <a href="#s6-summary">7. Summary</a>
  </nav>

  <section class="part" id="s6-why">
    <h2><span class="n">01</span>Why templates: from htp.p to "HTML with holes"<span class="time">5 min</span></h2>
    <div class="compare">
      <div><span class="h pl">The old way: HTML glued together in PL/SQL</span>
<pre>FOR r IN (SELECT ename, job, sal FROM emp) LOOP
  htp.p('&lt;div class="emp-card'
     || CASE WHEN r.sal &gt;= 3000 THEN ' is-high' END
     || '"&gt;&lt;h4&gt;' || apex_escape.html(r.ename)
     || '&lt;/h4&gt;&lt;p&gt;' || apex_escape.html(r.job)
     || '&lt;/p&gt;&lt;/div&gt;');
END LOOP;
<span class="c">-- hard to read, easy to forget escaping,
-- copy-pasted to every page that needs it</span></pre></div>
      <div><span class="h js">A Template Component: write the HTML once</span>
<pre>&lt;div class="emp-card {if IS_HIGH/}is-high{endif/}"&gt;
  &lt;h4&gt;#ENAME#&lt;/h4&gt;
  &lt;p&gt;#JOB#&lt;/p&gt;
&lt;/div&gt;

<span class="c">-- SQL feeds the holes (#ENAME#, #JOB#, IS_HIGH)
-- values are escaped for you
-- reuse it on any page, as a region or a column</span></pre></div>
    </div>
    <div class="note yellow"><b class="tag">Note to remember</b><b>Template Components</b> (APEX 23.1 and later) are reusable HTML pieces stored under <b>Shared Components → Plug-ins</b>. You write the HTML once with placeholders, and APEX fills them from your SQL. They're the modern replacement for many custom plug-ins and <code>htp.p</code> loops.</div>
  </section>

  <section class="part" id="s6-dir">
    <h2><span class="n">02</span>Template directives: IF, CASE and LOOP inside HTML<span class="time">12 min</span></h2>
    <div class="tablewrap"><table class="dt">
      <tr><th>PL/SQL</th><th>Template directive</th></tr>
      <tr><td><code>r.ename</code></td><td><code>#ENAME#</code> (placeholder, escaped)</td></tr>
      <tr><td><code>IF … THEN … ELSIF … ELSE … END IF;</code></td><td><code>{if A/} … {elsif B/} … {else/} … {endif/}</code></td></tr>
      <tr><td><code>CASE status WHEN 'OPEN' THEN … ELSE … END</code></td><td><code>{case STATUS/}{when OPEN/} … {otherwise/} … {endcase/}</code></td></tr>
      <tr><td><code>FOR t IN (… split tags …) LOOP</code></td><td><code>{loop "," TAGS/} &amp;APEX$ITEM. {endloop/}</code></td></tr>
      <tr><td>Calling another procedure with parameters</td><td><code>{with/} NAME:=value {apply COMPONENT/}</code></td></tr>
    </table></div>
    <div class="codehead"><span>Examples (the HTML part of a template component)</span></div>
<pre><span class="c">&lt;!-- IF: a value is "true" when it's not empty, and not N / false --&gt;</span>
{if COMM/}
  &lt;span class="comm"&gt;Commission: #COMM#&lt;/span&gt;
{else/}
  &lt;span class="comm none"&gt;No commission&lt;/span&gt;
{endif/}

<span class="c">&lt;!-- CASE on a value --&gt;</span>
{case STATUS/}
  {when ACTIVE/}  &lt;span class="u-success-text"&gt;Active&lt;/span&gt;
  {when LEAVE/}   &lt;span class="u-warning-text"&gt;On leave&lt;/span&gt;
  {otherwise/}    &lt;span class="u-danger-text"&gt;#STATUS#&lt;/span&gt;
{endcase/}

<span class="c">&lt;!-- LOOP over a comma-separated value, e.g. 'SQL,PLSQL,APEX' --&gt;</span>
&lt;ul class="skills"&gt;
  {loop "," SKILLS/}&lt;li&gt;&amp;APEX$ITEM.&lt;/li&gt;{endloop/}
&lt;/ul&gt;</pre>
    <div class="compare">
      <div><span class="h pl">SQL decides the values…</span>
<pre>SELECT ename, job, sal, comm,
       CASE WHEN sal &gt;= 3000 THEN 'Y' END  AS is_high,
       CASE WHEN hiredate &lt; DATE '1982-01-01'
            THEN 'ACTIVE' ELSE 'LEAVE' END  AS status,
       'SQL,PLSQL,APEX'                     AS skills
  FROM emp</pre></div>
      <div><span class="h js">…the template only shows them</span>
<pre>&lt;div class="emp-card {if IS_HIGH/}is-high{endif/}"&gt;
  &lt;h4&gt;#ENAME#&lt;/h4&gt;
  &lt;p&gt;#JOB# · #SAL#&lt;/p&gt;
  {case STATUS/}{when ACTIVE/}&lt;b class="u-success-text"&gt;Active&lt;/b&gt;
  {otherwise/}&lt;b class="u-warning-text"&gt;#STATUS#&lt;/b&gt;{endcase/}
&lt;/div&gt;</pre></div>
    </div>
    <div class="note yellow"><b class="tag">Note to remember</b>Keep logic in <b>SQL</b> (<code>CASE … AS is_high</code>) and keep the template <b>simple</b>: if, case, loop on ready-made values. It's the same rule as before: SQL decides, CSS styles.</div>
    <div class="note red"><b class="tag">Trap</b>Directive names refer to <b>attribute/column names</b> (<code>{if IS_HIGH/}</code>), with <b>no</b> # signs. Placeholders in the HTML use <b>#…#</b>. Mixing them up (<code>{if #IS_HIGH#/}</code>) silently fails.</div>
  </section>

  <section class="part" id="s6-builtin">
    <h2><span class="n">03</span>Built-in template components: use before you build<span class="time">8 min</span></h2>
    <div class="prose"><p>Universal Theme ships ready-made template components, such as <b>Badge</b>, <b>Avatar</b>, <b>Content Row</b> and <b>Comments</b>. You'll see them in the Page Designer region gallery and as report <b>column types</b>.</p></div>
    <div class="codehead"><span>A status <b>Badge</b> in a Classic or Interactive Report column</span></div>
<pre><span class="c">-- 1. Query: return a label and a state for each row</span>
SELECT ename, job, sal,
       CASE WHEN sal &gt;= 3000 THEN 'High' WHEN sal &lt; 1000 THEN 'Low' ELSE 'Normal' END AS sal_band,
       CASE WHEN sal &gt;= 3000 THEN 'danger' WHEN sal &lt; 1000 THEN 'success' ELSE 'info' END AS sal_state
  FROM emp

<span class="c">-- 2. Column SAL_BAND → Type: Badge (a template component)
--    Settings: Label = SAL_BAND, Value = SAL_BAND, State = SAL_STATE
-- 3. Column SAL_STATE → Type: Hidden</span></pre>
    <div class="compare">
      <div><span class="h pl">Before: HTML Expression on the column</span>
<pre>&lt;span class="badge &amp;SAL_STATE."&gt;&amp;SAL_BAND.&lt;/span&gt;
<span class="c">+ your own CSS for .badge, .danger …</span></pre></div>
      <div><span class="h js">Now: Badge template component</span>
<pre><span class="c">Column type Badge + settings
→ themed, accessible markup,
  colours follow Theme Roller,
  no CSS to write</span></pre></div>
    </div>
    <div class="note yellow"><b class="tag">Note to remember</b>Order of choice: <b>built-in region or column type</b> (Cards, Badge, Content Row…) → <b>your own Template Component</b> → JavaScript-built HTML (Session 2). Each step down is more work to maintain.</div>
  </section>

  <section class="part" id="s6-build">
    <h2><span class="n">04</span>Build your own: an "Employee Card" component<span class="time">15 min</span></h2>
    <ol>
      <li><b>Shared Components → Plug-ins → Create → From Scratch.</b> Name: <code>Employee Card</code>. Type: <b>Template Component</b>.</li>
      <li><b>Available As</b>: tick <b>Single (Partial)</b> and <b>Multiple (Report)</b>, so it can show one record or a list.</li>
      <li><b>Custom Attributes</b> → Add attribute, one per hole: <code>ENAME</code>, <code>JOB</code>, <code>SAL</code>, <code>IS_HIGH</code>, <code>STATUS</code> (Type: Session State Value, which is mapped to a column later). Like the parameters of a procedure.</li>
      <li><b>Partial template</b>: paste the HTML below.</li>
      <li><b>CSS</b>: add it under the plug-in's <b>Files</b> (as a file) or, for practice, in the page's CSS → Inline.</li>
    </ol>
    <div class="codehead"><span><span class="where">Plug-in → Templates → Partial</span></span></div>
<pre>&lt;div class="emp-card {if IS_HIGH/}is-high{endif/}"&gt;
  &lt;div class="emp-card-top"&gt;
    &lt;h4&gt;#ENAME#&lt;/h4&gt;
    {case STATUS/}
      {when ACTIVE/}&lt;span class="pill pill-ok"&gt;Active&lt;/span&gt;
      {otherwise/}&lt;span class="pill pill-warn"&gt;#STATUS#&lt;/span&gt;
    {endcase/}
  &lt;/div&gt;
  &lt;p class="emp-job"&gt;#JOB#&lt;/p&gt;
  &lt;p class="emp-sal"&gt;#SAL#&lt;/p&gt;
&lt;/div&gt;</pre>
    <div class="codehead"><span>CSS for the component</span></div>
<pre>.emp-card { padding: 12px 14px; border: 1px solid #dde1ec; border-radius: 10px; background: #fff; }
.emp-card.is-high { border-color: #d33; }
.emp-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.emp-card h4 { margin: 0; font-size: 1rem; }
.emp-job { margin: 2px 0 6px; color: #5d6478; font-size: .85rem; }
.emp-sal { margin: 0; font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill-ok { background: #e2f3ea; color: #2f855a; }
.pill-warn { background: #fff4c7; color: #8a6400; }</pre>
    <div class="note yellow"><b class="tag">Note to remember</b>A Template Component is like a <b>package</b> for HTML: the attributes are the spec (parameters), the template is the body, and every page calls it with its own SQL. Fix it once and every page updates.</div>
    <div class="note red"><b class="tag">Trap</b>Placeholders are <b>escaped by default</b>, which protects you from XSS. Don't switch escaping off to "make HTML work". Return plain values from SQL and put the HTML in the template.</div>
  </section>

  <section class="part" id="s6-use">
    <h2><span class="n">05</span>Use it: a region fed by SQL<span class="time">5 min</span></h2>
    <ol>
      <li>Create a region → <b>Type: Employee Card</b> (your component appears in the list).</li>
      <li><b>Source</b>: SQL Query, with the query from section 2 (it returns ename, job, sal, is_high, status).</li>
      <li><b>Attributes</b>: map each component attribute to a column: ENAME → ENAME, IS_HIGH → IS_HIGH, and so on.</li>
      <li>To lay the cards out side by side, add a region CSS class like <code>emp-grid</code> and the Grid CSS from Session 5: <code>.emp-grid .t-Region-body &gt; * { … }</code>, or set the component's <b>Report body</b> template to wrap rows in <code>&lt;div class="emp-cards"&gt;</code>.</li>
    </ol>
    <div class="compare">
      <div><span class="h pl">PL/SQL Dynamic Content (before)</span>
<pre>RETURN render_cards(:P6_DEPTNO);
<span class="c">-- your function builds a CLOB of HTML</span></pre></div>
      <div><span class="h js">Template Component region (now)</span>
<pre>SELECT … FROM emp WHERE deptno = :P6_DEPTNO
<span class="c">-- + attribute mapping, no HTML in PL/SQL
-- Refresh on P6_DEPTNO change: DA Refresh,
-- Page Items to Submit = P6_DEPTNO</span></pre></div>
    </div>
  </section>

  <section class="part" id="s6-summary">
    <h2><span class="n">07</span>One-page summary<span class="time">read tomorrow</span></h2>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="print">Print / save as PDF</button></div>
    <div class="sheet">
      <div class="label">APEX Expert Drills · Session 6</div>
      <h1>Templates &amp; Template Components</h1>
      <div class="cols">
        <div class="box"><h3>What</h3><ul>
          <li>Reusable HTML with placeholders, under Shared Components → Plug-ins → Type <b>Template Component</b> (23.1+)</li>
          <li>Attributes = parameters; template = body; SQL fills it</li>
          <li>Use as a region (Multiple) or a report column (Single)</li></ul></div>
        <div class="box"><h3>Placeholders</h3>
<pre>#ENAME#            column/attribute (escaped)
&amp;P6_DEPTNO.        page item
&amp;APEX$ITEM.        current item in a loop</pre></div>
        <div class="box"><h3>Directives</h3>
<pre>{if A/} … {elsif B/} … {else/} … {endif/}
{case S/}{when X/} … {otherwise/} … {endcase/}
{loop "," TAGS/}&amp;APEX$ITEM.{endloop/}
{with/} NAME:=val {apply COMPONENT/}</pre></div>
        <div class="box"><h3>Built-in</h3><ul>
          <li>Badge, Avatar, Content Row, Comments, Cards…</li>
          <li>Badge column: Label, Value, State (success / info / warning / danger)</li></ul></div>
        <div class="box"><h3>PL/SQL twins</h3>
<pre>htp.p('&lt;h4&gt;'||apex_escape.html(x)||'&lt;/h4&gt;')
   → &lt;h4&gt;#ENAME#&lt;/h4&gt;
IF … END IF       → {if …/} … {endif/}
CASE … END        → {case …/}{when …/}{endcase/}
FOR … LOOP        → {loop …/}{endloop/}
package spec/body → attributes/template</pre></div>
        <div class="box"><h3>Order of choice</h3><ol style="margin:0;padding-left:18px;font-size:13.5px">
          <li>Built-in region/column type</li><li>Your own Template Component</li><li>JS-built HTML (AJAX data)</li><li>PL/SQL <code>htp.p</code> (legacy)</li></ol></div>
        <div class="box y"><h3>Notes to remember</h3><ul>
          <li>SQL decides (<code>CASE … AS is_high</code>), the template shows, CSS styles</li>
          <li>Fix the component once, and every page updates</li>
          <li>Keep component CSS with the plug-in (its Files)</li></ul></div>
        <div class="box r"><h3>Traps</h3><ul>
          <li>Directives use bare names <code>{if IS_HIGH/}</code>; HTML uses <code>#IS_HIGH#</code></li>
          <li>Don't turn off escaping to pass HTML in. Put the HTML in the template</li>
          <li>Too much logic in the template means it belongs in SQL</li></ul></div>
      </div>
    </div>
  </section>
</template>

<script>

    { id:'s1-q1', title:'Set and calculate on page load',
      task:`<p>Create items <code>P1_ENAME</code> (Text), <code>P1_SAL</code> (Number) and <code>P1_ANNUAL</code> (Display Only). When the page opens, set the name to <b>BLAKE</b> and the salary to <b>2850</b>, and show the annual salary.</p>`,

apex.item('P1_SAL').setValue('2850');</pre>`,
        `Read the salary back and <b>convert it</b>. getValue always returns a string:<pre>const sal = Number(apex.item('P1_SAL').getValue());   // 2850</pre>`,

        `Save → Run. P1_ANNUAL shows <b>34200</b>. If it's empty, press F12 and read the red error. A misspelled item name is the usual cause.`,

:P1_SAL    := 2850;
:P1_ANNUAL := :P1_SAL * 12;</pre>The difference: PL/SQL sets the values on the <b>server before the page is drawn</b>; JavaScript sets them in the <b>browser after</b>. The result looks the same, but only JavaScript can react later, without reloading the page.`
      ]},
    { id:'s1-q2', title:'Find the bug: 2850100',
      task:`<p>A colleague wrote this in <b>Execute when Page Loads</b>, and P1_ANNUAL shows <code>2850100</code> instead of <code>2950</code>. Fix it.</p><pre>var raise = $v('P1_SAL') + 100;
$s('P1_ANNUAL', raise);</pre>`,
      steps:[
        `<code>$v('P1_SAL')</code> returns the <b>string</b> <code>'2850'</code>, not a number.`,
        `<code>'2850' + 100</code> joins the text, like <code>'2850' || '100'</code> in PL/SQL, so you get <code>'2850100'</code>.`,
        `Convert first with <code>Number()</code>, your <code>TO_NUMBER</code>. Also change <code>var</code> to <code>const</code>, because the value never changes:<pre>const raise = Number($v('P1_SAL')) + 100;
$s('P1_ANNUAL', raise);   // 2950</pre>`,
        `Rule: <b>every</b> item value is a string. Wrap it in <code>Number()</code> before any maths.`,
        `<b>Why PL/SQL never had this bug:</b><pre>:P1_ANNUAL := :P1_SAL + 100;            -- Oracle converts '2850' to 2850 for you: 2950
:P1_ANNUAL := TO_NUMBER(:P1_SAL) + 100; -- the explicit, safer version</pre>Oracle does an <b>implicit conversion</b> to a number, and string joining has its own operator, <code>||</code>. JavaScript uses the same <code>+</code> for both, and if either side is a string, it joins.`
      ]},
    { id:'s1-q3', title:'Validate salary with try/catch',
      task:`<p>Create a Dynamic Action: <b>Change</b> on <code>P1_SAL</code> → <b>Execute JavaScript Code</b>. If the salary is empty, not a number, or outside 800–5000, show an <b>inline + page error</b>. Otherwise set P1_ANNUAL and show "Salary OK". Test with <code>abc</code>, <code>9000</code> and <code>1250</code>.</p>`,
      steps:[
        `Right-click <b>P1_SAL</b> → <b>Create Dynamic Action</b>. Event: <b>Change</b>. Click the <b>Show</b> action and change it to <b>Execute JavaScript Code</b>.`,
        `Start with <code>apex.message.clearErrors();</code> so old messages disappear.`,
        `Inside <code>try { }</code>, read and convert, then <code>throw</code> for each bad case. This is like <code>RAISE_APPLICATION_ERROR</code>:<pre>const text = $v('P1_SAL'), sal = Number(text);
if (!text) throw new Error('Salary is required');
if (Number.isNaN(sal)) throw new Error(\`'\${text}' is not a number\`);
if (sal < 800 || sal > 5000) throw new Error('Salary must be between 800 and 5000');</pre>`,
        `Success path, still inside <code>try</code>. The <code>true</code> stops the change event firing again:<pre>apex.item('P1_ANNUAL').setValue(sal * 12, null, true);
apex.message.showPageSuccess('Salary OK');</pre>`,
        `In <code>catch (err)</code>, show the message the APEX way:<pre>apex.message.showErrors([{ type:'error', location:['page','inline'],

        `Test: <code>abc</code> → "'abc' is not a number"; <code>9000</code> → range error under the field and at the top; <code>1250</code> → green "Salary OK" and annual 15000.`,
        `<b>The PL/SQL twin, which you must keep too:</b> P1_SAL → Validations → Create. Type <b>Function Body (returning Error Text)</b>:<pre>DECLARE
  l_sal NUMBER;
BEGIN
  IF :P1_SAL IS NULL THEN
    RETURN 'Salary is required';
  END IF;
  l_sal := TO_NUMBER(:P1_SAL);              -- may raise VALUE_ERROR
  IF l_sal NOT BETWEEN 800 AND 5000 THEN
    RETURN 'Salary must be between 800 and 5000';
  END IF;
  RETURN NULL;                              -- NULL = no error
EXCEPTION
  WHEN VALUE_ERROR THEN
    RETURN :P1_SAL || ' is not a number';   -- the catch block
END;</pre>Read them side by side: <code>throw</code> = <code>RETURN 'message'</code> or <code>RAISE</code>, <code>catch</code> = <code>EXCEPTION WHEN …</code>, <code>Number.isNaN</code> = <code>VALUE_ERROR</code>. JavaScript shows the error instantly; PL/SQL shows it after Submit and can't be bypassed.`

    { id:'s1-q4', title:'jQuery: highlight a region',
      task:`<p>Give a region the <b>Static ID</b> <code>emp_region</code>. Add a Switch item <code>P1_HIGHLIGHT</code>. When it's switched on, add the CSS class <code>u-color-9</code> to the region; when it's off, remove it. Then answer: why jQuery here and not <code>apex.item</code>?</p>`,

        `jQuery's <code>toggleClass(name, true/false)</code> adds or removes the class in one line:<pre>$('#emp_region').toggleClass('u-color-9', on);</pre>`,
        `Why jQuery? A region is <b>not a page item</b>, so <code>apex.item</code> doesn't apply. Adding a CSS class to plain HTML is exactly the job jQuery is for.`,

        `<b>The PL/SQL way:</b> Region → Appearance → <b>CSS Classes</b> = <code>&amp;P1_REGION_CLASS.</code> (a substitution string), plus a Before Header Computation:<pre>:P1_REGION_CLASS := CASE :P1_HIGHLIGHT WHEN 'Y' THEN 'u-color-9' END;</pre>That works, but only when the page is <b>reloaded</b>. The jQuery version changes it the moment you flip the switch. Use the server way when the class depends on data that doesn't change while the user is on the page.`

  ,s2: [

    { id:'s2-q2', title:'Why is PL/SQL seeing the old department?',

/* ===================== STATE + SAVING ===================== */
const LS = 'apexdrills.v1';
const state = { answers:{}, days:{}, quiz:{} };
let db = null, uid = null;
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
(function(){ const l = lsRead(); if(l){ Object.assign(state.answers, l.answers||{}); Object.assign(state.days, l.days||{}); Object.assign(state.quiz, l.quiz||{}); } })();

function setSync(t){ const m = document.getElementById('syncmsg'); (m || document.getElementById('sync')).textContent = t; }
const timers = {};
function saveAnswer(id, text){
  state.answers[id] = { text, at: Date.now() };
  lsWrite(); updateStats();
  if(!db || !uid){ remote.push('answers', id, state.answers[id]); return; }
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try{ await db.doc(`data/users/${uid}/answers/${id}`).set(state.answers[id]); setSync('All work saved to your account'); }
    catch(e){ setSync('Saved on this device; account save failed, will retry on next edit'); }
  }, 900);
}
async function saveDoc(path, data){
  lsWrite(); updateStats();
  if(!db || !uid){ const [kind, id] = path.split('/'); remote.push(kind, id, data); return; }
  try{ await db.doc(`data/users/${uid}/${path}`).set(data); setSync('All work saved to your account'); }catch(e){ setSync('Saved on this device only'); }
}

async function connect(){
  if(!window.claude?.use){ remote.start(); return; }
  const timeout = setTimeout(()=>setSync('Saving on this device only'), 10000);
  try{
    const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!d || !user){ clearTimeout(timeout); remote.start(); return; }
    uid = await user.id();
    if(!uid){ clearTimeout(timeout); setSync('Saving on this device only'); return; }
    db = d;
    const merge = (col, target, wrap) => new Promise(res => {
      let first = true;
      db.collection(`data/users/${uid}/${col}`).onSnapshot(snap => {
        clearTimeout(timeout);
        snap.docs.forEach(doc => {
          const v = doc.data(); const cur = target[doc.id];
          if(!cur || (v.at||0) >= (cur.at||0)) target[doc.id] = v;
        });
        if(first){
          first = false;
          // push up anything only this device has (never lose work)
          Object.keys(target).forEach(k => { if(!snap.docs.some(x=>x.id===k)) db.doc(`data/users/${uid}/${col}/${k}`).set(target[k]).catch(()=>{}); });
          res();
        }
        lsWrite(); updateStats(); refreshOpenView();
      }, () => { clearTimeout(timeout); setSync('Saving on this device only'); res(); });
    });
    await Promise.all([merge('answers', state.answers), merge('days', state.days), merge('quiz', state.quiz)]);
    setSync('All work saved to your account');
  }catch(e){ clearTimeout(timeout); setSync('Saving on this device only'); }
}

/* ===================== SYNC FOR THE GITHUB COPY =====================
   On github.io there is no Claude account, so answers go to the separate
   apex-api Worker and its own "apex" database (passphrase APEX_KEY). Newer copy always wins on
   both sides; the server also keeps every version. Unsent saves wait in
   this browser and retry, so nothing typed offline is lost. */
const remote = (function(){
  const API = 'https://apex-api.anandm401-amazon.workers.dev';
  const QK = 'apexdrills.queue', KEY = 'apex:key';
  let on = false, timer = null, busy = false;
  const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const put = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
  let queue = (() => { try{ return JSON.parse(get(QK)) || {}; }catch(e){ return {}; } })();
  const saveQ = () => put(QK, JSON.stringify(queue));
  const key = () => get(KEY) || '';
  async function call(path, body, keepalive){
    const r = await fetch(API + path, { method:'POST', keepalive: !!keepalive, headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ key: key(), ...body }) });
    const j = await r.json().catch(() => ({}));
    if(r.status === 401) throw Object.assign(new Error('wrong key'), { code: 401 });
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  function push(kind, id, data){
    queue[kind + '/' + id] = { kind, id, data }; saveQ();
    if(!on) return;
    clearTimeout(timer); timer = setTimeout(flush, 1000);
  }
  async function flush(){
    if(!on || busy) return;
    const docs = Object.values(queue).slice(0, 300);
    if(!docs.length){ synced(); return; }
    busy = true;
    try{
      await call('/save', { docs });
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
      synced();
      if(Object.keys(queue).length) setTimeout(flush, 200);
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }finally{ busy = false; }
  }
  async function pull(){
    if(!on) return;
    try{
      const j = await call('/read', {});
      const merge = (src, target, kind) => {
        Object.entries(src || {}).forEach(([id, v]) => {
          const cur = target[id];
          if(!cur || (v.at||0) > (cur.at||0)) target[id] = v;
          else if((cur.at||0) > (v.at||0)) queue[kind + '/' + id] = { kind, id, data: cur };
        });
        Object.keys(target).forEach(id => { if(!(src||{})[id]) queue[kind + '/' + id] = { kind, id, data: target[id] }; });
      };
      merge(j.answers, state.answers, 'answers'); merge(j.days, state.days, 'days'); merge(j.quiz, state.quiz, 'quiz');
      saveQ(); lsWrite(); updateStats(); refreshOpenView();
      await flush();
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }
  }
  const pending = () => Object.keys(queue).length;
  function synced(){
    put('apexdrills.lastSync', String(Date.now()));
    setSync('Synced ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }));
  }
  /* Last chance when the tab is hidden, closed or the browser quits:
     one keepalive request that outlives the page. */
  function flushOnLeave(){
    if(!on || !pending()) return;
    const docs = Object.values(queue).slice(0, 300);
    call('/save', { docs }, true).then(() => {
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
    }).catch(() => {});
  }
  /* The bar stays on screen: status, Sync now, change passphrase. */
  function bar(){
    const box = document.getElementById('sync');
    box.innerHTML = `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="syncmsg"></span>
      <button class="btn primary" id="syncnow" type="button">Sync now</button>
      <button class="btn" id="synckey" type="button">Change passphrase</button></span>`;
    box.querySelector('#syncnow').onclick = () => { if(!key()){ askKey('Enter your APEX passphrase:'); return; } on = true; setSync('Syncing…'); pull(); };
    box.querySelector('#synckey').onclick = () => askKey('Enter your APEX passphrase:');
  }
  function askKey(msg){
    const box = document.getElementById('sync');
    box.innerHTML = `<form id="keyform" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <label for="keyin">${msg}</label>
      <input id="keyin" type="password" autocomplete="current-password" style="font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:150px">
      <button class="btn primary" type="submit">Sync</button></form>`;
    box.querySelector('#keyform').onsubmit = e => {
      e.preventDefault();
      const v = box.querySelector('#keyin').value.trim(); if(!v) return;
      put(KEY, v); begin();
    };
  }
  let wired = false;
  function begin(){
    on = true; bar(); setSync('Syncing…'); pull();
    if(wired) return; wired = true;
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'hidden') flushOnLeave(); else pull();
    });
    window.addEventListener('pagehide', flushOnLeave);
    window.addEventListener('online', flush);
    setInterval(() => { if(pending()) flush(); }, 30000);
    /* While the page is open and on screen, fetch other devices' work every minute. */
    setInterval(() => { if(document.visibilityState === 'visible' && !busy) pull(); }, 60000);
  }
  function start(){
    if(!key()){ askKey('To sync across devices, enter your APEX passphrase:'); return; }
    begin();
  }
  return { push, start };
})();

  const got = id => (TASKS[id] || []).filter(t => state.quiz[t.id]?.pick === 1).length;
  v.innerHTML = `<header class="head">
      <div class="label">1-hour sessions · built on your PL/SQL</div>
      <h1>APEX Expert Drills</h1>
      <p class="sub">Each session is 1 hour: the concept with PL/SQL next to JavaScript, code you can paste straight into APEX, notes to remember, traps, practice with step-by-step answers, and a one-page summary to read the next day.</p>
    </header>
    <div class="sessions">${SESSIONS.map(s => `<button class="scard ${s.ready ? '' : 'soon'}" ${s.ready ? `data-s="${s.id}"` : 'aria-disabled="true"'}>
      <span class="num">${s.n}</span><span><span class="t">${esc(s.title)}</span><span class="s" style="display:block">${esc(s.sub)}</span>
      <span class="s" style="display:block;margin-top:4px;font-weight:600">${s.ready ? `${got(s.id)} / ${(TASKS[s.id]||[]).length} practice tasks done · <a href="#${s.id}-summary" onclick="event.stopPropagation()">summary</a>` : 'Coming next'}</span></span></button>`).join('')}</div>
    <footer>Practise in any APEX: your office workspace or ANAND_DEV on oracleapex.com. Your "I got it" marks and notes save in this browser.</footer>`;
  v.querySelectorAll('.scard[data-s]').forEach(b => b.onclick = () => { location.hash = b.dataset.s; });
  window.scrollTo(0, 0);
}

/* ======================= SESSION ======================= */
function renderSession(id, anchor){
  const s = SESSIONS.find(x => x.id === id), tpl = document.getElementById(id);
  if(!s || !tpl){ renderHome(); return; }
  const v = document.getElementById('view');
  v.innerHTML = `<button class="back" id="back">← All sessions</button>
    <div class="label">Session ${s.n} · about 1 hour</div><h1>${esc(s.title)}</h1>`;
  v.appendChild(tpl.content.cloneNode(true));
  document.getElementById('back').onclick = () => { location.hash = ''; };
  const tasksEl = v.querySelector('#' + id + '-tasks');
  (TASKS[id] || []).forEach((t, i) => tasksEl.appendChild(buildTask(t, i)));
  v.querySelector('#print')?.addEventListener('click', () => { window.print(); });
  if(anchor){ const a = document.getElementById(anchor); if(a){ a.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}

function buildTask(t, i){
  const el = document.createElement('div'); el.className = 'task';
  const st = () => state.quiz[t.id]?.pick;
  el.innerHTML = `<div class="task-head"><span class="qn">Task ${i+1}</span><h3 style="margin:0">${t.title}</h3><span class="status"></span></div>
    <div class="body" style="margin-top:8px">${t.task}</div>
    <textarea class="mine" id="mine-${t.id}" placeholder="Optional: paste your code or notes here (saved)"></textarea>
    <div class="ask"><button class="btn good" data-a="1">✓ I got it</button><button class="btn bad" data-a="0">✗ I didn't get it</button><button class="btn" data-a="show">Hide answer</button></div>
    <div class="answer"><div class="label">Step by step</div><ol class="stepx">${t.steps.map(x => `<li><div>${x}</div></li>`).join('')}</ol></div>`;
  const status = el.querySelector('.status'), ans = el.querySelector('.answer'), ta = el.querySelector('textarea');
  const paint = () => { const p = st();
    status.textContent = p === 1 ? 'Got it ✓' : p === 0 ? 'Review the steps' : '';
    status.className = 'status ' + (p === 1 ? 'ok' : p === 0 ? 'no' : '');
    if(p === 0) ans.hidden = false; };
  ta.value = state.answers[t.id]?.text || '';
  ta.addEventListener('input', () => saveAnswer(t.id, ta.value));
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if(b.dataset.a === 'show'){ ans.hidden = !ans.hidden; b.textContent = ans.hidden ? 'Show answer' : 'Hide answer'; return; }
    state.quiz[t.id] = { pick: Number(b.dataset.a), at: Date.now() };
    saveDoc('quiz/' + t.id, state.quiz[t.id]);
    paint();
  });
  paint();
  return el;
}

function fitTextarea(){}
function refreshOpenView(){ if(!location.hash) renderHome(); }
function route(){
  const h = location.hash.replace('#', '');
  if(!h){ renderHome(); return; }
  const sid = h.split('-')[0];
  if(SESSIONS.some(s => s.id === sid && s.ready)){
    const inView = h.includes('-') && document.querySelector('#view #' + h);
    if(inView){ inView.scrollIntoView(); return; }
    renderSession(sid, h.includes('-') ? h : null);
  } else renderHome();
}
window.addEventListener('hashchange', route);
route(); connect();
