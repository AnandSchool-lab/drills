<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX Expert Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky workspace bar, topic list, then one topic at a time: PL/SQL vs JS, APEX steps with real screenshots, practice. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --sunk:#eef0f6; --fg:#1b2030; --muted:#5d6478; --line:#dde1ec;
  --accent:#3550c8; --accent-ink:#ffffff; --accent-soft:#e6eaff;
  --plsql:#b4441c; --plsql-soft:#fbe9e1; --js:#9a6a12; --js-soft:#fbf1df; --apex:#2f855a; --apex-soft:#e2f3ea; --new:#805ad5; --new-soft:#efe9fb;
  --good:#2f855a; --bad:#c53030; --code-bg:#161a26; --code-fg:#e4e7f2; --bar:#1d2233; --bar-fg:#e9ecf6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10131c; --surface:#181c28; --sunk:#202536; --fg:#e6e9f3; --muted:#9aa2b8; --line:#2c3347;
  --accent:#8299ff; --accent-ink:#0f1320; --accent-soft:#232c52;
  --plsql:#f0a080; --plsql-soft:#3a2219; --js:#e7b45a; --js-soft:#352a17; --apex:#6fcf9a; --apex-soft:#17321f; --new:#b69cf2; --new-soft:#2a2242;
  --good:#6fcf9a; --bad:#f08080; --code-bg:#0b0d14; --bar:#0b0e16; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
img{max-width:100%}
[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(26px,4vw,36px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* workspace bar - always on top */
.wsbar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-fg);font-size:13px}
.wsbar .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:8px}
.wsbar b{font-weight:600}
.wsbar a{color:#aebcff;text-decoration:none;font-weight:600}
.wsbar a:hover{text-decoration:underline}
.wsbar .sep{opacity:.35}
.wsbar .sync{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wsbar .btn{background:transparent;color:var(--bar-fg);border-color:#3a4260}
.wsbar .btn.primary{background:#5b74e6;border-color:#5b74e6;color:#fff}
.wsbar input{font:inherit;padding:3px 6px;border:1px solid #3a4260;border-radius:5px;background:#252b3f;color:var(--bar-fg);width:140px}

/* header */
.head{padding-block:26px 8px}
.head .sub{max-width:68ch;color:var(--muted);margin-top:6px}
.stats{display:flex;gap:22px;margin-top:14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}

/* topic list */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:18px 0 8px}
.tcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg)}
.tcard:hover{border-color:var(--accent)}
.tcard .num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.tcard.done .num{background:var(--apex-soft);color:var(--good)}
.tcard .t{font-weight:600;font-size:14px;line-height:1.3}
.tcard .s{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.week-title{display:flex;gap:10px;align-items:baseline;margin-top:22px}
.upcoming{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.upcoming div{background:var(--sunk);border-radius:8px;padding:9px 11px;font-size:13px}
.upcoming b{display:block;font-size:12px;color:var(--muted);font-weight:600}

/* topic page */
.back{background:none;border:0;color:var(--accent);padding:0;font-weight:600;margin:18px 0 10px}
.topic-head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.oneline{font-size:17px;max-width:70ch;margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--apex-soft);color:var(--good);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
section.part{margin-top:26px}
section.part>h2{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
section.part>h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.prose{max-width:74ch}
.prose p+p{margin-top:8px}

/* compare table */
.compare{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.compare>div{min-width:0}
.compare .h{padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.compare .h.pl{background:var(--plsql-soft);color:var(--plsql)}
.compare .h.js{background:var(--js-soft);color:var(--js)}
.compare pre{border-radius:0;margin:0;height:100%}
.compare .row{display:contents}
.compare .note{grid-column:1/-1;padding:8px 12px;font-size:13.5px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:720px){.compare{grid-template-columns:1fr}}
pre,textarea,code{font-variant-ligatures:none}
pre{margin:0;font:12.8px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:12px 14px;overflow-x:auto;white-space:pre;border-radius:8px}
.c{color:#8a93ad}

/* steps + shots */
ol.steps{margin:0;padding-left:22px;display:grid;gap:7px;max-width:78ch}
ol.steps li::marker{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.path{font-family:var(--f-mono);font-size:12.5px;background:var(--apex-soft);color:var(--apex);padding:1px 6px;border-radius:4px;white-space:nowrap}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
figure.shot{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure.shot img{display:block;width:100%;cursor:zoom-in;border-bottom:1px solid var(--line)}
figure.shot figcaption{padding:8px 12px;font-size:13px}
figure.shot figcaption b{display:block}
.console{background:#0f1117;color:#d6dae6;border-radius:8px;font:12.5px/1.6 var(--f-mono);padding:10px 14px;max-width:760px}
.console div::before{content:"› ";color:#6e7896}
.console .warn{color:#f3c96b}
.console .warn::before{content:"⚠ ";color:#f3c96b}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;max-width:78ch;font-size:14px}
.callout.warn{border-color:var(--js);background:var(--js-soft)}
.callout.new{border-color:var(--new);background:var(--new-soft)}
.callout.new b:first-child{color:var(--new)}
.callout + .callout{margin-top:10px}

/* lightbox */
dialog.lb{border:0;padding:0;max-width:96vw;max-height:94vh;background:transparent}
dialog.lb::backdrop{background:rgba(10,12,20,.82)}
dialog.lb img{max-width:96vw;max-height:88vh;display:block;border-radius:6px}
dialog.lb p{color:#fff;font-size:13px;margin-top:6px}

/* runner + exercises (shared engine) */
.tbody{display:grid;gap:14px}
.runner{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.runner .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--sunk);font-size:12px;color:var(--muted)}
.runner textarea{display:block;width:100%;border:0;resize:vertical;min-height:110px;font:13px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-fg);padding:12px 14px;tab-size:2}
.runner textarea.text{background:var(--surface);color:var(--fg);font-family:var(--f-body);font-size:14px;min-height:90px}
.out{font:12.5px/1.5 var(--f-mono);padding:10px 14px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word;min-height:20px}
.out .err{color:var(--bad)} .out .dim{color:var(--muted)}
.fakepage{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.fakepage label{display:grid;gap:2px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.fakepage input{font:13px var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:130px}
.fakepage input.hidden-item{opacity:.35}
.banner{margin:8px 14px 0;padding:6px 10px;border-radius:6px;font-size:13px}
.banner.ok{background:var(--apex-soft);color:var(--good)} .banner.bad{background:#c5303022;color:var(--bad)}
.ex{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.ex-head{display:flex;gap:10px;align-items:baseline}
.ex-tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.ex-tag.t2{background:var(--js-soft);color:var(--js)} .ex-tag.t3{background:var(--new-soft);color:var(--new)}
.ex .q{max-width:74ch}
.ex-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--muted);margin-left:auto}
.reveal{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.reveal pre{margin-top:6px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.qz .opts{display:grid;gap:6px;margin-top:8px}
.qz button.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 10px;font-size:14px}
.qz button.opt.right{border-color:var(--good);background:var(--apex-soft)}
.qz button.opt.wrong{border-color:var(--bad);background:#c5303018}
.qz .why{font-size:13.5px;color:var(--muted);margin-top:8px}
.quiz{display:grid;gap:10px}
footer{margin:40px 0 30px;font-size:13px;color:var(--muted)}
</style>
</head>

<template id="topic-1">
  <section class="part">
    <h2><span class="n">01</span>PL/SQL vs JavaScript</h2>
    <div class="compare">
      <div class="h pl">PL/SQL (what you know)</div><div class="h js">JavaScript (the same idea)</div>
<pre><span class="c">DECLARE</span>
  v_ename   VARCHAR2(30) := 'KING';
  v_sal     NUMBER       := 5000;
  c_bonus   CONSTANT NUMBER := 0.10;
<span class="c">BEGIN</span>
  v_sal := v_sal + 100;
  DBMS_OUTPUT.PUT_LINE(v_ename);
<span class="c">END;</span></pre>
<pre>let   ename = 'KING';      <span class="c">// no type needed</span>
let   sal   = 5000;
const BONUS = 0.10;        <span class="c">// CONSTANT</span>

sal = sal + 100;           <span class="c">// let can change</span>
console.log(ename);        <span class="c">// DBMS_OUTPUT</span>
<span class="c">// BONUS = 0.2;  -> TypeError: Assignment</span>
<span class="c">//                  to constant variable</span></pre>
      <div class="note"><b>Rule of thumb:</b> use <code>const</code> by default, <code>let</code> when the value changes, and never <code>var</code> (old style, leaks out of blocks). JavaScript has no <code>DECLARE</code> section: you declare a variable where you first need it.</div>
    </div>
    <div class="callout warn" style="margin-top:12px"><b>Trap:</b> <code>const</code> stops you reassigning the name, not changing what's inside. <code>const emp = {sal: 100}; emp.sal = 200;</code> works fine.</div>
  </section>

  <section class="part">
    <h2><span class="n">02</span>Where JavaScript lives in APEX</h2>
    <div class="prose"><p>Your page 1 uses the two most common places. Both are in Page Designer when you click the <b>page</b> (top node of the tree), in the <b>JavaScript</b> group of the Property Editor:</p></div>
    <ol class="steps" style="margin-top:10px">
      <li><b>Function and Global Variable Declaration</b>: functions and constants used on this page. Think of it as the package spec plus body for one page.</li>
      <li><b>Execute when Page Loads</b>: runs once after the page has rendered. Think of it as the <code>BEGIN … END</code> that runs on open.</li>
      <li><b>Dynamic Action → Execute JavaScript Code</b>: runs on an event, like Change or Click (topic 3).</li>
      <li><b>Static Application File</b>: a real <code>.js</code> file, cached and shared by all pages (topic 7).</li>
      <li><b>Browser console (F12)</b>: try code live on a running page. Nothing is saved.</li>
    </ol>
    <div class="shots">
      <figure class="shot"><img src="img/t1-page-js-properties.jpg" alt="Page Designer, page 1 selected, JavaScript properties"><figcaption><b>Page Designer → page 1 → JavaScript</b>Left: tree with the items P1_ENAME, P1_SAL, P1_RESULT. Right: the two code boxes.</figcaption></figure>
      <figure class="shot"><img src="img/t1-page-load-code.jpg" alt="Code editor showing Execute when Page Loads"><figcaption><b>The code editor (click the ↗ icon next to the box)</b>Each JS line has its PL/SQL twin as a comment above it.</figcaption></figure>
      <figure class="shot"><img src="img/t1-running.jpg" alt="Page 1 running"><figcaption><b>The page running</b>The items were filled from JavaScript, so no PL/SQL ran.</figcaption></figure>
    </div>
    <h3 style="margin-top:16px">What the console shows (F12 → Console)</h3>
    <div class="console" style="margin-top:6px"><div>KING earns 60000 a year, bonus 500</div></div>
  </section>

  <section class="part">
    <h2><span class="n">03</span>Do it yourself in JS Lab</h2>
    <ol class="steps">
      <li>Click <b>Sign in to APEX</b> in the top bar → <span class="path">App Builder → JS Lab → 1. Variables</span>.</li>
      <li>Click the page node, find <b>Execute when Page Loads</b>, and change <code>'KING'</code> to <code>'BLAKE'</code> and <code>5000</code> to <code>2850</code>.</li>
      <li>Click <b>Save</b>, then run the page and check the Result.</li>
      <li>Press <b>F12</b> (Mac: ⌥⌘I) → Console. Type <code>annualPay(2850)</code> and press Enter. The function is global, so the console can call it.</li>
    </ol>
  </section>

  <section class="part">
    <h2><span class="n">04</span>Practice</h2>
    <div class="tbody">
      <div class="ex" data-id="d1-t2-e1" data-kind="js">
        <p class="q">Rewrite this old code using <code>const</code>/<code>let</code> and a template literal:<br><code>var n = 'KING'; var d = 10; var msg = 'Employee ' + n + ' works in dept ' + d + '.';</code></p>
        <pre class="start">// rewrite here
</pre>
        <div class="hint">Nothing gets reassigned, so all three can be <code>const</code>. A template literal uses backticks and <code>${…}</code>.</div>
        <pre class="sol">const n = 'KING';
const d = 10;
const msg = `Employee ${n} works in dept ${d}.`;
console.log(msg);</pre>
      </div>
      <div class="ex" data-id="d1-t1-e1" data-kind="js" data-page="P1_FIRST=Asha;P1_LAST=Rao">
        <p class="q">New scenario: write a function <code>fullName()</code> that reads <code>P1_FIRST</code> and <code>P1_LAST</code> and returns <code>"Rao, Asha"</code>. Log it.</p>
        <pre class="start">function fullName() {
  // your code
}
console.log(fullName());</pre>
        <div class="hint"><code>apex.item('P1_FIRST').getValue()</code> is <code>:P1_FIRST</code> in PL/SQL.</div>
        <pre class="sol">function fullName() {
  return `${apex.item('P1_LAST').getValue()}, ${apex.item('P1_FIRST').getValue()}`;
}
console.log(fullName());</pre>
      </div>
      <div class="ex" data-id="d1-t2-e3" data-kind="js">
        <p class="q">Stretch: loop over <code>['ACCOUNTING','RESEARCH','SALES']</code> and build one HTML <code>&lt;ul&gt;</code> string, with <code>let</code> only where the value changes. (PL/SQL: a <code>FOR</code> loop appending with <code>||</code>.)</p>
        <pre class="start">const depts = ['ACCOUNTING', 'RESEARCH', 'SALES'];
</pre>
        <div class="hint"><code>for (const d of depts) { … }</code> is like <code>FOR r IN (…) LOOP</code>.</div>
        <pre class="sol">const depts = ['ACCOUNTING', 'RESEARCH', 'SALES'];
let html = '&lt;ul&gt;';
for (const d of depts) {
  html += `&lt;li&gt;${d}&lt;/li&gt;`;
}
html += '&lt;/ul&gt;';
console.log(html);</pre>
      </div>
    </div>
  </section>
  <section class="part"><h2><span class="n">05</span>Quick check</h2><div class="quiz" data-quiz="t1"></div></section>
</template>

<template id="topic-2">
  <section class="part">
    <h2><span class="n">01</span>PL/SQL vs JavaScript</h2>
    <div class="compare">
      <div class="h pl">PL/SQL</div><div class="h js">JavaScript</div>
<pre>UPPER(v_name)
LENGTH(v_name)
SUBSTR(v_name, 1, 3)    <span class="c">-- starts at 1</span>
TRIM('  KING ')
LPAD('SMITH', 8, '*')
INSTR('KING','IN') &gt; 0
APEX_STRING.SPLIT('A,B,C', ',')
'Salary: ' || v_sal
TO_NUMBER('3000') + 100
NVL(v_comm, 0)</pre>
<pre>name.toUpperCase()
name.length              <span class="c">// no ()</span>
name.substring(0, 3)     <span class="c">// starts at 0!</span>
'  KING '.trim()
'SMITH'.padStart(8, '*')
'KING'.includes('IN')
'A,B,C'.split(',')
`Salary: ${sal}`         <span class="c">// or 'Salary: ' + sal</span>
Number('3000') + 100
comm ?? 0</pre>
      <div class="note"><b>The big trap:</b> every page item value is a <b>string</b>. <code>'3000' + 100</code> gives <code>'3000100'</code> because <code>+</code> joins strings. Always convert first: <code>Number($v('P2_SAL')) + 100</code>.</div>
    </div>
  </section>
  <section class="part">
    <h2><span class="n">02</span>In your JS Lab, page 2</h2>
    <div class="shots">
      <figure class="shot"><img src="img/t2-code.jpg" alt="Code editor page 2"><figcaption><b>Execute when Page Loads, page 2</b>Each line has the PL/SQL function it replaces in the comment.</figcaption></figure>
      <figure class="shot"><img src="img/t2-running.jpg" alt="Page 2 running"><figcaption><b>Running: the trap in action</b><code>'3000' + 100 = 3000100</code>, but <code>Number('3000') + 100 = 3100</code>.</figcaption></figure>
    </div>
    <h3 style="margin-top:16px">Console output (real, from your page)</h3>
    <div class="console" style="margin-top:6px"><div>SCOTT</div><div>5</div><div>sco</div><div>KING</div><div>***SMITH</div><div>['A', 'B', 'C']</div><div>true</div><div>Salary: 3000</div><div>Salary: 3000</div><div>3000100</div><div>3100</div><div>0</div></div>
  </section>
  <section class="part">
    <h2><span class="n">03</span>Do it yourself</h2>

/* ===================== STATE + SAVING ===================== */
const LS = 'apexdrills.v1';
const state = { answers:{}, days:{}, quiz:{} };
let db = null, uid = null;
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)) || null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
(function(){ const l = lsRead(); if(l){ Object.assign(state.answers, l.answers||{}); Object.assign(state.days, l.days||{}); Object.assign(state.quiz, l.quiz||{}); } })();

function setSync(t){ const m = document.getElementById('syncmsg'); (m || document.getElementById('sync')).textContent = t; }
const timers = {};
function saveAnswer(id, text){
  state.answers[id] = { text, at: Date.now() };
  lsWrite(); updateStats();
  if(!db || !uid){ remote.push('answers', id, state.answers[id]); return; }
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try{ await db.doc(`data/users/${uid}/answers/${id}`).set(state.answers[id]); setSync('All work saved to your account'); }
    catch(e){ setSync('Saved on this device; account save failed, will retry on next edit'); }
  }, 900);
}
async function saveDoc(path, data){
  lsWrite(); updateStats();
  if(!db || !uid){ const [kind, id] = path.split('/'); remote.push(kind, id, data); return; }
  try{ await db.doc(`data/users/${uid}/${path}`).set(data); setSync('All work saved to your account'); }catch(e){ setSync('Saved on this device only'); }
}

async function connect(){
  if(!window.claude?.use){ remote.start(); return; }
  const timeout = setTimeout(()=>setSync('Saving on this device only'), 10000);
  try{
    const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!d || !user){ clearTimeout(timeout); remote.start(); return; }
    uid = await user.id();
    if(!uid){ clearTimeout(timeout); setSync('Saving on this device only'); return; }
    db = d;
    const merge = (col, target, wrap) => new Promise(res => {
      let first = true;
      db.collection(`data/users/${uid}/${col}`).onSnapshot(snap => {
        clearTimeout(timeout);
        snap.docs.forEach(doc => {
          const v = doc.data(); const cur = target[doc.id];
          if(!cur || (v.at||0) >= (cur.at||0)) target[doc.id] = v;
        });
        if(first){
          first = false;
          // push up anything only this device has (never lose work)
          Object.keys(target).forEach(k => { if(!snap.docs.some(x=>x.id===k)) db.doc(`data/users/${uid}/${col}/${k}`).set(target[k]).catch(()=>{}); });
          res();
        }
        lsWrite(); updateStats(); refreshOpenView();
      }, () => { clearTimeout(timeout); setSync('Saving on this device only'); res(); });
    });
    await Promise.all([merge('answers', state.answers), merge('days', state.days), merge('quiz', state.quiz)]);
    setSync('All work saved to your account');
  }catch(e){ clearTimeout(timeout); setSync('Saving on this device only'); }
}

/* ===================== SYNC FOR THE GITHUB COPY =====================
   On github.io there is no Claude account, so answers go to the separate
   apex-api Worker and its own "apex" database (passphrase APEX_KEY). Newer copy always wins on
   both sides; the server also keeps every version. Unsent saves wait in
   this browser and retry, so nothing typed offline is lost. */
const remote = (function(){
  const API = 'https://apex-api.anandm401-amazon.workers.dev';
  const QK = 'apexdrills.queue', KEY = 'apex:key';
  let on = false, timer = null, busy = false;
  const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const put = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
  let queue = (() => { try{ return JSON.parse(get(QK)) || {}; }catch(e){ return {}; } })();
  const saveQ = () => put(QK, JSON.stringify(queue));
  const key = () => get(KEY) || '';
  async function call(path, body, keepalive){
    const r = await fetch(API + path, { method:'POST', keepalive: !!keepalive, headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ key: key(), ...body }) });
    const j = await r.json().catch(() => ({}));
    if(r.status === 401) throw Object.assign(new Error('wrong key'), { code: 401 });
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  function push(kind, id, data){
    queue[kind + '/' + id] = { kind, id, data }; saveQ();
    if(!on) return;
    clearTimeout(timer); timer = setTimeout(flush, 1000);
  }
  async function flush(){
    if(!on || busy) return;
    const docs = Object.values(queue).slice(0, 300);
    if(!docs.length){ synced(); return; }
    busy = true;
    try{
      await call('/save', { docs });
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
      synced();
      if(Object.keys(queue).length) setTimeout(flush, 200);
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }finally{ busy = false; }
  }
  async function pull(){
    if(!on) return;
    try{
      const j = await call('/read', {});
      const merge = (src, target, kind) => {
        Object.entries(src || {}).forEach(([id, v]) => {
          const cur = target[id];
          if(!cur || (v.at||0) > (cur.at||0)) target[id] = v;
          else if((cur.at||0) > (v.at||0)) queue[kind + '/' + id] = { kind, id, data: cur };
        });
        Object.keys(target).forEach(id => { if(!(src||{})[id]) queue[kind + '/' + id] = { kind, id, data: target[id] }; });
      };
      merge(j.answers, state.answers, 'answers'); merge(j.days, state.days, 'days'); merge(j.quiz, state.quiz, 'quiz');
      saveQ(); lsWrite(); updateStats(); refreshOpenView();
      await flush();
    }catch(e){
      if(e.code === 401){ on = false; askKey('That passphrase was not accepted. Try again:'); }
      else setSync('Saved in this browser; will sync when the connection is back');
    }
  }
  const pending = () => Object.keys(queue).length;
  function synced(){
    put('apexdrills.lastSync', String(Date.now()));
    setSync('Synced ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }));
  }
  /* Last chance when the tab is hidden, closed or the browser quits:
     one keepalive request that outlives the page. */
  function flushOnLeave(){
    if(!on || !pending()) return;
    const docs = Object.values(queue).slice(0, 300);
    call('/save', { docs }, true).then(() => {
      docs.forEach(d => { const k = d.kind + '/' + d.id; if(queue[k] && queue[k].data === d.data) delete queue[k]; });
      saveQ();
    }).catch(() => {});
  }
  /* The bar stays on screen: status, Sync now, change passphrase. */
  function bar(){
    const box = document.getElementById('sync');
    box.innerHTML = `<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="syncmsg"></span>
      <button class="btn primary" id="syncnow" type="button">Sync now</button>
      <button class="btn" id="synckey" type="button">Change passphrase</button></span>`;
    box.querySelector('#syncnow').onclick = () => { if(!key()){ askKey('Enter your APEX passphrase:'); return; } on = true; setSync('Syncing…'); pull(); };
    box.querySelector('#synckey').onclick = () => askKey('Enter your APEX passphrase:');
  }
  function askKey(msg){
    const box = document.getElementById('sync');
    box.innerHTML = `<form id="keyform" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <label for="keyin">${msg}</label>
      <input id="keyin" type="password" autocomplete="current-password" style="font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);width:150px">
      <button class="btn primary" type="submit">Sync</button></form>`;
    box.querySelector('#keyform').onsubmit = e => {
      e.preventDefault();
      const v = box.querySelector('#keyin').value.trim(); if(!v) return;
      put(KEY, v); begin();
    };
  }
  let wired = false;
  function begin(){
    on = true; bar(); setSync('Syncing…'); pull();
    if(wired) return; wired = true;
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'hidden') flushOnLeave(); else pull();
    });
    window.addEventListener('pagehide', flushOnLeave);
    window.addEventListener('online', flush);
    setInterval(() => { if(pending()) flush(); }, 30000);
    /* While the page is open and on screen, fetch other devices' work every minute. */
    setInterval(() => { if(document.visibilityState === 'visible' && !busy) pull(); }, 60000);
  }
  function start(){
    if(!key()){ askKey('To sync across devices, enter your APEX passphrase:'); return; }
    begin();
  }
  return { push, start };
})();



/* ======================= HELPERS ======================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function updateStats(){
  const d = document.getElementById('st-done'), e = document.getElementById('st-ex');

}

/* ======================= TOPIC ======================= */
function renderTopic(id){
  const t = TOPICS.find(x => x.id === id);
  const tpl = t && document.getElementById(t.tpl || ('topic-' + t.n));
  if(!tpl){ location.hash = ''; return; }
  const v = document.getElementById('view');
  const done = state.days[t.id]?.done;
  const idx = TOPICS.indexOf(t), next = TOPICS[idx + 1];
  v.innerHTML = `<button class="back" id="back">← All topics</button>
    <div class="topic-head"><div><div class="label">${t.id === 'tnew' ? 'Overview' : 'Topic ' + t.n}</div><h1>${esc(t.title)}</h1><p class="oneline">${esc(t.line)}</p></div>
      <div class="actions"><a class="btn" href="${LAB}${t.page}" target="_blank" rel="noopener">Open in JS Lab ↗</a>
      <button class="btn ${done ? 'done' : 'primary'}" id="done">${done ? 'Done ✓' : 'Mark as done'}</button></div></div>`;
  v.appendChild(tpl.content.cloneNode(true));
  if(next){ const nb = document.createElement('div'); nb.style.margin = '30px 0'; nb.innerHTML = `<button class="btn primary" id="next">Next: ${esc(next.title)} →</button>`; v.appendChild(nb); nb.querySelector('#next').onclick = () => { location.hash = next.id; }; }
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('done').onclick = () => {
    state.days[t.id] = { done: !state.days[t.id]?.done, at: Date.now() };
    saveDoc('days/' + t.id, state.days[t.id]); renderTopic(id);
  };
  v.querySelectorAll('.ex').forEach(buildExercise);
  v.querySelectorAll('[data-quiz]').forEach(buildQuiz);
  v.querySelectorAll('figure.shot img').forEach(img => img.onclick = () => {
    const lb = document.getElementById('lb'); lb.querySelector('img').src = img.src;
    lb.querySelector('p').textContent = img.closest('figure').querySelector('b')?.textContent || '';
    try{ lb.showModal(); }catch(e){ lb.setAttribute('open', ''); }
  });
  window.scrollTo(0, 0);
}
document.getElementById('lb').addEventListener('click', e => e.currentTarget.close());

/* ===================== PLAY RUNTIME (fake APEX) ===================== */
function parsePage(spec){ const o = {}; (spec||'').split(';').filter(Boolean).forEach(p => { const i = p.indexOf('='); o[p.slice(0,i)] = p.slice(i+1); }); return o; }
function buildRuntime(container, pageSpec, thisSpec){
  const items = parsePage(pageSpec);
  const out = container.querySelector('.out'), page = container.querySelector('.fakepage'), banners = container.querySelector('.banners');
  const inputs = {};
  if(page){
    page.innerHTML = '';
    Object.keys(items).forEach(k => {
      const lab = document.createElement('label'); lab.textContent = k;
      const inp = document.createElement('input'); inp.value = items[k]; inp.id = container.dataset.uid + '-' + k;
      lab.appendChild(inp); page.appendChild(lab); inputs[k] = inp;
    });
  }
  const val = k => inputs[k] ? inputs[k].value : (items[k] ?? '');
  const log = (cls, args) => { const line = document.createElement('div'); if(cls) line.className = cls;
    line.textContent = args.map(a => a === undefined ? 'undefined' : typeof a === 'string' ? a : (() => { try { return JSON.stringify(a, null, Array.isArray(a)||typeof a!=='object'?0:1); } catch(e){ return String(a); } })()).join(' ');
    out.appendChild(line); };
  const banner = (cls, t) => { const b = document.createElement('div'); b.className = 'banner ' + cls; b.textContent = t; banners.appendChild(b); };
  const item = k => ({
    getValue: () => val(k),
    setValue: (v, disp, suppress) => { if(inputs[k]) inputs[k].value = v ?? ''; else items[k] = v ?? ''; log('dim', [`↳ ${k} = "${v ?? ''}"${suppress?' (no change event)':''}`]); },
    isEmpty: () => String(val(k)).trim() === '',
    show: () => { inputs[k]?.classList.remove('hidden-item'); log('dim', [`↳ ${k} shown`]); },
    hide: () => { inputs[k]?.classList.add('hidden-item'); log('dim', [`↳ ${k} hidden`]); },
    enable: () => { if(inputs[k]) inputs[k].disabled = false; log('dim', [`↳ ${k} enabled`]); },
    disable: () => { if(inputs[k]) inputs[k].disabled = true; log('dim', [`↳ ${k} disabled`]); },
    setFocus: () => inputs[k]?.focus()
  });
  const apex = {
    item,
    message: {
      showPageSuccess: t => banner('ok', '✓ ' + t),
      clearErrors: () => { banners.innerHTML = ''; },
      showErrors: errs => [].concat(errs).forEach(e => banner('bad', `✗ ${e.pageItem ? e.pageItem + ': ' : ''}${e.message}`))
    },
    debug: { info: (...a) => log('dim', ['[apex.debug]', ...a]), log: (...a) => log('dim', ['[apex.debug]', ...a]), error: (...a) => log('err', ['[apex.debug]', ...a]) },
    util: { escapeHTML: s => esc(s), delayLinger: undefined },
    page: { submit: r => banner('ok', `Page submitted with request "${r || ''}"`) }
  };
  const fakeConsole = {
    log: (...a) => log('', a), info: (...a) => log('', a), warn: (...a) => log('err', ['⚠', ...a]), error: (...a) => log('err', a),
    table: rows => { try{ const r = [].concat(rows); const cols = Object.keys(r[0]||{}); log('', [[cols.join(' | '), ...r.map(x => cols.map(c => x[c]).join(' | '))].join('\n')]); }catch(e){ log('', [rows]); } }
  };
  let daThis = {};
  if(thisSpec){ const [id, value] = thisSpec.split('='); daThis = { triggeringElement: { id, get value(){ return val(id) || value; } }, browserEvent: { type: 'change' }, data: {}, affectedElements: [] }; }
  return { apex, $v: k => val(k), $s: (k, v) => item(k).setValue(v), console: fakeConsole, daThis, log };
}
let uidCounter = 0;
function runCode(container, code){
  const out = container.querySelector('.out'); out.innerHTML = ''; container.querySelector('.banners').innerHTML = '';
  const rt = container._rt;
  try{
    const fn = new Function('apex', '$v', '$s', 'console', code);
    fn.call(rt.daThis, rt.apex, rt.$v, rt.$s, rt.console);
  }catch(e){ rt.log('err', [`${e.name}: ${e.message}`]); }
  window.__lastRuntime = rt;
  setTimeout(() => { if(!out.textContent.trim() && !container.querySelector('.banners').textContent) rt.log('dim', ['(ran with no output)']); }, 700);
}
// errors thrown inside setTimeout callbacks in user code
window.addEventListener('error', e => { if(window.__lastRuntime){ window.__lastRuntime.log('err', [e.message]); e.preventDefault(); } });

function runnerShell(kind, label, pageSpec){
  const id = 'r' + (++uidCounter);
  const wrap = document.createElement('div'); wrap.className = 'runner'; wrap.dataset.uid = id;
  wrap.innerHTML = `<div class="bar"><span>${label}</span><span class="tools"></span></div>
    <textarea id="${id}-code" class="${kind==='text'?'text':''}" spellcheck="false"></textarea>
    ${kind==='js' ? `${pageSpec?'<div class="fakepage"></div>':''}<div class="banners"></div><div class="out"></div>` : ''}`;
  return wrap;
}
function fitTextarea(ta){ const lines = ta.value.split('\n').length; ta.rows = Math.min(Math.max(lines + 1, 4), 26); }
function tabKey(ta){ ta.addEventListener('keydown', e => { if(e.key === 'Tab' && !e.shiftKey && ta.classList.contains('text')===false){ e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); } }); }

function buildDemo(el){
  const code = el.querySelector('pre').textContent;
  const r = runnerShell('js', 'Example · editable', el.dataset.page);
  el.replaceChildren(r);
  const ta = r.querySelector('textarea'); ta.value = code; fitTextarea(ta); tabKey(ta);
  r._rt = buildRuntime(r, el.dataset.page, el.dataset.this);
  const tools = r.querySelector('.tools');
  tools.innerHTML = `<button class="btn primary">Run</button> <button class="btn">Reset</button>`;
  const [run, reset] = tools.querySelectorAll('button');
  run.onclick = () => runCode(r, ta.value);
  reset.onclick = () => { ta.value = code; fitTextarea(ta); r._rt = buildRuntime(r, el.dataset.page, el.dataset.this); r.querySelector('.out').innerHTML=''; r.querySelector('.banners').innerHTML=''; };
}

function buildExercise(el){
  const id = el.dataset.id, kind = el.dataset.kind;
  const all = [...el.closest('.tbody').querySelectorAll('.ex')]; const idx = all.indexOf(el);
  const tags = ['Guided', 'New scenario', 'Stretch']; const tag = tags[Math.min(idx, 2)] || 'Exercise';
  const q = el.querySelector('.q'), start = el.querySelector('.start')?.textContent || '', hint = el.querySelector('.hint'), sol = el.querySelector('.sol')?.textContent || '';
  const r = runnerShell(kind, kind === 'js' ? 'Your code · saved as you type' : 'Your answer · saved as you type', el.dataset.page);
  const head = document.createElement('div'); head.className = 'ex-head';
  head.innerHTML = `<span class="ex-tag t${Math.min(idx,2)+1}">${tag}</span>`; head.appendChild(q);
  const tools = document.createElement('div'); tools.className = 'ex-tools';
  tools.innerHTML = `${kind==='js'?'<button class="btn primary" data-a="run">Run</button>':''}<button class="btn" data-a="hint">Show hint</button><button class="btn" data-a="sol">Show solution</button><span class="saved"></span>`;
  const hintBox = document.createElement('div'); hintBox.className = 'reveal'; hintBox.hidden = true; hintBox.innerHTML = '<span class="label">Hint</span><div></div>'; hintBox.lastChild.append(...(hint ? hint.childNodes : []));
  const solBox = document.createElement('div'); solBox.className = 'reveal'; solBox.hidden = true; solBox.innerHTML = '<span class="label">One possible solution. Compare it with yours; don\'t replace yours.</span><pre></pre>'; solBox.querySelector('pre').textContent = sol;
  el.replaceChildren(head, r, tools, hintBox, solBox);
  const ta = r.querySelector('textarea'); ta.id = 'ex-' + id;
  ta.value = state.answers[id]?.text ?? start; fitTextarea(ta); tabKey(ta);
  if(kind==='text') ta.placeholder = 'Write your answer here…';
  if(kind === 'js') r._rt = buildRuntime(r, el.dataset.page, el.dataset.this);
  const savedEl = tools.querySelector('.saved'), solBtn = tools.querySelector('[data-a=sol]');
  const attempted = () => ta.value.trim() !== start.trim() && ta.value.trim().length > 15;
  const refresh = () => { solBtn.disabled = !attempted(); solBtn.title = attempted() ? '' : 'Write your own attempt first'; savedEl.textContent = state.answers[id] ? 'Saved ' + new Date(state.answers[id].at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''; };
  refresh();
  ta.addEventListener('input', () => { fitTextarea(ta); saveAnswer(id, ta.value); refresh(); });
  tools.querySelector('[data-a=hint]').onclick = () => { hintBox.hidden = !hintBox.hidden; };
  solBtn.onclick = () => { solBox.hidden = !solBox.hidden; };
  if(kind === 'js') tools.querySelector('[data-a=run]').onclick = () => { r._rt = buildRuntime(r, el.dataset.page, el.dataset.this); runCode(r, ta.value); };
  el._ta = ta; el._refresh = refresh;
}



function buildQuiz(el){
  const key = el.dataset.quiz, qs = QUIZ[key] || [];
  el.innerHTML = '';
  const score = document.createElement('p'); score.className = 'muted';
  const upd = () => { const got = qs.filter((it,i) => state.quiz[`${key}-${i}`]?.pick === it.a).length; score.textContent = `Score: ${got} / ${qs.length}`; };
  qs.forEach((item, i) => {
    const box = document.createElement('div'); box.className = 'qz';
    box.innerHTML = `<b>${i+1}. ${esc(item.q)}</b><div class="opts"></div><p class="why" hidden></p>`;
    const opts = box.querySelector('.opts'), why = box.querySelector('.why');
    const show = pick => {
      opts.querySelectorAll('button').forEach((b, j) => { b.classList.toggle('right', j === item.a); b.classList.toggle('wrong', j === pick && pick !== item.a); });
      why.hidden = false; why.textContent = (pick === item.a ? 'Correct. ' : 'Not quite. ') + item.why;
    };
    item.o.forEach((o, j) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.onclick = () => { state.quiz[`${key}-${i}`] = { pick: j, at: Date.now() }; saveDoc(`quiz/${key}-${i}`, state.quiz[`${key}-${i}`]); show(j); upd(); };
      opts.appendChild(b); });
    const prev = state.quiz[`${key}-${i}`]; if(prev) show(prev.pick);
    el.appendChild(box);
  });
  el.prepend(score); upd();
}

function refreshOpenView(){
  if(!location.hash || location.hash === '#'){ renderHome(); return; }
  document.querySelectorAll('.ex').forEach(ex => {
    const ta = ex._ta, saved = state.answers[ex.dataset.id];
    if(ta && saved && document.activeElement !== ta && saved.text !== ta.value){ ta.value = saved.text; fitTextarea(ta); ex._refresh(); }
  });
}
function route(){
  const id = location.hash.replace('#', '');
  if(id && TOPICS.some(t => t.id === id)) renderTopic(id); else renderHome();
}
window.addEventListener('hashchange', route);
route(); connect();
