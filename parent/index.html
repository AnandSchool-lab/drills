<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Drills — Parent</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F6F9FD; --ink:#16243C; --muted:#56688A;
  --line:#D5DEEC; --accent:#2454CE; --accent-soft:#E2EAFF;
  --good:#1C7C54; --good-soft:#DFF3E8; --bad:#B3261E; --bad-soft:#FBE4E2;
  --amber:#D9731A; --amber-soft:#FDEEDC;
  color-scheme: light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1724; --surface:#17222F; --surface-2:#1D293A; --ink:#E6EDF8; --muted:#9AACC6;
  --line:#2B3A4F; --accent:#7AA2FF; --accent-soft:#1E2B46;
  --good:#5FD3A0; --good-soft:#15332A; --bad:#FF9A92; --bad-soft:#3A1F1E;
  --amber:#F0A458; --amber-soft:#36281A;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:16px max(12px,env(safe-area-inset-left,0)) 56px max(12px,env(safe-area-inset-right,0))}
.wrap{max-width:1280px;margin:0 auto}
button{font:inherit;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.sm{font-size:12.5px;padding:4px 10px;border-radius:7px}
button:disabled{opacity:.42;cursor:default}
input,select{font:inherit;font-size:15px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* gate */
#gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:20px}
#gate h1{font-size:21px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 12px}
#pass{width:100%}
.err{color:var(--bad);font-size:13.5px;min-height:19px;margin:7px 0}

/* top */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;font-size:16px;font-weight:700;padding:10px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .d{flex:1;text-align:center;font-weight:600;font-size:15px}
.daynav button{padding:7px 12px}
.stamp{color:var(--muted);font-size:12px;text-align:center;margin:0 0 12px}

/* live */
.notes{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;
  padding:9px 12px;margin-bottom:10px;font-size:13px;line-height:1.5}
.now{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--good-soft);
  border:1px solid var(--good);border-radius:11px;padding:10px 13px;margin-bottom:12px;font-size:14.5px}
.now b{font-weight:700}
.now .pill{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
  border-radius:7px;padding:1px 8px;font-size:12.5px;font-weight:600}

/* stuck */
.stuckbox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;
  padding:12px 14px;margin-bottom:12px}
.stuckbox h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber)}
.sq{border-top:1px solid rgba(0,0,0,.08);padding:9px 0}
.sq:first-of-type{border-top:0}
.sq .qt{font-weight:600;font-size:14.5px}
.sq .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.sq textarea{width:100%;margin-top:7px;min-height:120px;font:inherit;font-size:13.5px;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);
  color:var(--ink);resize:vertical;line-height:1.6}
.sprev{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-top:8px;max-height:min(78vh,1000px);overflow:auto}
.sprev .sstep{margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sprev .sstep:last-of-type{border-bottom:0}
.sprev .sstep p{margin:0 0 5px;font-size:14px;line-height:1.55}
.sprev .sstep b{color:var(--accent)}
.sprev svg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.sprev .sans{font-size:14.5px;margin:4px 0 8px;padding:8px 11px;border-radius:8px;
  background:var(--good-soft);border:1px solid var(--good)}
.sprev .sans b{color:var(--good)}
.sprev .stip{font-size:13.5px;margin:0;padding:8px 11px;border-radius:8px;
  background:var(--amber-soft);border:1px solid var(--amber)}
.sq .edit{font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:0;
  padding:4px 0;text-decoration:underline}
.sq .nosol{font-size:13.5px;color:var(--muted);margin-top:6px}
.sq .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sq .sent{color:var(--good);font-weight:600;font-size:13px}

/* blocks */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.blk>header{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface-2)}
.blk>header .nm{font-weight:700;font-size:15px;text-transform:capitalize}
.blk>header .sc{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px}
.blk>header .sc.good{color:var(--good)} .blk>header .sc.work{color:var(--amber)}
.blk>header .tm{color:var(--muted);font-size:12.5px;white-space:nowrap}
/* The whole sheet. Two columns of problems once there is room for them,
   because one column down the middle of a wide screen wasted the page
   and made forty questions feel like scrolling forever. */
.qcols{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:900px){
  .qcols{grid-template-columns:1fr 1fr}
  .qcol+.qcol{border-left:1px solid var(--line)}
}
.qcol.empty{display:none}
@media (min-width:900px){ .qcol.empty{display:block} }
.qhead,.qrow{display:grid;grid-template-columns:30px 1fr auto 16px minmax(0,auto) 26px;gap:9px;
  align-items:baseline;padding:7px 13px;min-width:0}
.qhead{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  background:var(--surface-2);border-bottom:1px solid var(--line);padding-top:5px;padding-bottom:5px}
.qhead span:nth-child(3),.qhead span:nth-child(5){text-align:right}
.qrow{font-size:14px;border-bottom:1px solid var(--line)}
.qrow:nth-child(even){background:var(--surface)}
.qrow.bad{background:var(--bad-soft)}
.qrow .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.qrow .qq{min-width:0;overflow-wrap:anywhere}
.qrow .ga{font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.qrow .ga.ok{color:var(--ink);font-weight:600}
.qrow .ga.blank{font-weight:500;font-style:italic;color:var(--muted)}
.qrow .mk{text-align:center;font-weight:700}
.qrow.bad .mk{color:var(--bad)}
.qrow:not(.bad) .mk{color:var(--good)}
.qrow .wa{font-weight:700;color:var(--good);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.blk>header .key{color:var(--muted);font-size:11.5px;white-space:nowrap}
@media (max-width:620px){ .blk>header .key{display:none} }
.qrow .pen{text-align:right}
.inkbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:1px 6px;font-size:13px;cursor:pointer;line-height:1.4}
.inkbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft,#EAF0FF)}
/* her working opens under its own problem and spans both columns */
.qink{padding:0 13px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.qink[hidden]{display:none}
.qink img.work{display:block;width:100%;max-height:420px;object-fit:contain;object-position:left top;
  background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:9px;cursor:zoom-in}
.qink .txt{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:14px;white-space:pre-wrap;margin-top:9px}
.blk.onlybad .qrow:not(.bad){display:none}
.blk.onlybad .qrow:not(.bad)+.qink{display:none}
.filt{font-size:12px;padding:3px 9px}
.legacy{padding:10px 13px;color:var(--ink);font-size:13px;line-height:1.5;
  border-top:1px solid var(--line);background:var(--amber-soft)}
.legacy b{color:var(--amber)}
.allright{padding:9px 13px;border-top:1px solid var(--line);color:var(--good);font-size:14px}
.nowork{padding:11px 13px;color:var(--muted);font-size:13.5px;
  border-top:1px solid var(--line)}
.notehost .lab{padding:10px 13px 0;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
/* An essay is a tall page. Letting it fill the width and run to its own
   height beats shrinking it into a corner of a wide box. */
.notehost .qink img.work{max-height:none;object-fit:fill;width:100%;height:auto}
/* full size, because a thumbnail of a page of writing tells you nothing */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(10,18,30,.82);overflow:auto;
  padding:18px;cursor:zoom-out}
.lightbox img{display:block;margin:0 auto;max-width:100%;background:#fff;border-radius:10px}

/* last night */
.rv{background:var(--surface);border:1px solid var(--accent);border-left:4px solid var(--accent);
  border-radius:12px;padding:13px 15px;margin:14px 0}
.rv h3{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rv .praise{color:var(--good);font-weight:600;font-size:14.5px;margin-bottom:8px}
.rv .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin-top:9px}
.rv ul{margin:3px 0 0;padding-left:17px;font-size:14px}
.rv s{color:var(--bad)} .rv b{color:var(--good)}
.rv p{margin:2px 0;font-size:14px}

.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;
  padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.msg{font-size:13px;color:var(--muted)}

/* ===== Look v2: one clean window, coloured section tags, short text,
   small buttons. Only styling and order change - every feature and her
   handwriting are exactly as before. ===== */
:root{ --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t-recap:#7A4FD0; --t-math:#2454CE; --t-think:#C8661A; --t-eng:#1C7C54; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --t-recap:#B79BFF; --t-math:#8FB0FF; --t-think:#F0A458; --t-eng:#5FD3A0; }}
body{background:var(--bg)}
.wrap{max-width:1180px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:12px}
.winbar{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#FF5F57} .dots i:nth-child(2){background:#FEBC2E}
.dots i:nth-child(3){background:#28C840}
.wtitle{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.winbody{padding:12px 14px 4px}
.tabs{gap:4px;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:3px;width:max-content}
.tab{flex:0 0 auto;font-size:13.5px;padding:5px 16px;border:0;border-radius:8px;background:none}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.daynav{margin-bottom:6px}
.daynav .d{text-align:left;font-size:17px;font-weight:700;order:-1}
.daynav button{padding:4px 10px;font-size:13px;border-radius:7px}
.stamp{text-align:left;font-family:var(--mono);font-size:11.5px;margin-bottom:10px}

/* tag-style labels: <math> ... */
.tag{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:0;text-transform:none}
.tag::before{content:"<";opacity:.55} .tag::after{content:">";opacity:.55}
.blk{border-radius:14px}
.blk>header{background:var(--surface);border-bottom:0;padding:11px 14px}
.blk>header .nm{font-family:var(--mono);font-size:13.5px;text-transform:lowercase}
.blk>header .nm::before{content:"<";opacity:.5} .blk>header .nm::after{content:">";opacity:.5}
.blk[data-b="recap"]>header .nm{color:var(--t-recap)}
.blk[data-b="math"]>header .nm{color:var(--t-math)}
.blk[data-b="think"]>header .nm{color:var(--t-think)}
.blk[data-b="eng"]>header .nm{color:var(--t-eng)}
.blk[data-b="recap"]{border-top:3px solid var(--t-recap)}
.blk[data-b="math"]{border-top:3px solid var(--t-math)}
.blk[data-b="think"]{border-top:3px solid var(--t-think)}
.blk[data-b="eng"]{border-top:3px solid var(--t-eng)}
.blk>header .sc{font-family:var(--mono);font-size:13.5px}
.blk>header .tm{font-family:var(--mono);font-size:11.5px}
.filt{font-size:11.5px;padding:2px 9px;border-radius:999px}
.qhead{font-family:var(--mono);font-size:10.5px;background:var(--surface-2)}
.qrow{font-size:13.5px;padding-top:6px;padding-bottom:6px}
.qhead,.qrow{grid-template-columns:28px 1fr auto 14px minmax(0,auto) auto}
/* the pencil: a small pill that opens her own handwriting, as she drew it */
.inkbtn{border-radius:999px;font-size:11.5px;padding:1px 8px;white-space:nowrap;
  color:var(--t-math);border-color:currentColor;background:var(--surface)}
.inkbtn::after{content:" working"}
.inkbtn.on{background:var(--t-math);color:#fff;border-color:var(--t-math)}
.qink img.work{border-radius:10px}

/* last night's review is the summary, so it sits first */
.rv{border:1px solid var(--line);border-left:0;border-top:3px solid var(--accent);
  border-radius:14px;margin:0 0 12px;padding:12px 14px}
.rv h3{font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent)}
.rv h3::before{content:"<";opacity:.5} .rv h3::after{content:">";opacity:.5}
.rv .lab{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;font-weight:700}
.rv .lab::before{content:"# ";opacity:.5}
.now{border-radius:12px;font-size:13.5px}
.stuckbox{border-radius:14px}
.stuckbox h3{font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:13px}
.foot{font-family:var(--mono);font-size:12px}
.foot button{font-family:inherit}
</style>
</head>
<body>

<div id="gate" hidden>
  <h1>Parent view</h1>
  <p>Enter your passphrase.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="passphrase" aria-label="passphrase">
  <p class="err" id="gateErr"></p>
  <button class="primary" id="go" style="width:100%">Open</button>
</div>

<div class="wrap" id="board" hidden>
  <div class="win">
    <div class="winbar"><span class="dots"><i></i><i></i><i></i></span>
      <span class="wtitle">daily-drills · parent</span></div>
    <div class="winbody">
      <div class="tabs" id="tabs"></div>
      <div class="daynav">
        <button id="prev" aria-label="previous day">‹</button>
        <span class="d" id="dayLabel">—</span>
        <button id="next" aria-label="next day">›</button>
        <button id="todayBtn" class="sm">Today</button>
      </div>
      <p class="stamp" id="stamp"></p>
    </div>
  </div>

  <div id="notes"></div>
  <div id="review"></div>
  <div id="now"></div>
  <div id="stuck"></div>
  <div id="blocks"></div>

  <div class="foot">
    <button class="sm" id="retake">Clear this day so she does it again</button>
    <span class="msg" id="retakeMsg"></span>
    <span style="margin-left:auto"><a href="../">kids' app</a> ·
      <button class="sm" id="forget">forget passphrase</button></span>
  </div>
</div>

<script src="../ink.js"></script>
<script src="../solve.js"></script>
<script>
var API  = "https://drills-api.anandm401-amazon.workers.dev";
var KIDS = ["Alvina", "Andrila"];
var BLOCKS = ["recap", "math", "think", "eng"];
var LABEL  = { recap:"Recap", math:"Math", think:"Thinking", eng:"English" };

var KEY = "", kid = KIDS[0], day = "", timer = null, cache = {};

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pad2(n){ return String(n).padStart(2,"0"); }

/* The family's own date. toISOString() is UTC, which after 4pm Pacific is
   already tomorrow - and the page would go blank exactly when it is read. */
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function shift(dstr, n){
  var p = dstr.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function pretty(dstr){
  var p = dstr.split("-");
  return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString(undefined,
    { weekday:"long", day:"numeric", month:"long" });
}
function ago(iso){
  if(!iso) return "";
  var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(s < 60) return s + "s ago";
  var m = Math.round(s/60);
  return m < 60 ? m + " min ago" : Math.round(m/60) + "h ago";
}

/* ---------- the gate ---------- */
function openGate(msg){
  $("#board").hidden = true; $("#gate").hidden = false;
  $("#gateErr").textContent = msg || ""; $("#pass").focus();
}
function fetchLive(k, d){
  return fetch(API + "/live?key=" + encodeURIComponent(k) + "&date=" + d, { cache:"no-store" })
    .then(function(r){
      if(r.status === 401) return { bad:true };
      if(!r.ok) throw new Error("server " + r.status);
      return r.json();
    });
}

/* When the gate cannot get through, say which of the three things went
   wrong rather than "could not reach the server". /health needs no key
   and no database, so if that answers, the Worker is up and the problem
   is this page or the key; if it does not, the network in front of you
   is blocking the address, or the Worker is not deployed. */
function diagnose(err){
  var host = API.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  return fetch(API + "/health", { cache:"no-store" }).then(function(r){
    return r.ok
      ? "The server is up, but it refused that request (" + err.message + "). Try again in a moment."
      : "The server answered " + r.status + " on /health. It is deployed but unwell.";
  }).catch(function(){
    return "Nothing on this network can reach " + host + ". If you are on the office " +
           "wi-fi it is probably blocked there — try your phone on cellular to check.";
  });
}
$("#go").addEventListener("click", submit);
$("#pass").addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
function submit(){
  var k = $("#pass").value.trim();
  if(!k) return;
  $("#go").disabled = true; $("#gateErr").textContent = "checking…";
  fetchLive(k, day).then(function(d){
    $("#go").disabled = false;
    if(d.bad){ $("#gateErr").textContent = "That passphrase was not accepted."; return; }
    KEY = k;
    try{ localStorage.setItem("dd:parentKey", k); }catch(e){}
    $("#gate").hidden = true; $("#board").hidden = false;
    paint(d); start();
  }).catch(function(e){
    $("#go").disabled = false;
    $("#gateErr").textContent = "Checking why…";
    diagnose(e).then(function(msg){ $("#gateErr").textContent = msg; });
  });
}
$("#forget").addEventListener("click", function(){
  try{ localStorage.removeItem("dd:parentKey"); }catch(e){}
  KEY = ""; stop(); $("#pass").value = ""; openGate("Forgotten on this device.");
});

/* ---------- the board ---------- */
function tabs(){
  $("#tabs").innerHTML = KIDS.map(function(k){
    return '<button class="tab' + (k === kid ? " on" : "") + '" data-kid="' + k + '">' + esc(k) + '</button>';
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ kid = b.dataset.kid; tabs(); refresh(); });
  });
}

function paint(d){
  cache.live = d;
  $("#dayLabel").textContent = pretty(day);
  $("#stamp").textContent = "updated " + ago(d.serverTime);
  $("#next").disabled = day >= todayStr();

  /* Anything the server could not read. Empty on a healthy day; when a
     table is missing it says so here instead of failing silently. */
  var notes = d.notes || [];
  $("#notes").innerHTML = notes.length
    ? '<div class="notes">Part of this page could not load — ' + esc(notes.join("; ")) + '</div>'
    : "";

  /* working right now */
  var now = (d.live || []).filter(function(r){ return r.kid === kid && r.date === day; });
  $("#now").innerHTML = now.map(function(r){
    var stuck = []; try{ stuck = JSON.parse(r.stuck || "[]"); }catch(e){}
    return '<div class="now"><b>On ' + esc(LABEL[r.block] || r.block) + ' now</b>' +
      '<span>' + r.answered + ' of ' + r.total + ' · ' + r.mins + ' min</span>' +
      stuck.map(function(s){ return '<span class="pill">Q' + esc(s.q) + ' ' + esc(s.why) + '</span>'; }).join("") +
      '<span style="margin-left:auto;color:var(--muted);font-size:12.5px">seen ' + ago(r.seen_at) + '</span></div>';
  }).join("");

/* One problem, one line: what was asked, what she wrote, the right
   answer when she missed it, and a pencil if she showed her working. */
function rowHTML(a){
  var gave = a.gave || "", blank = !gave || /^\(?blank\)?$/i.test(gave);
  return '<div class="qrow' + (a.ok ? "" : " bad") + '" data-pad="' + esc(a.pad || "") + '">' +
    '<span class="n">' + a.n + '</span>' +
    '<span class="qq">' + esc(a.q) + '</span>' +
    '<span class="ga' + (a.ok ? " ok" : "") + (blank ? " blank" : "") + '">' +
      esc(blank ? "nothing" : gave) + '</span>' +
    '<span class="mk">' + (a.ok ? "✓" : "✗") + '</span>' +
    '<span class="wa">' + (a.ok ? "" : esc(a.want)) + '</span>' +
    '<span class="pen"></span>' +
  '</div><div class="qink" hidden></div>';
}

/* Two columns side by side on a real screen, each with its own heading
   row so no number on the page is ever unlabelled. Straight down the
   left column, then the right. One column on a phone. */
function columns(rows){
  var head = '<div class="qhead"><span></span><span>Question</span>' +
    '<span>She wrote</span><span></span><span>Answer</span><span></span></div>';
  var half = Math.ceil(rows.length / 2);
  return '<div class="qcols">' +
    '<div class="qcol">' + head + rows.slice(0, half).join("") + '</div>' +
    (rows.length > half
      ? '<div class="qcol">' + head + rows.slice(half).join("") + '</div>'
      : '<div class="qcol empty"></div>') +
  '</div>';
}

  /* A block at a time, and inside it the whole sheet: every question in
     the order she met it, what she wrote, what the answer was, and her
     working beside the problem it belongs to. The old version listed
     only the mistakes, as two unlabelled numbers. */
  var results = {}, rows = {}, wrong = {};
  (d.today || []).forEach(function(r){ if(r.kid === kid && r.date === day) results[r.block] = r; });
  (d.answers || []).forEach(function(a){
    if(a.kid !== kid) return;
    (rows[a.block] = rows[a.block] || []).push(a);
  });
  /* Days before the answers table existed have misses only. Show those
     rather than an empty block pretending nothing happened. */
  (d.misses || []).forEach(function(m){
    if(m.kid !== kid || m.date !== day) return;
    (wrong[m.block] = wrong[m.block] || []).push(m);
  });

  $("#blocks").innerHTML = BLOCKS.map(function(b){
    var r = results[b], all = rows[b] || [], ws = wrong[b] || [];
    var pc = r && r.total ? r.got / r.total : 0;
    var missed = all.filter(function(a){ return !a.ok; }).length;

    var head = '<header><span class="nm">' + LABEL[b] + '</span>' +
      (r ? '<span class="tm">' + Math.round(r.secs/60) + ' min</span>' +
           (all.length ? '<button class="sm filt" data-b="' + b + '">show only the ' +
                          missed + ' wrong</button>' : '') +
           '<span class="sc ' + (pc >= 0.8 ? "good" : "work") + '">' + r.got + ' / ' + r.total + '</span>'
         : '<span class="sc" style="color:var(--muted)">not done</span>') +
      '</header>';

    var body;
    if(!r){
      /* Say so. A bare empty card at nine in the morning looks like a
         page that is not working, rather than a day not started. */
      body = '<div class="nowork">' + esc(kid) + ' has not finished ' + LABEL[b] +
        (day === todayStr() ? " today yet." : " on this day.") +
        ' Every question will be listed here once she presses Check.</div>';
    } else if(all.length){
      body = columns(all.map(rowHTML));
    } else if(ws.length){
      body = '<div class="legacy"><b>This day is from before the whole sheet was kept.</b> ' +
        'Only her mistakes were recorded, so the ones she got right are not listed. ' +
        'Every day from 6 November shows all of it.</div>' +
        columns(ws.map(function(m, i){
          return rowHTML({ n:i+1, q:m.q, gave:m.gave, want:m.want, ok:0, pad:"" });
        }));
    } else {
      body = '<div class="allright">All correct.</div>';
    }

    return '<section class="blk" data-b="' + b + '">' + head + body +
      '<div class="notehost"></div></section>';
  }).join("");

  /* one button per block: hide everything she got right */
  $("#blocks").querySelectorAll(".filt").forEach(function(btn){
    var sec = btn.closest(".blk"), only = false;
    var n = btn.textContent;
    btn.addEventListener("click", function(){
      only = !only;
      sec.classList.toggle("onlybad", only);
      btn.textContent = only ? "show all" : n;
    });
  });

  loadNotes();
  loadReview();
  paintStuck(d);
}

/* The ones they said they could not do. This is the part that wants
   answering today, so it sits above everything else. */
function paintStuck(d){
  var mine = (d.stuck || []).filter(function(r){ return r.kid === kid; });
  var host = $("#stuck");
  if(!mine.length){ host.innerHTML = ""; return; }

  host.innerHTML = '<div class="stuckbox"><h3>' + esc(kid) +
    ' asked for help &middot; ' + mine.length + '</h3>' +
    mine.map(function(r, i){
      return '<div class="sq" data-i="' + i + '">' +
        '<div class="qt">' + esc(r.q || (r.block + " " + r.pad)) + '</div>' +
        '<div class="meta">' + esc(LABEL[r.block] || r.block) + ' &middot; ' + esc(r.date) +
          (r.answered ? ' &middot; <b style="color:var(--good)">answered</b>' : '') + '</div>' +
        (r.answered ? '' : '<div class="solwrap" data-i="' + i + '"></div>') +
      '</div>';
    }).join("") + '</div>';

  /* The answer is worked out for you, pictures and all. Read it, change
     the wording if you want, press send. The pictures are kept whatever
     you do to the words. */
  host.querySelectorAll(".solwrap").forEach(function(wrap){
    var r = mine[+wrap.dataset.i];
    var sol = (window.Solve ? Solve.forQuestion(r.q) : null) || { steps:[] };
    var hasSteps = sol.steps && sol.steps.length;

    wrap.innerHTML =
      (hasSteps
        ? '<div class="sprev">' + Solve.render(sol) + '</div>' +
          '<button class="edit" type="button">change the wording</button>' +
          '<textarea hidden></textarea>'
        : '<p class="nosol">I could not work this one out automatically — it is a word problem or something I do not recognise. Write it in your own words below.</p>' +
          '<textarea placeholder="Step 1 ...&#10;&#10;Step 2 ...&#10;&#10;Tip: ..."></textarea>') +
      '<div class="row"><button class="sm primary send">' +
        (hasSteps ? "Send this to her" : "Send it to her") + '</button>' +
      '<span class="msg"></span></div>';

    var ta = wrap.querySelector("textarea");
    if(hasSteps) ta.value = sol.steps.map(function(st){ return st.text; }).join("\n\n");

    var edit = wrap.querySelector(".edit");
    if(edit) edit.addEventListener("click", function(){
      ta.hidden = !ta.hidden;
      edit.textContent = ta.hidden ? "change the wording" : "hide the wording";
      if(!ta.hidden) ta.focus();
    });

    wrap.querySelector(".send").addEventListener("click", function(){
      var btn = this, msg = wrap.querySelector(".msg");
      var payload;
      if(hasSteps){
        /* his words, my pictures */
        var lines = ta.value.split(/\n{2,}/).map(function(t){ return t.trim(); }).filter(Boolean);
        payload = JSON.stringify({
          steps: sol.steps.map(function(st, n){ return { text: lines[n] || st.text, svg: st.svg }; }),
          answer: sol.answer, tip: sol.tip
        });
      } else {
        if(!ta.value.trim()){ msg.textContent = "Write something first."; return; }
        payload = ta.value.trim();
      }
      btn.disabled = true; msg.textContent = "sending…";
      fetch(API + "/solution", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ key:KEY, kid:r.kid, date:r.date, block:r.block,
                               pad:r.pad, solution:payload }) })
        .then(function(res){
          btn.disabled = false;
          if(res.ok){
            msg.innerHTML = '<span class="sent">Sent. She sees it when she taps Update.</span>';
            btn.disabled = true; if(ta) ta.disabled = true;
          } else msg.textContent = "That did not work (" + res.status + ").";
        }).catch(function(){ btn.disabled = false; msg.textContent = "Could not reach the server."; });
    });
  });
}

/* Does this pad actually hold anything? An empty pad used to be counted
   as a note, which is why the header said "2 notes" and only one thing
   ever appeared. */
function padHas(data){
  return !!((data.s && data.s.length) || (data.imgs && data.imgs.length) ||
            (data.text && data.text.trim()));
}

/* Her working, beside the problem it belongs to. Each one is drawn once
   as a still image - a dashboard wants to be read, not watched - and
   clicking it opens the page full size. Anything that does not match a
   problem (the essay, mainly) goes under the block it came from. */
function loadNotes(){
  if(!KEY) return;
  fetch(API + "/ink?key=" + encodeURIComponent(KEY) +
        "&kid=" + encodeURIComponent(kid) + "&date=" + day, { cache:"no-store" })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var loose = {};
      (d.pads || []).forEach(function(p){
        var data = {}; try{ data = JSON.parse(p.data || "{}"); }catch(e){}
        if(!padHas(data)) return;                       // nothing was written here

        var sec = document.querySelector('.blk[data-b="' + p.block + '"]');
        if(!sec) return;
        var row = sec.querySelector('.qrow[data-pad="' + cssq(p.pad) + '"]');
        if(row) attachInk(row.nextElementSibling, data, row);
        else (loose[p.block] = loose[p.block] || []).push(data);
      });

      Object.keys(loose).forEach(function(b){
        var sec = document.querySelector('.blk[data-b="' + b + '"]');
        if(!sec) return;
        var host = sec.querySelector(".notehost");
        host.innerHTML = '<div class="lab">Her writing</div>';
        loose[b].forEach(function(data){
          var slot = document.createElement("div");
          slot.className = "qink";
          host.appendChild(slot);
          attachInk(slot, data, null);
        });
      });
    }).catch(function(){});
}

function cssq(s){ return String(s).replace(/"/g, '\\"'); }

/* Put one pad's contents into a slot. With a row, the slot starts closed
   and the row gets a pencil to open it; without one it is always open. */
function attachInk(slot, data, row){
  if(!slot) return;
  var html = "";
  if(data.s && data.s.length && window.Ink){
    try{ html += '<img class="work" alt="her working" src="' + Ink.toImage(data, 2) + '">'; }
    catch(e){}
  }
  (data.imgs || []).forEach(function(src){
    html += '<img class="work" alt="her working" src="' + src + '">';
  });
  if(data.text && data.text.trim()) html += '<div class="txt">' + esc(data.text) + '</div>';
  if(!html) return;
  slot.innerHTML = html;

  slot.querySelectorAll("img.work").forEach(function(img){
    img.addEventListener("click", function(){ bigPicture(img.src); });
  });

  if(!row){ slot.hidden = false; return; }
  var pen = row.querySelector(".pen");
  if(!pen) return;
  pen.innerHTML = '<button class="inkbtn" type="button" title="her working">✎</button>';
  pen.querySelector("button").addEventListener("click", function(){
    slot.hidden = !slot.hidden;
    this.classList.toggle("on", !slot.hidden);
  });
}

/* Full size, because a thumbnail of a page of writing is useless. */
function bigPicture(src){
  var back = document.createElement("div");
  back.className = "lightbox";
  back.innerHTML = '<img src="' + src + '" alt="her working">';
  back.addEventListener("click", function(){ back.remove(); });
  document.body.appendChild(back);
}

function loadReview(){
  var host = $("#review");
  host.innerHTML = "";
  fetch(API + "/review?kid=" + encodeURIComponent(kid) + "&date=" + day)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var rv = d && d.review;
      if(!rv) return;
      var sp = rv.spelling || [], es = rv.essay || {}, fx = es.fixes || [];
      host.innerHTML = '<div class="rv"><h3>overnight-review</h3>' +
        (rv.praise ? '<div class="praise">' + esc(rv.praise) + '</div>' : "") +
        (sp.length ? '<div class="lab">Spelling</div><ul>' + sp.map(function(w){
            return '<li><s>' + esc(w.wrote) + '</s> &rarr; <b>' + esc(w.right) + '</b></li>'; }).join("") + '</ul>' : "") +
        (es.summary ? '<div class="lab">Writing</div><p>' + esc(es.summary) + '</p>' : "") +
        (fx.length ? '<ul>' + fx.map(function(f){
            return '<li><s>' + esc(f.was) + '</s> &rarr; <b>' + esc(f.should) + '</b></li>'; }).join("") + '</ul>' : "") +
        ((rv.math && rv.math.approach) ? '<div class="lab">Method</div><p>' + esc(rv.math.approach) + '</p>' : "") +
        ((rv.math && rv.math.note) ? '<p>' + esc(rv.math.note) + '</p>' : "") +
        '</div>';
    }).catch(function(){});
}

/* ---------- day navigation ---------- */
$("#prev").addEventListener("click", function(){ day = shift(day, -1); refresh(); });
$("#next").addEventListener("click", function(){ if(day < todayStr()){ day = shift(day, 1); refresh(); } });
$("#todayBtn").addEventListener("click", function(){ day = todayStr(); refresh(); });

/* ---------- retake ---------- */
$("#retake").addEventListener("click", function(){
  var b = $("#retake");
  if(b.dataset.armed !== "1"){
    b.dataset.armed = "1"; b.textContent = "Yes, clear " + kid + "'s " + day;
    setTimeout(function(){ b.dataset.armed = ""; b.textContent = "Clear this day so she does it again"; }, 8000);
    return;
  }
  b.dataset.armed = ""; b.textContent = "Clear this day so she does it again";
  b.disabled = true; $("#retakeMsg").textContent = "clearing…";
  fetch(API + "/retake", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ key:KEY, kid:kid, date:day }) })
    .then(function(r){
      b.disabled = false;
      $("#retakeMsg").textContent = r.ok
        ? "Cleared. It resets on her iPad next time she opens the app."
        : "That did not work (" + r.status + ").";
      if(r.ok) refresh();
    }).catch(function(){ b.disabled = false; $("#retakeMsg").textContent = "Could not reach the server."; });
});

/* ---------- loop ---------- */
function refresh(){
  if(!KEY) return;
  fetchLive(KEY, day).then(function(d){
    if(d.bad){ stop(); openGate("The passphrase changed."); return; }
    paint(d);
  }).catch(function(){ $("#stamp").textContent = "could not reach the server"; });
}
function start(){ stop(); timer = setInterval(refresh, 30000); }
function stop(){ if(timer){ clearInterval(timer); timer = null; } }
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && KEY){ refresh(); start(); } else stop();
});

/* ---------- boot ---------- */
(function(){
  day = todayStr();
  tabs();
  var saved = "";
  try{ saved = localStorage.getItem("dd:parentKey") || ""; }catch(e){}
  if(!saved){ openGate(); return; }
  fetchLive(saved, day).then(function(d){
    if(d.bad){ openGate("Saved passphrase no longer works."); return; }
    KEY = saved; $("#gate").hidden = true; $("#board").hidden = false;
    paint(d); start();
  }).catch(function(){ openGate("Could not reach the server."); });
})();
</script>
</body>
</html>
