<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Drills — Parent</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F6F9FD; --ink:#16243C; --muted:#56688A;
  --line:#D5DEEC; --accent:#2454CE; --accent-soft:#E2EAFF;
  --good:#1C7C54; --good-soft:#DFF3E8; --bad:#B3261E; --bad-soft:#FBE4E2;
  --amber:#D9731A; --amber-soft:#FDEEDC;
  color-scheme: light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1724; --surface:#17222F; --surface-2:#1D293A; --ink:#E6EDF8; --muted:#9AACC6;
  --line:#2B3A4F; --accent:#7AA2FF; --accent-soft:#1E2B46;
  --good:#5FD3A0; --good-soft:#15332A; --bad:#FF9A92; --bad-soft:#3A1F1E;
  --amber:#F0A458; --amber-soft:#36281A;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:16px max(12px,env(safe-area-inset-left,0)) 56px max(12px,env(safe-area-inset-right,0))}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.sm{font-size:12.5px;padding:4px 10px;border-radius:7px}
button:disabled{opacity:.42;cursor:default}
input,select{font:inherit;font-size:15px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* gate */
#gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:20px}
#gate h1{font-size:21px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 12px}
#pass{width:100%}
.err{color:var(--bad);font-size:13.5px;min-height:19px;margin:7px 0}

/* top */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;font-size:16px;font-weight:700;padding:10px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .d{flex:1;text-align:center;font-weight:600;font-size:15px}
.daynav button{padding:7px 12px}
.stamp{color:var(--muted);font-size:12px;text-align:center;margin:0 0 12px}

/* live */
.now{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--good-soft);
  border:1px solid var(--good);border-radius:11px;padding:10px 13px;margin-bottom:12px;font-size:14.5px}
.now b{font-weight:700}
.now .pill{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
  border-radius:7px;padding:1px 8px;font-size:12.5px;font-weight:600}

/* stuck */
.stuckbox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;
  padding:12px 14px;margin-bottom:12px}
.stuckbox h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber)}
.sq{border-top:1px solid rgba(0,0,0,.08);padding:9px 0}
.sq:first-of-type{border-top:0}
.sq .qt{font-weight:600;font-size:14.5px}
.sq .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.sq textarea{width:100%;margin-top:7px;min-height:92px;font:inherit;font-size:14px;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);
  color:var(--ink);resize:vertical}
.sq .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sq .sent{color:var(--good);font-weight:600;font-size:13px}

/* blocks */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.blk>header{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface-2)}
.blk>header .nm{font-weight:700;font-size:15px;text-transform:capitalize}
.blk>header .sc{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px}
.blk>header .sc.good{color:var(--good)} .blk>header .sc.work{color:var(--amber)}
.blk>header .tm{color:var(--muted);font-size:12.5px;white-space:nowrap}
.wrongs{list-style:none;margin:0;padding:0}
.wrongs li{display:flex;gap:10px;align-items:baseline;padding:8px 13px;
  border-top:1px solid var(--line);font-size:14px}
.wrongs .q{flex:1;min-width:0}
.wrongs .gave{color:var(--bad);font-weight:600;white-space:nowrap}
.wrongs .want{color:var(--good);font-weight:600;white-space:nowrap}
.allright{padding:9px 13px;border-top:1px solid var(--line);color:var(--good);font-size:14px}
.nowork{padding:9px 13px;color:var(--muted);font-size:14px}
.notes{padding:10px 13px;border-top:1px solid var(--line);background:var(--surface-2)}
.notes img{width:100%;display:block;border:1px solid var(--line);border-radius:8px;
  margin-bottom:8px;background:#fff}
.notes canvas{width:100%;display:block;border:1px solid var(--line);border-radius:8px;
  margin-bottom:8px;background:#fff}
.notes .txt{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}

/* last night */
.rv{background:var(--surface);border:1px solid var(--accent);border-left:4px solid var(--accent);
  border-radius:12px;padding:13px 15px;margin:14px 0}
.rv h3{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rv .praise{color:var(--good);font-weight:600;font-size:14.5px;margin-bottom:8px}
.rv .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin-top:9px}
.rv ul{margin:3px 0 0;padding-left:17px;font-size:14px}
.rv s{color:var(--bad)} .rv b{color:var(--good)}
.rv p{margin:2px 0;font-size:14px}

.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;
  padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.msg{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div id="gate" hidden>
  <h1>Parent view</h1>
  <p>Enter your passphrase.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="passphrase" aria-label="passphrase">
  <p class="err" id="gateErr"></p>
  <button class="primary" id="go" style="width:100%">Open</button>
</div>

<div class="wrap" id="board" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="daynav">
    <button id="prev" aria-label="previous day">‹</button>
    <span class="d" id="dayLabel">—</span>
    <button id="next" aria-label="next day">›</button>
    <button id="todayBtn" class="sm">Today</button>
  </div>
  <p class="stamp" id="stamp"></p>

  <div id="now"></div>
  <div id="stuck"></div>
  <div id="blocks"></div>
  <div id="review"></div>

  <div class="foot">
    <button class="sm" id="retake">Clear this day so she does it again</button>
    <span class="msg" id="retakeMsg"></span>
    <span style="margin-left:auto"><a href="../">kids' app</a> ·
      <button class="sm" id="forget">forget passphrase</button></span>
  </div>
</div>

<script src="../ink.js"></script>
<script>
var API  = "https://drills-api.anandm401-amazon.workers.dev";
var KIDS = ["Alvina", "Andrila"];
var BLOCKS = ["recap", "math", "think", "eng"];
var LABEL  = { recap:"Recap", math:"Math", think:"Thinking", eng:"English" };

var KEY = "", kid = KIDS[0], day = "", timer = null, cache = {};

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pad2(n){ return String(n).padStart(2,"0"); }

/* The family's own date. toISOString() is UTC, which after 4pm Pacific is
   already tomorrow - and the page would go blank exactly when it is read. */
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function shift(dstr, n){
  var p = dstr.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function pretty(dstr){
  var p = dstr.split("-");
  return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString(undefined,
    { weekday:"long", day:"numeric", month:"long" });
}
function ago(iso){
  if(!iso) return "";
  var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(s < 60) return s + "s ago";
  var m = Math.round(s/60);
  return m < 60 ? m + " min ago" : Math.round(m/60) + "h ago";
}

/* ---------- the gate ---------- */
function openGate(msg){
  $("#board").hidden = true; $("#gate").hidden = false;
  $("#gateErr").textContent = msg || ""; $("#pass").focus();
}
function fetchLive(k, d){
  return fetch(API + "/live?key=" + encodeURIComponent(k) + "&date=" + d)
    .then(function(r){
      if(r.status === 401) return { bad:true };
      if(!r.ok) throw new Error("server " + r.status);
      return r.json();
    });
}
$("#go").addEventListener("click", submit);
$("#pass").addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
function submit(){
  var k = $("#pass").value.trim();
  if(!k) return;
  $("#go").disabled = true; $("#gateErr").textContent = "checking…";
  fetchLive(k, day).then(function(d){
    $("#go").disabled = false;
    if(d.bad){ $("#gateErr").textContent = "That passphrase was not accepted."; return; }
    KEY = k;
    try{ localStorage.setItem("dd:parentKey", k); }catch(e){}
    $("#gate").hidden = true; $("#board").hidden = false;
    paint(d); start();
  }).catch(function(e){
    $("#go").disabled = false;
    $("#gateErr").textContent = "Could not reach the server. " + e.message;
  });
}
$("#forget").addEventListener("click", function(){
  try{ localStorage.removeItem("dd:parentKey"); }catch(e){}
  KEY = ""; stop(); $("#pass").value = ""; openGate("Forgotten on this device.");
});

/* ---------- the board ---------- */
function tabs(){
  $("#tabs").innerHTML = KIDS.map(function(k){
    return '<button class="tab' + (k === kid ? " on" : "") + '" data-kid="' + k + '">' + esc(k) + '</button>';
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ kid = b.dataset.kid; tabs(); refresh(); });
  });
}

function paint(d){
  cache.live = d;
  $("#dayLabel").textContent = pretty(day);
  $("#stamp").textContent = "updated " + ago(d.serverTime);
  $("#next").disabled = day >= todayStr();

  /* working right now */
  var now = (d.live || []).filter(function(r){ return r.kid === kid && r.date === day; });
  $("#now").innerHTML = now.map(function(r){
    var stuck = []; try{ stuck = JSON.parse(r.stuck || "[]"); }catch(e){}
    return '<div class="now"><b>On ' + esc(LABEL[r.block] || r.block) + ' now</b>' +
      '<span>' + r.answered + ' of ' + r.total + ' · ' + r.mins + ' min</span>' +
      stuck.map(function(s){ return '<span class="pill">Q' + esc(s.q) + ' ' + esc(s.why) + '</span>'; }).join("") +
      '<span style="margin-left:auto;color:var(--muted);font-size:12.5px">seen ' + ago(r.seen_at) + '</span></div>';
  }).join("");

  /* a block at a time: score, time, what went wrong, and a way into the notes */
  var results = {}, wrong = {};
  (d.today || []).forEach(function(r){ if(r.kid === kid && r.date === day) results[r.block] = r; });
  (d.misses || []).forEach(function(m){
    if(m.kid !== kid || m.date !== day) return;
    (wrong[m.block] = wrong[m.block] || []).push(m);
  });

  $("#blocks").innerHTML = BLOCKS.map(function(b){
    var r = results[b], ws = wrong[b] || [];
    var pc = r && r.total ? r.got / r.total : 0;
    var head = '<header><span class="nm">' + LABEL[b] + '</span>' +
      (r ? '<span class="tm">' + Math.round(r.secs/60) + ' min</span>' +
           '<span class="sc ' + (pc >= 0.8 ? "good" : "work") + '">' + r.got + ' / ' + r.total + '</span>'
         : '<span class="sc" style="color:var(--muted)">not done</span>') +
      '</header>';
    var body = !r ? ""
      : ws.length
        ? '<ul class="wrongs">' + ws.map(function(m){
            return '<li><span class="q">' + esc(m.q) + '</span>' +
              '<span class="gave">' + esc(m.gave || "blank") + '</span>' +
              '<span class="want">' + esc(m.want) + '</span></li>';
          }).join("") + '</ul>'
        : '<div class="allright">All correct.</div>';
    return '<section class="blk" data-b="' + b + '">' + head + body +
      '<div class="notehost"></div></section>';
  }).join("");

  loadNotes();
  loadReview();
  paintStuck(d);
}

/* The ones they said they could not do. This is the part that wants
   answering today, so it sits above everything else. */
function paintStuck(d){
  var mine = (d.stuck || []).filter(function(r){ return r.kid === kid; });
  var host = $("#stuck");
  if(!mine.length){ host.innerHTML = ""; return; }

  host.innerHTML = '<div class="stuckbox"><h3>' + esc(kid) +
    ' asked for help &middot; ' + mine.length + '</h3>' +
    mine.map(function(r, i){
      return '<div class="sq" data-i="' + i + '">' +
        '<div class="qt">' + esc(r.q || (r.block + " " + r.pad)) + '</div>' +
        '<div class="meta">' + esc(LABEL[r.block] || r.block) + ' &middot; ' + esc(r.date) +
          (r.answered ? ' &middot; <b style="color:var(--good)">answered</b>' : '') + '</div>' +
        (r.answered ? '' :
          '<textarea placeholder="Write it out step by step, the way a nine-year-old reads it.&#10;&#10;Step 1 ...&#10;&#10;Step 2 ...&#10;&#10;Tip: ..."></textarea>' +
          '<div class="row"><button class="sm primary" data-send="' + i + '">Send it to her</button>' +
          '<span class="msg"></span></div>') +
      '</div>';
    }).join("") + '</div>';

  host.querySelectorAll("[data-send]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var wrap = btn.closest(".sq"), i = +wrap.dataset.i, r = mine[i];
      var text = wrap.querySelector("textarea").value.trim();
      var msg = wrap.querySelector(".msg");
      if(!text){ msg.textContent = "Write something first."; return; }
      btn.disabled = true; msg.textContent = "sending…";
      fetch(API + "/solution", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ key:KEY, kid:r.kid, date:r.date, block:r.block,
                               pad:r.pad, solution:text }) })
        .then(function(res){
          btn.disabled = false;
          if(res.ok){
            msg.innerHTML = '<span class="sent">Sent. She sees it when she taps Update.</span>';
            wrap.querySelector("textarea").disabled = true;
          } else msg.textContent = "That did not work (" + res.status + ").";
        }).catch(function(){ btn.disabled = false; msg.textContent = "Could not reach the server."; });
    });
  });
}

/* A notes button only where there is something to open. Nothing to press
   when she wrote nothing - an empty panel is worse than no button. */
function loadNotes(){
  if(!KEY) return;
  fetch(API + "/ink?key=" + encodeURIComponent(KEY) +
        "&kid=" + encodeURIComponent(kid) + "&date=" + day)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var byBlock = {};
      (d.pads || []).forEach(function(p){ (byBlock[p.block] = byBlock[p.block] || []).push(p); });
      Object.keys(byBlock).forEach(function(b){
        var sec = document.querySelector('.blk[data-b="' + b + '"]');
        if(!sec) return;
        var pads = byBlock[b], n = pads.length;
        var head = sec.querySelector("header");
        var btn = document.createElement("button");
        btn.className = "sm";
        btn.textContent = "📝 " + n + (n === 1 ? " note" : " notes");
        btn.style.marginLeft = "4px";
        head.insertBefore(btn, head.querySelector(".tm") || head.querySelector(".sc"));
        var host = sec.querySelector(".notehost"), open = false;
        btn.addEventListener("click", function(){
          open = !open;
          if(!open){ host.innerHTML = ""; return; }
          host.innerHTML = '<div class="notes">' + pads.map(function(p){
            var data = {}; try{ data = JSON.parse(p.data || "{}"); }catch(e){}
            var bits = (data.imgs || []).map(function(src){
              return '<img src="' + src + '" alt="' + esc(p.pad) + '">'; }).join("");
            if(!bits && (data.s || []).length) bits = '<canvas data-ink="' + esc(p.pad) + '"></canvas>';
            if(data.text) bits += '<div class="txt">' + esc(data.text) + '</div>';
            return bits;
          }).join("") + '</div>';
          /* draw any handwriting captured on screen */
          host.querySelectorAll("canvas[data-ink]").forEach(function(cv, i){
            var p = pads.filter(function(x){ return (JSON.parse(x.data||"{}").s||[]).length; })[i];
            if(p && window.Ink) Ink.replay(cv, JSON.parse(p.data), { speed: 1000 });
          });
        });
      });
    }).catch(function(){});
}

function loadReview(){
  var host = $("#review");
  host.innerHTML = "";
  fetch(API + "/review?kid=" + encodeURIComponent(kid) + "&date=" + day)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var rv = d && d.review;
      if(!rv) return;
      var sp = rv.spelling || [], es = rv.essay || {}, fx = es.fixes || [];
      host.innerHTML = '<div class="rv"><h3>What I found reading this day</h3>' +
        (rv.praise ? '<div class="praise">' + esc(rv.praise) + '</div>' : "") +
        (sp.length ? '<div class="lab">Spelling</div><ul>' + sp.map(function(w){
            return '<li><s>' + esc(w.wrote) + '</s> &rarr; <b>' + esc(w.right) + '</b></li>'; }).join("") + '</ul>' : "") +
        (es.summary ? '<div class="lab">Writing</div><p>' + esc(es.summary) + '</p>' : "") +
        (fx.length ? '<ul>' + fx.map(function(f){
            return '<li><s>' + esc(f.was) + '</s> &rarr; <b>' + esc(f.should) + '</b></li>'; }).join("") + '</ul>' : "") +
        ((rv.math && rv.math.approach) ? '<div class="lab">Method</div><p>' + esc(rv.math.approach) + '</p>' : "") +
        ((rv.math && rv.math.note) ? '<p>' + esc(rv.math.note) + '</p>' : "") +
        '</div>';
    }).catch(function(){});
}

/* ---------- day navigation ---------- */
$("#prev").addEventListener("click", function(){ day = shift(day, -1); refresh(); });
$("#next").addEventListener("click", function(){ if(day < todayStr()){ day = shift(day, 1); refresh(); } });
$("#todayBtn").addEventListener("click", function(){ day = todayStr(); refresh(); });

/* ---------- retake ---------- */
$("#retake").addEventListener("click", function(){
  var b = $("#retake");
  if(b.dataset.armed !== "1"){
    b.dataset.armed = "1"; b.textContent = "Yes, clear " + kid + "'s " + day;
    setTimeout(function(){ b.dataset.armed = ""; b.textContent = "Clear this day so she does it again"; }, 8000);
    return;
  }
  b.dataset.armed = ""; b.textContent = "Clear this day so she does it again";
  b.disabled = true; $("#retakeMsg").textContent = "clearing…";
  fetch(API + "/retake", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ key:KEY, kid:kid, date:day }) })
    .then(function(r){
      b.disabled = false;
      $("#retakeMsg").textContent = r.ok
        ? "Cleared. It resets on her iPad next time she opens the app."
        : "That did not work (" + r.status + ").";
      if(r.ok) refresh();
    }).catch(function(){ b.disabled = false; $("#retakeMsg").textContent = "Could not reach the server."; });
});

/* ---------- loop ---------- */
function refresh(){
  if(!KEY) return;
  fetchLive(KEY, day).then(function(d){
    if(d.bad){ stop(); openGate("The passphrase changed."); return; }
    paint(d);
  }).catch(function(){ $("#stamp").textContent = "could not reach the server"; });
}
function start(){ stop(); timer = setInterval(refresh, 30000); }
function stop(){ if(timer){ clearInterval(timer); timer = null; } }
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && KEY){ refresh(); start(); } else stop();
});

/* ---------- boot ---------- */
(function(){
  day = todayStr();
  tabs();
  var saved = "";
  try{ saved = localStorage.getItem("dd:parentKey") || ""; }catch(e){}
  if(!saved){ openGate(); return; }
  fetchLive(saved, day).then(function(d){
    if(d.bad){ openGate("Saved passphrase no longer works."); return; }
    KEY = saved; $("#gate").hidden = true; $("#board").hidden = false;
    paint(d); start();
  }).catch(function(){ openGate("Could not reach the server."); });
})();
</script>
</body>
</html>
